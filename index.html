 {id:"t3c2a", step:"t3a", title:"Case 2 (A): Malaga's patent, paid over 10 years", text:"In January N Malaga acquires a patent: an initial payment of €30,000, then a licence fee of €10,000 at the end of each year for 10 years. Discount rate 8% (annuity factor for 10 years at 8%: 6.71). Useful life 10 years.",
  fields:[["c","Cost of the patent (€)",97100],["l","Liability recognised in January N (€)",67100],["a","Amortisation for year N (€)",9710],["i","Interest expense for year N (€)",5368],["e","Liability on 31 Dec N after the first fee (€)",62468]],
  hint:"Cost = what you pay now + the present value of what you will pay. The future payments are a liability that earns interest.",
  sol:["Present value of the fees: 10,000 × 6.71 = 67,100, a liability. Cost = 30,000 + 67,100 = 97,100.","Amortisation N: 97,100 / 10 = 9,710.","Interest N: 67,100 × 8% = 5,368.","The 10,000 payment covers 5,368 interest and repays 4,632, so the liability falls to 67,100 − 4,632 = 62,468."]},
 {id:"t3c3", step:"t3c", title:"Case 3: Bilbao's airplane after a price crash", text:"In January N1 Bilbao buys an airplane for €250 million, depreciated straight-line over 25 years. On 31 December N5 airplane prices have collapsed: it could be sold for €180 million. No cash flow information is available. Enter amounts in € million.",
  fields:[["c","Carrying amount on 31 Dec N5 before the test",200],["r","Recoverable amount",180],["i","Impairment loss",20],["d","Depreciation per year from N6",9],["b","Book value on 31 Dec N6",171]],
  hint:"Five years of depreciation have passed. Recoverable amount = the higher of fair value less costs to sell and value in use; here only the fair value is known. After an impairment, depreciate the new amount over the remaining life.",
  sol:["Depreciation is 250 / 25 = 10 a year. After 5 years: 250 − 50 = 200.","No value in use can be calculated, so the recoverable amount is the fair value: 180.","Impairment loss: 200 − 180 = 20, an expense in N5.","From N6, 180 over the remaining 20 years = 9 a year.","31 Dec N6: 180 − 9 = 171."]},
 {id:"t3c4", step:"t3d", title:"Case 4: the goodwill of SEAT", text:"SEAT is a cash-generating unit in the VW group with net operating assets of 5,500 MU (including goodwill 500). BMW offers 5,100 MU for them; selling would cost 350 MU. Expected free cash flows: x2 750, x3 700, x4 650, x5 590, then 540 every year from x6 for ever. WACC 11%. Enter amounts in MU, rounded to one decimal.",
  fields:[["f","Fair value less costs to sell",4750,0.5],["v","Value in use",5341.5,2],["r","Recoverable amount",5341.5,2],["i","Impairment loss",158.5,2],["g","Goodwill after the test",341.5,2]],
  hint:"Value in use: discount x2 to x5 normally, then the perpetuity from x6: 540 / 0.11, valued at the end of x5, discounted 4 years. Recoverable amount = the higher of the two values. A CGU's loss hits goodwill first.",
  sol:["Fair value less costs to sell: 5,100 − 350 = 4,750.","Value in use: 750/1.11 + 700/1.11² + 650/1.11³ + 590/1.11⁴ = 2,107.8, plus the perpetuity 540 / 0.11 = 4,909.1 discounted by 1.11⁴ = 3,233.8. Total 5,341.5.","Recoverable amount = higher of 4,750 and 5,341.5 = 5,341.5.","Impairment loss: 5,500 − 5,341.5 = 158.5.","It is taken from goodwill first: 500 − 158.5 = 341.5."]},
 {id:"t3c5", step:"t3d", title:"Case 5: Porto's three CGUs", text:"Porto has three CGUs with goodwill. CGU A: building 400,000 (fair value less costs 600,000, value in use 800,000), machinery 2,000,000, goodwill 900,000; CGU value in use 2,500,000. CGU B: building 500,000 (value in use 450,000; property prices dropped), machinery 3,000,000, goodwill 200,000; CGU value in use 3,300,000. CGU C: building 700,000, machinery 1,000,000, goodwill 500,000; CGU value in use 1,640,000. Allocate the impairment losses.",
  fields:[["ag","CGU A: goodwill after the test",100000],["bb","CGU B: building after the test",450000],["bm","CGU B: machinery after the test",2850000],["bg","CGU B: goodwill after the test",0],["cb","CGU C: building after the test",675295,2],["cm","CGU C: machinery after the test",964705,2],["cg","CGU C: goodwill after the test",0]],
  hint:"Test an asset on its own first when you can (B's building). Then each CGU: loss = carrying amount − recoverable amount. Cut goodwill first, then the other assets in proportion to their carrying amounts, never below an asset's own recoverable amount.",
  sol:["A: carrying 3,300,000 vs 2,500,000, so a loss of 800,000, all taken from goodwill: 900,000 → 100,000.","B: first the building alone: 500,000 → 450,000 (loss 50,000). The CGU is now 3,650,000 vs 3,300,000, a loss of 350,000. Goodwill takes 200,000 (→ 0). The other 150,000 goes to the machinery (the building is already at its recoverable amount): 3,000,000 → 2,850,000.","C: 2,200,000 vs 1,640,000, a loss of 560,000. Goodwill takes 500,000 (→ 0). The other 60,000 is split by carrying amount: building 60,000 × 700/1,700 = 24,705 (→ 675,295), machinery 35,295 (→ 964,705)."]},
 {id:"t3c8", step:"t3f", title:"Case 8: RENT's office lease", text:"On 1 January N1 RENT leases an office building (useful life 40 years). Payments of €300,000 a year: the first on 1 January N1, then at the end of each year, the last on 31 December N12. Incremental borrowing rate 4.5% (annuity factor 12 years: 9.1186).",
  fields:[["l","Lease liability on 1 Jan N1 (€)",2735574,300],["u","Right-of-use asset on 1 Jan N1 (€)",3035574,300],["d","Depreciation for N1 (€)",252964,30],["i","Interest expense for N1 (€)",123101,30],["e","Lease liability on 31 Dec N1 (€)",2558675,300]],
  hint:"The liability is the present value of the FUTURE payments only (12 payments at the year ends). The payment made on day one goes into the right-of-use asset. Depreciate over the shorter of lease term (12) and useful life (40).",
  sol:["Liability: 300,000 × 9.1186 = 2,735,574 (the 1 January payment is not a future payment).","Right-of-use asset: 2,735,574 + 300,000 paid on day one = 3,035,574.","Depreciation: 3,035,574 / 12 years = 252,964.","Interest N1: 2,735,574 × 4.5% = 123,101.","The 31 December payment of 300,000 covers interest 123,101 and repays 176,899: liability 2,735,574 − 176,899 = 2,558,675."]},
 {id:"t3c9a", step:"t3f", title:"Case 9 (A): Burger Queen's scooters", text:"BQ leases delivery scooters for 5 years, €10,000 at the end of each year. Incremental borrowing rate 4% (annuity factor 5 years: 4.4518).",
  fields:[["l","Lease liability = right-of-use asset at the start (€)",44518,5],["d","Depreciation for N1 (€)",8904,2],["i","Interest expense for N1 (€)",1781,2],["e","Lease liability on 31 Dec N1 (€)",36299,5]],
  hint:"Present value of 5 payments at 4%. Each payment = interest on the opening liability + repayment.",
  sol:["Liability and right-of-use asset: 10,000 × 4.4518 = 44,518.","Depreciation: 44,518 / 5 = 8,904.","Interest: 44,518 × 4% = 1,781.","Repayment 10,000 − 1,781 = 8,219, so the liability is 44,518 − 8,219 = 36,299."]},
 {id:"t3c9b", step:"t3f", title:"Case 9 (B): Burger Queen's Paris building", text:"BQ leases a building for 10 years with an option to extend by 5, which it is not reasonably certain to use. €50,000 at the end of each year. Initial direct costs €20,000; the owner reimburses €5,000 of them as an incentive. Borrowing rate 5% (annuity factor 10 years: 7.7217).",
  fields:[["t","Lease term (years)",10],["l","Lease liability at the start (€)",386087,5],["u","Right-of-use asset at the start (€)",401087,5],["d","Depreciation for N1 (€)",40109,2],["i","Interest expense for N1 (€)",19304,2]],
  hint:"Count the option only if you are reasonably certain to use it. The right-of-use asset adds direct costs and deducts incentives received.",
  sol:["Lease term: 10 years; the extension isn't reasonably certain.","Liability: 50,000 × 7.7217 = 386,087.","Right-of-use asset: 386,087 + 20,000 − 5,000 = 401,087.","Depreciation: 401,087 / 10 = 40,109.","Interest N1: 386,087 × 5% = 19,304."]},
 {id:"t4e3", step:"t4e", title:"Exercise 3: Airbus's shares in 2023", text:"From Airbus's 2023 annual report: par value €1. In 2023, 2,254,426 new shares were issued for the employee share plan; capital stock rose by €2 million and share premium from €3,837 million to €3,983 million. Treasury shares went from 647,500 shares (€68 million) to 3,037,467 shares (€390 million). No treasury shares were sold or cancelled.",
  fields:[["p","Average issue price of the new shares (€)",65.65,0.05],["n","Treasury shares bought in 2023 (net, number)",2389967],["a","Amount spent on them (€ million)",322],["b","Average buy-back price (€)",134.73,0.05]],
  hint:"Issue price = (increase in capital + increase in share premium) / number of new shares. For treasury shares, use the change in the count and in the amount.",
  sol:["Money raised: capital +2 + share premium +146 (3,983 − 3,837) = €148 million, for 2,254,426 shares: about €65.65 each, far below the 2023 market price (above €112): that discount is the employee incentive.","Treasury shares: 3,037,467 − 647,500 = 2,389,967 shares, for 390 − 68 = €322 million.","Average buy-back price: 322,000,000 / 2,389,967 = €134.73, close to the market price."]},
 {id:"t5e2", step:"t5c", title:"Exercise 2: CleanMotors' ROCE", text:"CleanMotors (in €): operating profit N 21,500 (N-1 11,625); operational profit before non-recurring items N 28,900 (N-1 12,125); sales N 270,000 (N-1 250,000). Non-current assets N 229,300 (N-1 108,946), of which other non-current financial assets 25,300 (7,000). Working capital needs N 114,700 (N-1 46,054). Tax rate 20%. Enter percentages like 5.00 and the turnover with 2 decimals.",
  fields:[["n","NOPAT year N",17200],["ce","Capital employed year N",344000],["r","ROCE year N (%)",5.0,0.05],["r1","ROCE year N-1 (%)",6.0,0.05],["m","NOPAT margin year N (%)",6.37,0.02],["t","Capital employed turnover year N",0.78,0.01],["rr","ROCE N with operational profit, before non-recurring items (%)",6.72,0.02],["rp","ROCE N as published: operational profit and without other financial assets (%)",7.25,0.02]],
  hint:"NOPAT = operating profit × (1 − 20%). Capital employed = non-current assets + working capital needs. ROCE = NOPAT / capital employed = margin × turnover.",
  sol:["NOPAT N: 21,500 × 0.8 = 17,200 (N-1: 9,300).","Capital employed N: 229,300 + 114,700 = 344,000 (N-1: 108,946 + 46,054 = 155,000).","ROCE N: 17,200 / 344,000 = 5.00%; N-1: 9,300 / 155,000 = 6.00%. It fell.","Why: margin rose (17,200 / 270,000 = 6.37% vs 3.72%) but turnover collapsed (270,000 / 344,000 = 0.78 vs 1.61) after heavy investment.","With operational profit: 28,900 × 0.8 = 23,120; 23,120 / 344,000 = 6.72%.","As published, also without other financial assets: capital employed 204,000 + 114,700 = 318,700; 23,120 / 318,700 = 7.25%. Both adjustments flatter ROCE, so a company should explain and reconcile them."]},
 {id:"t5e4", step:"t5d", title:"Exercise 4: adjusting Lufthansa's depreciation", text:"Lufthansa depreciates aircraft over 20 years with 5% residual value (4.75% a year). Analysts prefer 25 years and 5% (3.8% a year). Aircraft cost 1 Jan 2022: €32,036 million; accumulated depreciation reported: 18,836; average age 12.38 years. 2022: operating profit 1,232, tax rate 25%, equity 8,474, borrowings 15,151, cash 1,790. Amounts in € million, one decimal; percentages like 4.23.",
  fields:[["a","Accumulated depreciation at 3.8% on 1 Jan 2022",15069,2],["d","Lower depreciation expense for 2022",304.3,0.5],["r","ROCE as reported (%)",4.23,0.02],["ra","Adjusted ROCE (%)",4.63,0.02]],
  hint:"Accumulated depreciation = rate × average age × cost. The yearly difference = (4.75% − 3.8%) × cost. Capital employed = equity + borrowings − cash; the adjustment adds the after-tax increase to equity.",
  sol:["At 3.8%: 0.038 × 12.38 × 32,036 = 15,069, against 18,836 reported. PP&E is 3,767.8 higher, minus 25% deferred tax (941.9), so equity is 2,825.8 higher.","2022 depreciation is lower by (0.0475 − 0.038) × 32,036 = 304.3; after 25% tax, profit is 228.3 higher.","Reported: capital employed 8,474 + 15,151 − 1,790 = 21,835; ROCE 1,232 × 0.75 / 21,835 = 4.23%.","Adjusted: capital employed 21,835 + 3,054.1 = 24,889.1; EBIT 1,232 + 304.3 = 1,536.3; ROCE 1,536.3 × 0.75 / 24,889.1 = 4.63%."]},
 {id:"x25p2", step:"t3d", title:"2025 mock exam, Part 2: OMEGA's two CGUs (10 points)", text:"Real estate downturn: impairment test on 31 Dec N. CGU X: Building BV 700,000 (value in use 600,000, FV less costs to sell 550,000); Machinery BV 1,500,000 and Goodwill BV 800,000 (nothing measurable alone). Total BV 3,000,000, value in use of the CGU 2,400,000, FV less costs to sell of the CGU cannot be determined. CGU Y: Land BV 400,000 (VIU 500,000, FVLCS 450,000); Building BV 900,000 (VIU 750,000, FVLCS 700,000); Machinery BV 2,200,000; Goodwill BV 500,000. Total BV 4,000,000, VIU 3,600,000, FVLCS 3,200,000. Fill in the book values after the test.",
  fields:[["xb","CGU X: Building after",600000],["xm","CGU X: Machinery after",1500000],["xg","CGU X: Goodwill after",300000],["yl","CGU Y: Land after",400000],["yb","CGU Y: Building after",750000],["ym","CGU Y: Machinery after",2200000],["yg","CGU Y: Goodwill after",250000],["ni","Impact on N net income (negative = loss)",-1000000]],
  hint:"First test each asset that has its own recoverable amount (the higher of value in use and FV less costs to sell). Then compare the whole CGU with its recoverable amount; what is still missing comes off goodwill first.",
  sol:["CGU X: recoverable amount = value in use 2,400,000 (FV less costs to sell can't be determined). Loss 3,000,000 − 2,400,000 = 600,000.","Building alone: recoverable = higher of 600,000 and 550,000 = 600,000 < 700,000, so −100,000. The remaining 500,000 comes off goodwill: 800,000 → 300,000. Machinery stays 1,500,000. Total 2,400,000.","CGU Y: recoverable = higher of 3,600,000 and 3,200,000 = 3,600,000. Loss 400,000.","Land: 500,000 > 400,000, no impairment (and never written up under the cost model). Building: higher of 750,000 and 700,000 = 750,000 < 900,000, so −150,000. The remaining 250,000 comes off goodwill: 500,000 → 250,000. Total 3,600,000.","Net income: −600,000 − 400,000 = −1,000,000. The answer key agrees on every number."]},
 {id:"x25p3", step:"t3f", title:"2025 mock exam, Part 3: NEPTUNE's warehouse lease (10 points)", text:"1 Jan N: 8-year lease of a warehouse, 80,000 € paid at the end of each year (first 31 Dec N), no renewal option. Useful life of the warehouse 30 years. Incremental borrowing rate 5%. Annuity factor (5%, 8 years) 6.4632. Give the figures at the start and at 31 Dec N (round to whole euros). Then answer question 3 on paper: the CFO says leasing keeps debt off the balance sheet.",
  fields:[["l0","Lease liability = right-of-use asset on 1 Jan N",517056,1],["dep","Depreciation N",64632,1],["int","Interest expense N",25853,1],["rou","Right-of-use asset on 31 Dec N",452424,1],["l1","Lease liability on 31 Dec N",462909,1],["cur","…of which current (repaid in N+1)",56855,2],["ncur","…of which non-current",406054,2],["eq","Effect on equity (net income) for N",-90485,1]],
  hint:"Liability = payment × annuity factor. Depreciate the right-of-use asset over the shorter of lease term and useful life. Interest = 5% of the opening liability; the rest of the 80,000 repays the liability.",
  sol:["Liability = 80,000 × 6.4632 = 517,056. The right-of-use asset starts at the same amount (no prepayments or direct costs).","Depreciation over the 8-year lease term, not 30 years (ownership doesn't pass): 517,056 / 8 = 64,632. Right-of-use asset at year end 452,424.","Interest 517,056 × 5% = 25,853. Repayment 80,000 − 25,853 = 54,147. Liability at year end 462,909.","Split: next year's interest 462,909 × 5% = 23,145, so 80,000 − 23,145 = 56,855 is repaid in N+1 (current); 406,054 is non-current.","Income statement: depreciation 64,632 + interest 25,853 = 90,485 expense, so equity −90,485.","Check that it balances: assets 452,424 − cash paid 80,000 = 372,424; liabilities and equity 462,909 − 90,485 = 372,424.","⚠ The official answer key gets the numbers right but its balance sheet table is wrong: it puts cash (−80,000) on the equity and liabilities side and leaves out the −90,485 in equity, so it doesn't balance. Cash belongs with the assets. It also doesn't split the liability into current and non-current; show the split in the exam.","Question 3: the CFO is wrong. Under IFRS 16 the lessee shows a right-of-use asset and a lease liability, so the lease raises debt and gearing almost like a bank loan."]},
 {id:"x25p5", step:"t5e", title:"2025 mock exam, Part 5: HORIZON's ROCE and EVA (6 points)", text:"HORIZON Group, year N (€m). Revenue 12,500; operating profit 1,670. Balance sheet 31 Dec N, equity and liabilities: share capital 500, share premium 1,800, retained earnings 4,200, NCI 350, non-current borrowings 3,200, non-current lease liabilities 720, current borrowings 800, current lease liabilities 230, trade payables 1,400, other current liabilities 200. Cash 1,070. Tax rate 25%, WACC 7%. Capital employed by the capital approach: equity + financial debt − cash (as the question says). Give % to two decimals.",
  fields:[["nopat","NOPAT",1252.5,0.5],["eq","Equity (including NCI)",6850],["fd","Financial debt (borrowings + lease liabilities)",4950],["ce","Capital employed",10730],["roce","ROCE (%)",11.67,0.02],["m","NOPAT margin (%)",10.02,0.02],["to","Capital employed turnover (×)",1.165,0.005],["eva","EVA",501.4,0.35]],
  hint:"NOPAT = operating profit × (1 − 25%). Lease liabilities are financial debt. ROCE = NOPAT margin × turnover. EVA = NOPAT − WACC × capital employed.",
  sol:["NOPAT = 1,670 × 0.75 = 1,252.5.","Equity = 500 + 1,800 + 4,200 + 350 = 6,850. Financial debt = 3,200 + 800 + 720 + 230 = 4,950. Capital employed = 6,850 + 4,950 − 1,070 = 10,730.","ROCE = 1,252.5 / 10,730 = 11.67%. Margin 1,252.5 / 12,500 = 10.02%; turnover 12,500 / 10,730 = 1.165; 10.02% × 1.165 = 11.67%.","EVA = 1,252.5 − 7% × 10,730 = 501.4. The key writes 501.1 because it rounds ROCE to 11.67% first; both are fine. Positive, so HORIZON creates value.","⚠ This exam's balance sheet does not balance: equity and liabilities add up to 13,400, not the 12,700 printed (N−1: 12,030, not 11,630). So the asset approach (operating assets − operating liabilities) gives 10,030 and a ROCE of 12.5%. Use the capital approach the question names, as here.","⚠ Also: opening cash in the cash flow statement is 880, but the N−1 balance sheet shows 980. And operating profit leaves out the associates' 35 while capital employed includes the 280 invested in them. The course formula does it this way; follow it, don't fix it in the exam."]}
];

var ALLCASES = T2CASES.concat(FIXCASES);
/* the page where each case starts, so "Open the cases" opens at this step's case, not page 1 */
var CASEPAGES = {"t1-cases": {"1": 1, "2": 6, "3": 10}, "t2-cases": {"1": 1, "2": 3, "3": 4, "4": 6, "5": 8, "6": 9, "7": 11, "8": 11, "9": 12, "10": 14, "11": 14}, "t2-solutions": {"1": 1, "2": 3, "3": 5, "4": 8, "5": 10, "6": 11, "7": 14, "8": 15, "9": 17, "10": 20, "11": 24}, "t3-cases": {"1": 1, "2": 2, "3": 2, "4": 2, "5": 4, "6": 5, "7": 5, "8": 5, "9": 6}, "t3-solutions": {"1": 1, "2": 2, "3": 2, "4": 3, "5": 7, "6": 8, "7": 9, "8": 10, "9": 11}, "t4-cases": {"1": 1, "2": 1, "3": 2, "4": 3}, "t4-solutions": {"1": 1, "2": 4, "3": 5, "4": 6}, "t5-cases": {"1": 2, "2": 5, "3": 6, "4": 8}, "t5-solutions": {"1": 2, "2": 7, "3": 11, "4": 14}};
function casePage(doc, label){ var m = String(label||"").match(/\d+/), pg = m ? (CASEPAGES[doc]||{})[m[0]] : 0; return pg || (S.docPos[doc]||1); }
function fieldOk(f, v){ var n = parseNum(v); if(isNaN(n)) return false; return Math.abs(n - f[2]) <= (f[3] || 0.001); }
function fixX(d){ return {type:"case:"+d.id, caseId:d.id, caseTitle:d.title, P:"", T:"", hint:false, checked:false, values:{}, ok:null, intro:d.text, sheets:d.sheets||[], fields:d.fields.map(function(f){ return f.slice(); }), hintText:d.hint, sol:d.sol.slice()}; }
function gen(type){
  if(/^case:/.test(type)){ var cd = ALLCASES.filter(function(d){ return d.id===type.slice(5); })[0]; if(cd) return cd.fields ? fixX(cd) : caseX(JSON.parse(JSON.stringify(cd))); }
  if(/^e[1-4]$/.test(type)) return genCaseRandom(type);
  var pk = pick(PARENTS), P = CO[pk].name, T = CO[pk].target;
  var Es = pick([100,150,200]), Ls = pick([20,40,60]), As = Es + Ls;
  var Ep = pick([400,500,600]), Lp = pick([150,200,300]);
  var x = {type:type, P:P, T:T, hint:false, checked:false, values:{}, ok:null};
  if(type==="e1"){
    var I = Es, Ap = Ep + Lp - I;
    x.intro = P+" buys 100% of "+T+" for €"+I+"k. These are the two balance sheets on the acquisition date (in €k).";
    x.sheets = [sheet(P, [["Investment in "+T, I],["Other assets", Ap]], [["Equity", Ep],["Liabilities", Lp]]), sheet(T, [["Assets", As]], [["Equity", Es],["Liabilities", Ls]])];
    x.fields = [["gw","Goodwill",0],["ta","Total consolidated assets",Ap+As],["eq","Consolidated equity",Ep],["li","Consolidated liabilities",Lp+Ls]];
    x.hintText = "Compare the price with "+T+"'s equity. If they are equal and nothing is said about fair values, nothing is left over.";
    x.sol = ["Purchase price allocation: price "+I+" − book value of "+T+"'s equity "+Es+" = 0. No fair value differences are given, so there is no goodwill.",
      "Add 100% of both companies' assets and liabilities: assets "+Ap+" + "+As+" = "+(Ap+As)+", liabilities "+Lp+" + "+Ls+" = "+(Lp+Ls)+".",
      "Eliminate the investment ("+I+") against "+T+"'s equity ("+Es+").",
      "What remains in equity is "+P+"'s own equity: "+Ep+". Check: "+(Ap+As)+" = "+Ep+" + "+(Lp+Ls)+"."];
  }
  if(type==="ppa"){
    var B = pick([80,100,120,150,180,200,250]), VD = pick([0,10,20,30,40,60]), GW = pick([-20,-10,0,10,20,30,40,50,70]), PP = B + VD + GW;
    x.intro = P+" buys 100% of "+T+" for €"+PP+"k. "+T+"'s book value of net assets (equity) is €"+B+"k. At fair value, its identifiable net assets are worth €"+(B+VD)+"k. Do the purchase price allocation in your head, without drawing.";
    x.sheets = [];
    x.fields = [["dif","Difference: price − book value",PP-B],["vd","Valuation difference: fair value − book value",VD],["gw","Goodwill: price − fair value (negative = badwill)",GW]];
    x.hintText = "Picture the stack from slide 23: book value ("+B+") at the bottom, the valuation difference on top of it, goodwill on top of that. The whole stack is the price ("+PP+").";
    x.sol = ["Difference: price "+PP+" − book value "+B+" = "+(PP-B)+".",
      "Valuation difference: fair value "+(B+VD)+" − book value "+B+" = "+VD+(VD?". It goes onto the identifiable assets (for example a brand, or buildings worth more than their book value).":". Nothing to revalue."),
      "Goodwill: price "+PP+" − fair value "+(B+VD)+" = "+GW+". "+(GW>0?"Positive, so it is an intangible asset on the consolidated balance sheet, tested for impairment every year.":GW<0?"Negative, so it is badwill: after re-checking the fair values, it is booked straight away as a gain in the income statement.":"Zero: the price exactly equals the fair value of the net assets."),
      "Check: valuation difference "+VD+" + goodwill "+GW+" = difference "+(PP-B)+"."];
  }
  if(type==="e2"){
    var V = pick([30,40,60,80]), G = pick([10,20,30,50]); I = Es + V + G; Ap = Ep + Lp - I;
    x.intro = P+" buys 100% of "+T+" for €"+I+"k. "+T+" has built its own brand, so the brand is not on "+T+"'s balance sheet (book value 0). The brand alone is worth €"+V+"k at fair value. Everything else on "+T+"'s balance sheet is already at fair value. Balance sheets on the acquisition date (in €k):";
    x.sheets = [sheet(P, [["Investment in "+T, I],["Other assets", Ap]], [["Equity", Ep],["Liabilities", Lp]]), sheet(T, [["Assets", As]], [["Equity", Es],["Liabilities", Ls]])];

 "4:orange-urd-2023":"t4b","4:airfrance-urd-2023":"t4a","lufthansa-ar-2025":"t4e","airbus-fs-2023":["t4o","t4d"],
 "orange-fy2023-presentation":"t5a","5:orange-urd-2023":"t5b","inditex-aa-2023":"t5b","dt-ar-2023":"t5b","veolia-urd-2023":"t5c","iag-ar-2023":"t5a","5:airfrance-urd-2023":"t5a","bayer-ar-2023":"t5b"};
var SLIDEHELP = {"1": {"16": "Air France-KLM's balance sheet, assets side. Non-current assets come first (goodwill, aircraft as 'flight equipment', right-of-use assets), then current assets (inventories, receivables, cash). The blue totals split the two: that split is what this step is about.", "17": "Same company, equity and liabilities side. Equity owed to the parent's shareholders is negative (−3,051 in 2023): past losses are bigger than the capital put in. 'Deferred revenue on ticket sales' is a current liability: tickets already paid, flights not yet flown.", "18": "easyJet's balance sheet in the UK layout: current liabilities are subtracted from current assets ('net current liabilities'). Same IFRS items, different layout. IAS 1 does not impose one format.", "19": "The second part: non-current liabilities are subtracted too, so the statement ends at net assets, which equal total equity. Here equity is negative (−181): accumulated losses exceed the capital.", "24": "Orange, by nature: each line is a type of cost (purchases, labour, depreciation). Compare with Vodafone on the next slide.", "25": "Vodafone, by function: costs grouped as cost of sales, selling and distribution, administration. That is why it can show a gross profit line.", "26": "Orange uses two statements: the income statement ends at net income (2,892). This second one starts there, adds other comprehensive income (−314) and ends at comprehensive income (2,578). OCI is split into items never recycled to profit (a) and items that may be (b).", "27": "Turkish Airlines uses one statement: profit or loss and OCI on the same page. The circles mark net profit and total comprehensive income.", "29": "Schneider's cash flow statement, indirect method: it starts from profit (4,169), adds back non-cash items such as depreciation, adjusts for working capital, and ends at operating cash flow (5,907).", "30": "Continued: investing (−1,048) and financing (−3,823) cash flows, then the change in cash (+792). Financing includes bonds issued and repaid, treasury shares bought and dividends paid.", "32": "Schneider's statement of changes in equity: each column is a part of equity, each row a movement (profit, OCI, new shares, dividends, treasury shares). You need it for the questions on the next slide.", "33": "Try the three questions yourself first. The teacher's notes below have the answers.", "1": "Title slide.", "2": "The course's five topics. In the Nov 2023 exam Topics 2 and 3 were worth the most points.", "3": "Course textbooks. Elliott & Elliott is the one the app links to under each step.", "4": "Reminder readings on accounting basics, if double entry feels rusty.", "5": "Title slide: Topic 1, IFRS in the EU and what IFRS financial statements contain.", "6": "Contents and readings for Topic 1: why the EU uses IFRS, the Conceptual Framework, and the five financial statements.", "7": "What you should be able to do by the end, including explaining other comprehensive income (OCI), a favourite quiz item.", "8": "Why IFRS: national rules made European companies impossible to compare, so the EU made IFRS (written by the private IASB) compulsory for some statements. More than 140 jurisdictions use it, not the US.", "9": "A world map of who doesn't use IFRS. The big one: the US uses its own US GAAP.", "10": "Who must use IFRS in the EU: listed groups for their consolidated statements, since 2005. Individual statements mostly stay in local rules (French, German, Spanish GAAP).", "11": "IFRS is made of four kinds of texts: IAS (old standards), IFRS (since 2001), SIC and IFRIC (interpretations). All four count as 'IFRS'.", "12": "The Conceptual Framework's goal: information useful for decisions. Two fundamental qualities: relevance and faithful representation. Four enhancing ones: comparability, verifiability, timeliness, understandability. Plus the cost constraint and the going concern assumption.", "13": "The hierarchy: if a specific standard and the Framework disagree, the standard wins. The Framework guides when no standard fits.", "14": "A full IFRS set: balance sheet, statement of comprehensive income, cash flow statement, statement of changes in equity, notes. Listed companies add segment reporting and earnings per share.", "15": "No fixed balance sheet layout, but current and non-current must be separated. Current = cash, or expected to be sold, used up or settled within 12 months or the operating cycle, or held for trading. Everything else is non-current.", "20": "Comprehensive income can be one statement, or two: the income statement plus a separate OCI statement. IAS 1 asks for very few lines; the rest is the company's choice.", "21": "The few lines IAS 1 requires on the face of the income statement: revenue, finance costs, share of associates' profit, tax, and so on.", "22": "Everything goes through profit or loss unless a standard says OCI. Expenses can be shown by nature (staff, materials, depreciation) or by function (cost of sales, selling, admin).", "23": "Same asset, two treatments: bought at 100, now 80 or 110. Through profit or loss, the gain or loss hits net income; through OCI it bypasses net income but still changes equity. Total comprehensive income is the same either way.", "28": "The three cash flow sections: operating (day-to-day business), investing (buying or selling long-term assets), financing (debt and equity). Operating cash can be shown direct (every receipt and payment) or indirect (starting from profit).", "31": "The statement of changes in equity shows, for each part of equity, what changed it: profit, OCI, and dealings with owners (new shares, dividends, buy-backs).", "34": "The notes explain how the statements were prepared, give what IFRS requires but isn't on the face, and add anything else needed to understand them. Often where the real story is.", "35": "IFRS 18 replaces IAS 1 from January 2027: new required subtotals in the income statement, and companies' own performance measures must be explained and reconciled.", "36": "The new required subtotals under IFRS 18: operating profit, and profit before financing and income taxes.", "37": "IFRS 18's five categories in the income statement: operating, investing, financing, income taxes, discontinued operations.", "38": "The teacher's quiz, part 1. Check yourself: 1 false (over 140 jurisdictions require IFRS), 2 true (the standard wins), 3 false (receivables collected within the normal operating cycle stay current, even beyond a year), 4 true.", "39": "Part 2: 5 false (not defined yet; IFRS 18 defines operating profit from 2027), 6 true, 7 false (direct or indirect are both allowed), 8 true, 9 false (IFRS 18 replaces IAS 1, not IAS 7).", "40": "Further academic readings. Optional."}, "3": {"13": "Volkswagen's policy for intangibles: bought ones at cost, amortised over their life; development costs capitalised once IAS 38's conditions are met; brands from acquisitions usually have an indefinite life, so they are tested for impairment instead of amortised.", "14": "Volkswagen's intangible asset movements in 2023: new capitalised development costs (9,275 + 1,868, circled in red) and their amortisation (5,120, circled in green). The policy from the previous slide, in numbers.", "15": "Volkswagen's R&D summary: of 21,779 spent, 11,142 was capitalised (51.2%). Amortisation of earlier capitalised costs was 5,187. Expense in profit or loss = 21,779 − 11,142 + 5,187 = 15,824.", "20": "Bayer's useful lives for intangibles with a finite life (patents 8–30 years, trademarks 10–35 and so on). They are amortised straight-line and checked for impairment indicators every year.", "32": "Ubisoft's goodwill impairment by cash-generating unit (its studios): 90.1m in 2022, after closing a label and weaker cash-flow forecasts for mobile games.", "57": "Orange's balance sheet shows right-of-use assets of 8,175 under IFRS 16. The table below: future lease payments of 9,658, with 3,257 due in 2029 or later, so many leases are long.", "58": "How right-of-use assets move: new leases add (+1,317), depreciation takes away (−1,522). The teacher's note explains why the leases are so long.", "59": "How the lease liability moves: new leases increase it, rent paid reduces it (−1,645). It ends at 8,568, split into non-current and current. The policy text: the liability is the present value of the lease payments not yet paid.", "1": "Title slide.", "2": "Title slide: Topic 3 covers non-current assets (what goes on the balance sheet and how it loses value) and leases.", "3": "Contents and readings. Elliott & Elliott chapters 17 and 18 are the textbook backup; the app shows the matching pages under each step.", "4": "What you should be able to do at the end. Good as a final self-check before the exam: can you do each line without notes?", "5": "Map of non-current assets. The exam focus here: intangible assets (including goodwill), measurement after purchase (depreciation, amortisation) and impairment. PPE basics come from earlier courses.", "6": "The four parts of this topic: recognising intangibles, measuring PPE and intangibles later, impairment, leases.", "7": "Section start: when does an intangible asset go on the balance sheet?", "8": "The question to answer by the end of 3.1: the R&D director thinks all R&D is an asset that is amortised slowly. Spoiler: research is always an expense straight away; only development that meets strict conditions becomes an asset.", "9": "An intangible can only go on the balance sheet if all five conditions hold: identifiable, controlled, future benefits, probable, cost measurable. The point is protecting readers from 'assets' that are worth nothing. If you bought it, the conditions are assumed to be met.", "10": "Where the intangible came from decides everything. Bought separately: an asset. Bought in a takeover: an asset (brands, customer lists, separate from goodwill). Built yourself: mostly an expense (brands, staff training), except software, development costs and patents.", "11": "Research = always an expense. Development = an asset once the project is technically feasible and economically viable (IAS 38). It is amortised from when the product goes to market.", "12": "Examples to sort activities: searching for new knowledge (lab research) is research; designing and testing a specific new product before production is development.", "16": "Section start: what happens to assets after they are recognised.", "17": "Two models after purchase: the cost model (cost minus depreciation minus impairment), used almost everywhere in Europe, and the revaluation model (fair value), left for the advanced course.", "18": "Cost model questions: depreciable base (cost − residual value), useful life, method (straight-line, declining, output). Component approach: big parts of one asset, like an aircraft's engines, are depreciated separately.", "19": "Intangibles: limited life (licence, patent) means amortised; indefinite life (goodwill, many brands) means not amortised but tested for impairment every year. Fair value is only allowed with an active market, which unique assets like brands never have.", "21": "Section start: impairment, writing an asset down when it's worth less than its book value.", "22": "When to test: assets with a definite life only when there's a warning sign (market value drops, technology changes, damage, poor performance). Goodwill and indefinite-life intangibles: every year, no matter what.", "23": "The question for 3.3: the machine can't produce cash on its own, so how is it tested? Answer on slide 31: group it with other assets into a cash-generating unit (CGU).", "24": "The impairment test in one picture: compare the carrying amount with the recoverable amount, which is the HIGHER of fair value less costs to sell and value in use. If the carrying amount is higher, the difference is the impairment loss.", "25": "Value in use = present value of the cash the asset will bring in (forecasts usually up to 5 years), discounted at a pre-tax rate that reflects its risk. If no rate is available, the WACC can be used.", "26": "Exercise 3.1: carrying amount 200,000. Fair value 150,000. Value in use = 40,000 × 3.993 ≈ 160,000. Try the impairment loss before the next slide.", "27": "Recoverable amount = higher of 150,000 and 160,000 = 160,000. Impairment loss = 200,000 − 160,000 = 40,000.", "28": "The effect: the machine drops by 40,000 and an impairment expense of 40,000 hits profit. From next year, depreciation is based on the new amount: 160,000 / 5 = 32,000 a year.", "29": "The same as a journal entry: Dr impairment loss 40,000, Cr accumulated impairment 40,000.", "30": "Reversals: if the reason for an impairment disappears, the asset can be written back up, but never above what it would have been without the impairment. Goodwill impairment can never be reversed.", "31": "If an asset can't produce cash alone, test the smallest group of assets that does: the cash-generating unit (CGU).", "33": "Exercise 3.2: the Pritt division is a CGU that includes 900,000 of goodwill. Note its total carrying amount before the next slide.", "34": "Carrying amount 2,400,000, recoverable amount 1,900,000, so the impairment loss is 500,000.", "35": "Order for spreading a CGU's loss: first cut goodwill, then the other assets in proportion to their carrying amounts, but no asset below its own fair value less costs to sell, its value in use, or zero.", "36": "Here the whole 500,000 fits into goodwill (900,000), so only goodwill drops, to 400,000. Profit falls by 500,000.", "37": "Journal entry: Dr impairment loss 500,000, Cr goodwill 500,000. This loss can never be reversed.", "38": "What analysts watch: how much was capitalised as intangibles, depreciation and amortisation choices, and impairment tests. All of these move profit through management judgement.", "39": "Section start: leases.", "40": "The business question: buy an asset (plant, offices, IT) or rent it? Since IFRS 16 the accounting answer is much closer either way for the renter.", "41": "The COO thinks leasing keeps the 150m line and its debt off the balance sheet. Under IFRS 16 that's wrong: the company shows a right-of-use asset AND a lease liability, and the expense becomes depreciation plus interest.", "42": "Lessor = owner, lessee = user. IFRS 16 has applied since 2019. It changed mostly the lessee's side: almost every lease now goes on the balance sheet. Under the old IAS 17, operating leases stayed off it.", "43": "Two exemptions, for the lessee only: low-value assets (around 5,000 USD new) and short leases (12 months or less). Those can stay a simple expense.", "44": "Lease or service? It's a lease when the customer controls the use of a specific asset. It's a service when the supplier keeps control and just delivers a result.", "45": "Control of use means both: the right to almost all the benefits from using the asset, and the right to direct how and for what it is used.", "46": "The three-question checklist: 1) is a specific asset identified, with no real right for the supplier to swap it? 2) does the customer get almost all the economic benefits? 3) does the customer direct the use? All three yes = lease.", "47": "Exercise 3.3: one trip, route and dates fixed in the contract, the supplier runs the ship. Decide: lease or service?", "48": "1 and 2 are met (a specific ship, all its capacity), but the customer does not direct the use: the how and when were fixed in the contract and the supplier operates. So it's a service, not a lease.", "49": "Exercise 3.4: five years, and the customer decides the cargo, the ports and the timing. Decide: lease or service?", "50": "All three are met: a specific ship, all the benefits, and the customer directs the use (where, when, what). The supplier only crews it. So it's a lease.", "51": "Lessee at the start: lease liability = present value of the future lease payments. Right-of-use asset = that liability + payments already made + direct costs + dismantling costs − incentives.", "52": "Exercise 3.5: Adams pays 9,968 at the start and then 4 more times at 10%. Try a), b) and c) before the next slides.", "53": "a) All three tests are met (specific machine, all the benefits, Adams decides its use), so it's a lease.", "54": "b) Lease liability = 9,968 × annuity factor (10%, 4 years: 3.1699) = 31,597. Each later payment is split into interest and repayment.", "55": "c) Right-of-use asset = 31,597 + 9,968 paid upfront = 41,565. It is depreciated over the shorter of lease term (4) and useful life (6): 41,565 / 4 = 10,391 a year.", "56": "Year N1 in the accounts: interest 10% × 31,597 = 3,160. The 9,968 payment repays 6,808 of the liability. Expenses: depreciation 10,391 + interest 3,160, instead of a 'rent' line.", "60": "The teacher's quiz. Check yourself: 1 false (acquired brands with an indefinite life aren't amortised, they're tested for impairment), 2 false (the cost model is normal), 3 false (home-grown brands and customer lists are never assets, IAS 38.63), 4 true (that's a CGU), 5 false (only up to what it would be without the impairment), 6 true."}, "4": {"8": "Airbus's 2023 balance sheet, equity and liabilities side. The red boxes are financial instruments: the equity lines (shares are equity instruments) and the financial liabilities (financing, trade and other financial liabilities). Together they are 54.8% of total equity and liabilities (teacher's notes). The point: more than half of the right-hand side falls under IAS 32 and IFRS 9, so classifying debt versus equity correctly changes a big part of the balance sheet. No calculation here.", "9": "The same picture for Airbus two years later (2025 report). The teacher's notes list the share of financial instruments year by year.", "19": "Orange's hybrid 'subordinated notes' (4,950) sit inside equity. Why: no maturity, and Orange may defer the coupons, so it has no obligation to pay. Their coupons go straight to equity, not to interest expense.", "20": "The details behind it: deeply subordinated, coupons can be deferred, Orange can call (repay) them, and step-up clauses raise the coupon later. The step-ups push Orange to repay, but legally there is no obligation, so they stay equity.", "21": "Statement of changes in equity: the subordinated notes column stays at 4,950, although 1bn was repaid and 1bn newly issued in 2023. Their 'remuneration' (−185) is a movement in equity, like a dividend.", "22": "Cash flow statement: issuing or buying back the subordinated notes and paying their coupons are financing cash flows, like equity transactions.", "25": "Orange's TDIRA: perpetual bonds redeemable in shares. Split accounting: the debt part is the present value of the cash flows (643), the equity part is what is left (152). This is exactly the compound-instruments step.", "30": "Lufthansa's authorised capital: shareholders allow the board to issue new shares up to a limit (A: €1bn; B: €100m for employees). Authorised is not issued: only €2.47m of B was used in 2025.", "32": "Air France-KLM cut the par value of each share from €10 to €1: share capital falls from 2,571 to 263 and the difference moves to share premium (additional paid-in capital). Total equity does not change.", "34": "Lufthansa's treasury shares: shareholders allowed buy-backs up to 10% of capital. At the end of 2025 it held 17,987 own shares, kept for employees.", "1": "Title slide.", "2": "Title slide: Topic 4 is about telling debt from equity, and how equity transactions are recorded.", "3": "Contents and readings. The key required reading is Elliott & Elliott ch. 14, pp. 342–347, which includes bonds at amortised cost (effective interest), tested in your quiz and in the 2023 exam.", "4": "More readings and videos. The cpdbox videos on IAS 32 are a good 10-minute recap if a slide doesn't click.", "5": "What you should be able to do: tell debt from equity, see why it matters for ratios, and record shares, buy-backs and hybrids.", "6": "Section start: financial instruments in general.", "7": "Which standard does what. For this course: IAS 32 decides debt or equity, IFRS 9 measures debt, IFRS 7 is about disclosures.", "10": "The issuer (the company raising money) uses IAS 32 to decide debt or equity; the buyer of the instrument uses IFRS 9 for its asset. This topic is about the issuer.", "11": "Section start: is it debt or equity? (IAS 32).", "12": "The CFO's idea: preferred shares with a guaranteed 5% dividend that accumulates if missed, and holders can demand a buy-back after 2 years. Answer by the end of 4.2: that's an obligation to pay, so it's debt under IAS 32. It would make the debt-to-equity ratio worse, not better. Don't issue them for that reason.", "13": "The one test: is the company obliged to hand over cash (or other assets), either ongoing payments or repayment? Yes means debt. The name ('share', 'bond') and the label ('dividend', 'interest') don't matter.", "14": "The decision tree: an obligation, even if unlikely or depending on conditions outside the company's control, makes it a financial liability. Only if the company can always avoid paying is it equity.", "15": "Try the cases first. 1) Repayment plus Euribor interest: debt. 2) Interest only if the central bank rate is above 4%: still debt (the condition is outside the company's control, and it must repay anyway). 3) Perpetual, interest only if the company chooses to pay ordinary dividends: equity (the company can always avoid paying).", "16": "4) Holders can demand repayment: debt, even though they are called shares. 5) Only the company can choose to redeem: equity. 6) Green bond repaid after 15 years with interest: debt; the CO2 clause doesn't change the obligation.", "17": "Payments follow the classification. Debt: 'interest' is an expense in profit and loss. Equity: 'dividends' are a distribution, taken straight from equity. Costs of issuing equity (legal, bank fees) are deducted from equity, not expensed.", "18": "Hybrids mix features: subordinated, very long or no maturity, interest the company can defer. There's no shortcut: apply the obligation test to each one.", "23": "Now instruments that are partly debt and partly equity (compound instruments): convertible bonds, bonds with warrants, convertible preference shares.", "24": "Split accounting: first value the debt part (its cash flows discounted at the market rate for a similar bond with no conversion option). Equity is whatever is left. Example: 100m convertible, debt part 95m, equity part 5m.", "26": "The conclusion: under IFRS everything issued is either a liability or equity (or split into both). There's no 'in between' category like some local rules have.", "27": "Section start: accounting for equity.", "28": "The parts of equity: contributed capital (share capital at par + share premium), retained earnings, other reserves, and treasury shares as a deduction.", "29": "Par (nominal) value is not the market value. Count of shares: outstanding (held by outsiders) ≤ issued (includes treasury shares) ≤ authorised (the maximum the board may issue).", "31": "1,000 shares, par 5, sold at 15: cash +15,000, share capital +5,000 (par × number), share premium +10,000. The 300 issue costs reduce share premium, not profit.", "33": "Why companies buy back their own shares: hand back spare cash, raise EPS and ROE, have shares for employee plans or deals, defend against takeovers.", "35": "Pacific's equity before the buy-back: note the share capital and premium, you'll need them on the next slides.", "36": "Buying back 10,000 shares at 11: cash −110,000 and a 'treasury shares' line of −110,000 inside equity. No asset is created, and equity shrinks.", "37": "Reselling 1,000 treasury shares at 15 (bought at 11): cash +15,000, treasury shares −11,000, and the 4,000 difference goes to share premium. Never a gain in profit and loss: a company can't earn profit trading its own shares.", "38": "Cancelling 1,000 treasury shares: share capital falls by par (1,000 × 1 = 1,000), and the rest of their cost (10,000) comes out of share premium. The treasury line drops by 11,000.", "39": "The teacher's quiz. Check yourself: 1 false (it matters for the buyer's assets too), 2 false (an obligation to repay makes it debt, whatever it's called), 3 true, 4 false (equity issue costs reduce equity; debt costs go into the effective interest), 5 false (issued minus outstanding = treasury shares; authorised is the ceiling), 6 true, 7 true, 8 true.", "40": "Further readings from the teacher, academic and partly in German. Optional."}, "5": {"8": "Orange's key figures: revenue, EBITDAaL (EBITDA after leases, Orange's own measure), eCapex, organic cash flow, ROCE. Several are not defined by IFRS, which is the point of this part.", "9": "Orange's results presentation: the measures management chooses to show investors, each ticked against its guidance.", "10": "'Waterfall' bridges: how revenue and EBITDAaL moved from 2022 to 2023, segment by segment.", "11": "The same for net income, eCapex and organic cash flow: from the profit figure to the cash figure.", "19": "Air France-KLM's income statement, labelled: which subtotals are defined by IFRS ('GAAP') and which are management's own ('non-GAAP'), such as EBITDA and income from current operations.", "20": "Deutsche Telekom's segment report: it judges its segments on revenue and EBITDA (AL), circled. A company choosing its own performance measures.", "26": "Veolia's ROCE with the asset approach: current EBIT after tax (2,747) divided by average capital employed (33,085) = 8.3% for 2023.", "34": "Bayer's EVA for 2022 = (ROCE 7.7% − WACC 6.1%) × capital employed 69,270 = +1,108m: value created.", "35": "One year later: ROCE 0.7% against WACC 5.7%, so EVA = −3,435m: value destroyed. Same formula as 2023 exam question 5c.", "1": "Title slide.", "2": "Title slide: Topic 5 is about the numbers companies and analysts use to judge performance, and their limits.", "3": "Readings. The required ones are Elliott & Elliott chapters 28 and 29; the rest is optional deeper reading.", "4": "The three parts: what KPIs are, measuring performance (EBITDA, ROCE, Du Pont), determining value (EVA, free cash flow).", "5": "What you should be able to do. The one examiners love: telling whether a KPI changed because the business changed or because the accounting changed.", "6": "Section start: what KPIs are.", "7": "KPIs answer five questions: profit in absolute terms, profit relative to what was invested (margins, returns), is it enough compared to something, can the company repay debt long term (solvency) and short term (liquidity). Most KPIs are not defined in IFRS.", "12": "Ratios let you compare companies, peers and industries, but only if they use the same accounting choices (inventory method, depreciation and so on). Check that before comparing.", "13": "Why that matters: Lufthansa depreciates aircraft by about 4.75% a year, Ryanair by about 3.7% (23 years, 15% residual). The same plane gives Ryanair lower depreciation and higher profit. The difference is a choice, not better business.", "14": "IFRS 18 replaces IAS 1 from 2027: new required subtotals in the income statement (like operating profit), rules for management's own measures, and better grouping of information.", "15": "Management-defined performance measures (MPMs) are a company's own profit subtotals, like 'adjusted EBIT', that it uses publicly. From 2027 they fall under IFRS 18.", "16": "For each MPM a company must explain it, reconcile it to the nearest IFRS subtotal, explain any changes, and say it may not be comparable with other companies' measures.", "17": "Section start: measuring performance.", "18": "The ladder from sales to profit: gross margin, then EBITDA (non-GAAP), then operating profit after depreciation, then EBIT after one-off items. Know the order; the exam asks you to compute these.", "21": "EBITDA = operating profit + depreciation and amortisation. It's popular because it removes differences in depreciation choices and comes close to operating cash. But it isn't defined in IFRS, so every company can define it its own way.", "22": "EBITDA is not operating cash flow (example: Inditex 2023). Cash from operations also deducts tax paid and changes in working capital.", "23": "Where EBITDA is used: valuation and debt covenants (net debt / EBITDA, EBITDA / interest). Airlines and retailers often report EBITDAaL, EBITDA after lease payments, because IFRS 16 moved rent below EBITDA.", "24": "ROCE = EBIT × (1 − tax rate) / capital employed. The top is NOPAT, operating profit after tax. Capital employed = non-current assets + working capital needs, or the same thing from the other side: equity + net financial debt.", "25": "How to rearrange the balance sheet to get capital employed: keep operating items on the asset side, move financial debt next to equity. Both sides give the same total.", "27": "Du Pont: ROCE = NOPAT margin × capital employed turnover. So a company can improve ROCE by earning more per euro of sales or by needing less capital per euro of sales.", "28": "Veolia 2023: ROCE 8.3% = margin 6.06% × turnover 1.37. Low margin, moderate turnover: typical for a capital-heavy utility.", "29": "Du Pont across EuroStoxx 50 companies: each sector sits somewhere on the margin versus turnover map. Banks: tiny turnover.", "30": "The same map, with financial and non-financial companies apart: high-margin tech (ASML) versus high-turnover, low-margin businesses.", "31": "Other returns: ROE = net income / equity (the shareholders' view), ROA = EBIT / total assets, ROI = EBIT / investment. ROCE looks at all capital, debt and equity.", "32": "Section start: determining value.", "33": "EVA = NOPAT − WACC × capital employed, which is the same as (ROCE − WACC) × capital employed. Positive means the company earns more than its capital costs, so it creates value. Your 2023 exam has an EVA question.", "36": "Free cash flow to the firm = cash from operations − capex needed to keep capacity (or EBIT(1−t) + depreciation − capex − increase in working capital needs). FCF to equity also deducts what goes to lenders.", "37": "Veolia 2023: operating cash 3,118 − investing 3,240 = FCF to the firm −122. After financing flows, FCF to equity −360.", "38": "The teacher's quiz, part 1. Check yourself: 1 false (EBITDA is not defined by IFRS), 2 true (it is also before tax paid), 3 true, 4 false (ROCE uses all capital, debt and equity; ROE is the shareholders' view), 5 false (depreciation lowers EBIT and capital employed, so it affects ROCE).", "39": "Part 2: 6 true (fewer investments flatter ROCE short term), 7 false (working capital needs use operating items only, without cash and short-term debt), 8 false (turnover counts too), 9 false (dividends come after FCF to the firm), 10 true.", "40": "Further academic readings. Optional."}, "2": {"5": "The question this whole topic answers: if we buy 60% of a company with a lot of debt, what happens to OUR debt-to-equity ratio? Keep it in mind; slides 7 to 10 give the first answer.", "6": "Every company in a group (here IAG with British Airways, Iberia, Vueling) files its own individual statements. On top of that, the parent files one consolidated set that treats the whole group as one economic entity.", "7": "L'Oréal 2023, same group twice. Parent alone: 20,353 of its non-current assets are financial assets, mostly shares in its subsidiaries. Consolidated: those shares are replaced by the subsidiaries' real assets and debts, so total assets double (26,667 to 51,855) and liabilities almost triple (8,016 to 22,773). Debt-to-equity goes from about 0.43 to about 0.78: the debt sits in the subsidiaries and only shows once you consolidate. Note: the parent's lines don't add up exactly (26,667 vs 26,604) because the slide leaves out some small lines; not exam material.", "8": "Same comparison for the income statement. The parent's profit is mostly 'financial profit' (3,149): dividends from its subsidiaries. The group's sales (41,182) only appear in the consolidated income statement.", "9": "A toy example to try yourself: P puts money into S1, S1 into S2, and each borrows from its own bank. Draw the three balance sheets, then the group's, before looking at slide 10.", "10": "The answer. Each company alone looks safe: debt-to-equity of 1. For the group, the 2,000 'equity' of S1 and the 4,000 of S2 are just P's own money passed down, so they cancel against P's and S1's 'investment in subsidiary'. Only the 1,000 from P's shareholders is real outside equity, while all 7,000 of debt is owed to three outside banks. Group debt-to-equity = 7,000 / 1,000 = 7. That's why creditors and investors need consolidated statements: the individual ones hide how much the group really borrows.", "11": "The four steps of any consolidation. This step covers 1 and 2; steps 2 to 5 of the ladder are all step 3 (combining).", "12": "Step 1, scope: how much you own decides the method. Under 20%: a financial asset (IFRS 9). 20 to 50%: significant influence, equity method (step 5 of the ladder). Over 50%: control, full consolidation (steps 2 to 4).", "13": "A real annual report's notes listing which companies are in the group and how each is consolidated: step 1 in practice.", "14": "Step 2: subsidiaries often keep their books in local rules, so before combining they are converted to IFRS and to one set of group accounting policies (IFRS 10.19).", "15": "Examples of policies that must be the same across the group: depreciation, inventory method (FIFO or weighted average), cost or revaluation for fixed assets. Groups issue accounting guidelines so subsidiaries do this from the start.", "16": "Step 3 in four moves: a) revalue the subsidiary to fair value and find goodwill, b) add 100% of its assets and liabilities even if you own less, c) cancel 'investment in subsidiary' against the subsidiary's original equity (exactly what happened on slide 10), d) show the part you don't own as non-controlling interest.", "17": "Map of the next three ladder steps: 100% without goodwill, 100% with goodwill, 60% with non-controlling interest.", "18": "Example 1, the simplest case. The price (150) equals S's equity (150), so nothing is left over: no goodwill. Combine both balance sheets, then cancel 'Investment in S' (150) against S's equity (150). What remains: assets 250, equity 100 (only the parent's own), liabilities 150. Debt-to-equity rises from 1.3 to 1.5 because S's debt is added but its equity is cancelled, the answer to slide 5.", "19": "The same Example 1 drawn differently: the investment line disappears and S's actual assets and liabilities take its place. Use whichever picture helps you more.", "20": "Example 1 one year later. The cancellation is the same as on the purchase date: investment 150 against S's equity at purchase (150). S's profit since then (20) was earned while P owned it, so it stays: group net income is 30 + 20 = 50.", "21": "The consolidated income statement is simply both added together: revenues 210 + 160, expenses 180 + 140, net income 50. At 100% ownership there is nothing to split.", "22": "Example 2: P pays 190, more than S's equity (150). First restate S at fair value: its assets are worth 30 more, so equity at fair value is 180. Cancel 190 against 180, and the 10 left over is goodwill. Consolidated: goodwill 10, assets 240, equity 100, liabilities 150.", "23": "Why a buyer pays more than book value, in two layers. Layer 1: assets worth more than their book value (valuation difference). Layer 2: whatever is still left (synergies, workforce, future customers) is goodwill. Net assets = assets − liabilities = equity.", "24": "The purchase price allocation (PPA) in numbers. Price − book value = 40. Of that, 30 is a valuation difference that goes onto named assets. The remaining 10 is goodwill. Negative goodwill (a bargain purchase) is booked straight as a gain in the income statement.", "25": "The test for each item: is it identifiable, meaning it could be sold on its own or comes from a legal right (IFRS 3, Appendix A)? Yes: it's an identifiable net asset (INA). No: it disappears into goodwill (GW). Try all seven before checking: 1 INA, 2 INA (a legal right), 3 GW (staff know-how can't be sold separately), 4 INA (development projects can be sold or licensed), 5 GW (synergies are the classic goodwill), 6 GW unless it is patented or could be sold on its own, 7 INA (debt is a liability, so it reduces identifiable net assets). These are also in the Topic 2 question cards.", "26": "After the purchase: valuation differences follow their asset (the extra value of a machine is depreciated, a brand is tested for impairment). Goodwill is never amortised under IFRS; it gets an impairment test every year (Topic 3).", "27": "Control doesn't need 100%. If P controls S, it still adds 100% of S's assets, liabilities, revenues and expenses, then shows the part owned by others separately as non-controlling interest (NCI), in equity and in net income.", "28": "Example 3: P buys 60% for 90 (60% of 150, so no goodwill). Add 100% of S, cancel the 90 against P's 60% of S's equity. The other 40% (60) becomes non-controlling interest, shown within equity. Assets 310 = equity 100 + NCI 60 + liabilities 150.", "29": "Example 3 one year later. S earns 20: 60% (12) belongs to the group, 40% (8) to the outside owners. Group net income = 30 + 12 = 42. NCI grows from 60 to 68.", "30": "The income statement still adds 100% of S (consolidated net income 50), then splits it: 42 to the parent's owners, 8 to non-controlling interest.", "31": "The equity method is for associates (20 to 50%, significant influence, not control). Nothing is added line by line and nothing is cancelled. The investment stays as one line. There is still a PPA, and there is no NCI.", "32": "Under the equity method the investment line moves with the associate's equity: up with your share of its profit, down with dividends and impairment. It appears as one line on the balance sheet and one line in the income statement.", "33": "Example 4: P buys 40% of A for 60, exactly 40% of A's equity (150), so no valuation difference and no goodwill. The balance sheet simply shows 'Investment in associates 60'.", "34": "One year later A earns 20. P's share is 40% × 20 = 8, so the investment rises to 68 and P's net income to 30 + 8 = 38. A's assets and debts never appear in P's statements.", "35": "In the income statement only one line is added: 'Share of profit of associates' +8. Revenue and expenses stay P's own.", "36": "A real example: Renault held 40.4% of Nissan and accounted for it with the equity method, showing Nissan as one investment line, not line by line.", "37": "Same Renault–Nissan example: with 40.4%, Renault had significant influence but not control, so it used the equity method, not full consolidation.", "38": "What analysts watch: changes in the scope (companies bought or sold make years hard to compare, hence pro forma figures), goodwill and its impairment, and deals between related companies inside the group.", "39": "The teacher's end-of-deck quiz, part 1. Answers are in the Topic 2 question cards.", "40": "The teacher's end-of-deck quiz, part 2. Answers are in the Topic 2 question cards.", "41": "Further readings from the teacher, mostly in German and French. Optional, not needed for the exam.", "1": "Title slide.", "2": "Title slide: Topic 2, business combinations. It was worth 17 of the 75 points in the 2023 exam.", "3": "Contents and readings: Elliott & Elliott chapters 22 and 23 are the textbook backup, and the IFRSbox video on IFRS 10 is a quick recap.", "4": "What you should be able to do by the end of Topic 2. A good final self-check: can you do each line without notes?"}};

s lower than parent d/e because of sub profits)", "19": "Management problem of slide 5: debt-equity parent: 1.3 debt-equity conso: 1.5 In a first conso the debt-equity ratio always increases (unless sub has 0 debt) because you add the sub debt (but not its equity) to the parent debt. In a subsequent conso the evolution of the debt-equity ratio depends on the sub/group profitability (slide 26: group d/e is lower than parent d/e because of sub profits)", "24": "Identifiable (IFRS 3.App A) means separable (from the company; eg. can be sold individually) or arising from legal rights", "33": "PPA: PP of 60 = book value of 60 (=150x40%): NO valuation difference or goodwill"}, "3": {"25": "Future cash flows: the 5 year period is not always respected by companies; in practice they use shorter (3 years) or longer periods Discount rate: companies do not always use a pre-tax rate; the WACC, for ex, is post-tax (if not adjusted).", "33": "Note: On this slide, the impairment test is done “net”, meaning that the net assets of the CGU are considered. Conversely, in our SEAT case, the impairment test is done “gross”. Both “gross” or “net” are allowed under IAS 36 (see IAS 36.78 and, e.g., Deloitte, iGAAP 2018, p. 626 ff.). Independent from the choice, any liability that is directly related to the CGU’s assets needs to be considered (i.e., “gross”). Examples would include asset-back-liabilities, a site restoration provision associated with a CGU or the pension obligation associated with the CGU's workforce.", "58": "Amount of long-term lease arrangements is relatively high (previous slide – “2029 and beyond”). This might be explained by large property leases (“Land and buildings”) or lease arrangements that include “Networks and devices” (often long-term leases)."}, "4": {"8": "In 2023: 54.8% In 2022: 49.8% In 2021: 41% In 2020: 36.5% In 2019: 36% In 2018: 39.8% of equity & liabilities are financial In 2017: 56.4 % In 2016: 55.8 %", "9": "In 2023: 54.8% In 2022: 49.8% In 2021: 41% In 2020: 36.5% In 2019: 36% In 2018: 39.8% of equity & liabilities are financial In 2017: 56.4 % In 2016: 55.8 %", "12": "The preferred shares include an obligation to pay ongoing compensation (cumulative dividends) and an obligation to reimburse (buy-back) if the shareholders asked for it. Therefore, they will be classified as debt, and not equity, in the IFRS balance sheet, and will deteriorate the debt/equity ratio.", "15": "Liability: obligation to redeem and obligation for ongoing compensation that is variable. Liability: interest rate condition not relevant because outside of the control of issuing entity. Equity: dividend payment condition is relevant because these payments are under control of the entity. Dividends are discretionary; the entity can therefore avoid a payment", "16": "4. Liability: obligation to reimburse if holder demands 5. Equity: no obligation to reimburse; entity/issuer decides to reimburse or not (same situation as treasury shares) 6. Liability: obligation to redeem and to pay interest, only timing and amount are variable.", "18": "The term « hybrid » in IFRS means a financial instrument with an embedded derivative. In this slide « hybrid » is used as a general term meaning a financial instrument that has debt AND equity features", "22": "CFS presentation: part of financing cash flows are not shown (lack of space) that’s why the addition of the numbers do NOT equal the total financing CF The point of this slide is to show that the « interest » payments on the sub. notes are treated like dividends, since the notes are equity.", "32": "After the share capital reduction AF increased its capital in 2023 by 35 million (+6 in share capital and +29 in APIC)"}, "5": {}};

function vMalaga(){
  var h = '<a class="back" href="#topic-3">← Topic 3</a><div class="stack"><div class="eyebrow">Topic 3 · Case 2 · Malaga 3 (intangible assets)</div><h1>Malaga 3, step by step</h1>'+
  '<p class="lead">The official solution, explained. Two things to know: the case text doesn\'t give the 6.71 factor (the exam would), and the solution\'s balance sheet leaves out the equity line, so it doesn\'t balance as printed.</p>'+
  '<p class="note"><a href="#doc/t3-cases/2">Open the case</a> · <a href="#doc/t3-solutions/2">Open the official solution</a></p></div>'+
  '<section class="card"><h2>A) The patent bought on instalments</h2><p class="pl-calm"><b>Problem.</b> In January N Malaga acquired a patent: initial payment of €30,000, then an annual licence fee of €10,000 for 10 years, payable at the end of each year. The company\'s usual discount rate is 8%. What is the acquisition cost of the patent, and what are the entries in January N and on 31 December N?</p>'+
  '<p><b>Think of it as buying a car:</b> a 30,000 deposit now and 10 instalments of 10,000. It is the same pattern as the Adams lease (one payment today plus a stream of future payments), so the steps are the same.</p>'+
  '<table class="sol"><tr><th>Step</th><th>Adams (lease)</th><th>Malaga (patent)</th></tr>'+
  '<tr><td>Liability = today\'s value of the future payments</td><td>9,968 × 3.17 = 31,597</td><td>10,000 × 6.71 = <b>67,100</b></td></tr>'+
  '<tr><td>Asset = liability + what is paid today</td><td>31,597 + 9,968 = 41,565</td><td>67,100 + 30,000 = <b>97,100</b></td></tr>'+
  '<tr><td>Interest = rate × liability</td><td>10% × 31,597 = 3,160</td><td>8% × 67,100 = <b>5,368</b></td></tr>'+
  '<tr><td>Repayment = payment − interest</td><td>9,968 − 3,160 = 6,808</td><td>10,000 − 5,368 = <b>4,632</b></td></tr>'+
  '<tr><td>Spread the asset over its life</td><td>41,565 ÷ 4 = 10,391</td><td>97,100 ÷ 10 = <b>9,710</b></td></tr></table></section>'+
  '<section class="card"><h2>Where 6.71 comes from</h2><p><b>Annuity factor = [1 − 1/(1 + r)<sup>n</sup>] ÷ r.</b> Today\'s value of the payments = payment × annuity factor.</p>'+
  '<ol><li>1.08<sup>10</sup> = 2.159, so 1 ÷ 2.159 = <b>0.463</b>: €1 received in 10 years is worth 0.463 today.</li>'+
  '<li>A stream of €1 a year <b>forever</b> is worth 1 ÷ 0.08 = <b>12.50</b> today (12.50 in the bank at 8% pays €1 a year for ever).</li>'+
  '<li>10 payments = the forever stream minus the forever stream that starts after year 10: 12.50 − 12.50 × 0.463 = 12.50 × <b>0.537</b> = <b>6.71</b>. That is the same as (1 − 0.463) ÷ 0.08.</li></ol>'+
  '<p class="note">Check with the 2025 exam: 1.05<sup>8</sup> = 1.477; 1 ÷ 1.477 = 0.677; (1 − 0.677) ÷ 0.05 = 6.46, the printed 6.4632. On a calculator: 1.08 ^ 10, then 1 ÷ that, then 1 − that, then ÷ 0.08.</p></section>'+
  '<section class="card"><h2>The three entries</h2><p class="note">The solution\'s table shows <b>changes</b> (+ and −) to each line, not balances. Cash is an asset; "−30,000" means the cash went down by 30,000 because Malaga paid it out.</p>'+
  '<table class="sol"><tr><th>When</th><th>What happens</th><th>Patent</th><th>Cash</th><th>Liability</th><th>Equity (P&amp;L)</th></tr>'+
  '<tr><td>(1) January N</td><td>Buy the patent: 30,000 paid now, 67,100 still owed in today\'s money</td><td>+97,100</td><td>−30,000</td><td>+67,100</td><td></td></tr>'+
  '<tr><td>(2) 31 Dec N</td><td>Pay the first fee: 5,368 is interest, 4,632 pays down the debt</td><td></td><td>−10,000</td><td>−4,632</td><td>−5,368 interest</td></tr>'+
  '<tr><td>(3) 31 Dec N</td><td>Amortise the patent over 10 years</td><td>−9,710</td><td></td><td></td><td>−9,710 amortisation</td></tr>'+
  '<tr class="tot"><td>End of N</td><td>Balances</td><td>87,390</td><td>−40,000</td><td>62,468</td><td>−15,078</td></tr></table>'+
  '<p><b>Check that it balances:</b> assets change by 97,100 − 9,710 − 30,000 − 10,000 = <b>+47,390</b>. Liabilities and equity change by 67,100 − 4,632 − 15,078 = <b>+47,390</b>. ✓</p>'+
  '<p class="t"><b>The official solution leaves out the equity line (−15,078 = the two expenses).</b> Without it, assets +47,390 and liabilities +62,468 don\'t match. It calls the liability "accounts payable"; "liability for the licence fees" is clearer. Always add the net income effect to equity yourself.</p></section>'+
  '<section class="card"><h2>B) Brand X, created by Malaga 10 years ago, valued by buyers at €5,000,000</h2><p><b>No, it can\'t go on the balance sheet.</b> It is an internally generated brand. IAS 38 never allows those (brands, mastheads, publishing titles, customer lists), because their cost can\'t be separated from the cost of building the business as a whole. The €5,000,000 buyers would pay doesn\'t change that. Only if someone <b>bought</b> the brand, alone or by buying Malaga, would it be recognised (at that price or fair value).</p></section>'+
  '<section class="card"><h2>C) Brand Y, bought for €8,000,000: amortise or not?</h2><p><b>Both are partly wrong.</b> Under IFRS it depends on the brand\'s useful life:</p><ul><li><b>Finite life</b> (rare for a brand, e.g. a licensed name for 5 years): amortise over that life.</li><li><b>Indefinite life</b> (usual: no foreseeable end to the cash it brings): <b>not amortised</b>, but tested for impairment <b>every year</b>.</li></ul><p>So the chief accountant is wrong that amortisation is always mandatory. The CFO is right that it usually isn\'t amortised, but wrong to argue from local rules: Malaga must follow IFRS, and must test the brand every year.</p></section>';
  return h;
}

    if(t.playable && cur[0]==="e2") h += tick("ppa", (++num)+'. Drill the purchase price allocation (1 minute each, no drawing)', '<a class="btn small ghost" href="#practice" data-start="ppa">Quick PPA drill</a>');
    var cs = ALLCASES.filter(function(d){ return d.step===cur[0]; });
    if(cs.length) h += tick("cases", (++num)+'. Do the same cases here, with live checking', cs.map(function(d){ return '<a class="btn small ghost" href="#practice" data-start="case:'+d.id+'">'+esc(d.title.split(":")[0])+'</a>'; }).join(" "));
    if(t.playable && cur[0]!=="e0") h += tick("prac", (++num)+'. Practise this type with new numbers (same format as the cases)', '<a class="btn small ghost" href="#practice" data-start="'+cur[0]+'">New numbers</a>');
    h += '</div>';
    var books = (BOOKSTEP[cur[0]]||[]).map(function(b, bi){ return '<a class="btn small ghost" href="#doc/bk-'+b[0]+'/'+bookPage(b[0], b[1])+'/'+cur[0]+'-'+bi+'">'+esc(b[3])+' · pp. '+b[1]+(b[2]!==b[1]?'–'+b[2]:'')+'</a>'; });
    if(BOOK[cur[0]]) books.push('<a class="btn small ghost" href="#doc/harrison/'+BOOK[cur[0]][0]+'">Harrison '+BOOK[cur[0]][2].replace("Book ","")+'</a>');
    if(books.length) h += '<details class="tg-more"><summary>Stuck? Read this</summary><p class="note">Only the pages for this step. Not required.</p><div class="attach">'+books.join("")+'</div></details>';
    var ex = (FURTHER[n]||[]).filter(function(r){ var fs = FSTEP[n+":"+r[0]] || FSTEP[r[0]]; return fs===cur[0] || (fs instanceof Array && fs.indexOf(cur[0])>=0); });
    if(ex.length) h += '<details class="tg-more"><summary>See it in a real report</summary>'+ex.map(function(r){ return '<p class="note">'+esc(DOCS[r[0]].t)+': '+esc(r[1])+'</p><a class="btn small ghost" href="#doc/'+r[0]+'/'+(S.docPos[r[0]]||1)+'">Open</a>'; }).join("")+'</details>';
    var G2 = GUESS[n];
    if(G2.step===cur[0] && g.guess>=0 && (dn.slides || dn.case)) h += '<p class="pl-calm"><b>Your guess was: '+esc(G2.opts[g.guess])+'.</b> '+(g.guess===G2.ans?'Right. ':'')+esc(G2.why)+'</p>';
    h += '<p class="lead" style="margin-top:8px">How well do you know it now?</p><div class="opts">'+RATINGS.slice(1).map(function(r){ return '<button type="button" class="opt" data-rate1="'+n+'|'+cur[0]+'|'+r[0]+'|step" aria-pressed="'+((S.rating[cur[0]]||"")===r[0])+'">'+r[1]+'</button>'; }).join("")+'</div></section>';
    var nx = t.steps[ci+1];
    h += nx ? '<div class="two">'+(ci>0?'<button class="btn ghost" data-tstep="'+n+'|'+t.steps[ci-1][0]+'">Previous step</button>':'<span></span>')+'<button class="btn" data-tstep="'+n+'|'+nx[0]+'">Next step</button></div>'
      : '<div class="two">'+(ci>0?'<button class="btn ghost" data-tstep="'+n+'|'+t.steps[ci-1][0]+'">Previous step</button>':'<span></span>')+'<button class="btn" data-tf="'+n+'|exam">Next: check yourself</button></div>';
  }
  if(g.stage==="exam"){
    S.selfMark = S.selfMark || {};
    h += '<section class="card"><h2>1. Quick check</h2><p class="note">'+(DECKQ[n]||[]).length+' true-or-false statements from the end of the slides. About 4 minutes, answers right away.</p><a class="btn" href="#cards/deck-'+n+'">Start the quick check</a></section>';
    h += '<section class="card"><h2>2. The 2023 exam questions</h2><p class="note">Try each one timed: points = minutes. Then compare with the worked solution, and ask Claude if something is unclear.</p>'+
      (EXAMQ[n]||[]).map(function(q){ var sq = SOL[q], mk = S.selfMark[q]; return '<div class="readrow"><span><b>Question '+q+'</b> · '+sq.pts+' min'+(mk?' · <span class="pill '+({got:"solid",part:"prog",miss:"gap"})[mk]+'">'+({got:"got it",part:"partly",miss:"missed"})[mk]+'</span>':'')+'<br>'+esc(sq.title)+'</span><div class="attach"><a class="btn small ghost" href="#solution/'+q+'">Try it</a></div></div>'; }).join("")+'</section>';
    h += exam25Html(n, '3. The 2025 mock exam');
    if(TQUIZ[n]) h += '<section class="card"><h2>4. Your Topic '+n+' quiz</h2><p class="note">'+TQUIZ[n].length+' questions, 24 minutes, like the real one. Your plan also brings these back in short slots over the next days.</p><a class="btn ghost" href="#cards/quiz-'+n+'">Start the timed quiz</a></section>';
    if(READONLY[n]) h += '<details class="tg-more card"><summary>Only in the required reading, not on the slides</summary><p class="note">Lower priority. Read these after the slides and checks, if you have time.</p><div class="attach">'+READONLY[n].map(function(b, bi){ return '<a class="btn small ghost" href="#doc/bk-'+b[0]+'/'+bookPage(b[0], b[1])+'">'+esc(b[3])+' · pp. '+b[1]+'–'+b[2]+'</a>'; }).join("")+'</div></details>';
    h += '<button class="btn ghost" data-tstep="'+n+'|'+t.steps[t.steps.length-1][0]+'">Back to the last step</button>';
  }
