<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finish Line prototype</title>
<link rel="stylesheet" href="leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column, phone first. The course map is home; every topic is a ladder; a running-track lane marks the finish line. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5C6B63; --line:#D9DFD8;
  --accent:#D9482B; --accent-ink:#FFFFFF; --deep:#1F5A45; --on-deep:#FFFFFF;
  --good:#1E7A4F; --good-bg:#DDF0E5; --warn:#9A5B00; --warn-bg:#FBEBCF; --idle-bg:#E9EDE8;
  --info:#2B4C8C; --info-bg:#E1E8F7;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111815; --surface:#1A2420; --ink:#ECF1EC; --muted:#9BAAA1; --line:#2C3A34;
    --accent:#F0633F; --accent-ink:#1A0D08; --deep:#7FCBA9; --on-deep:#0E1512;
    --good:#7FD3A6; --good-bg:#173A2A; --warn:#F2C374; --warn-bg:#3D2E10; --idle-bg:#232E29;
    --info:#A9C0F5; --info-bg:#1C2A4A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#1A2420; --ink:#ECF1EC; --muted:#9BAAA1; --line:#2C3A34;
  --accent:#F0633F; --accent-ink:#1A0D08; --deep:#7FCBA9; --on-deep:#0E1512;
  --good:#7FD3A6; --good-bg:#173A2A; --warn:#F2C374; --warn-bg:#3D2E10; --idle-bg:#232E29;
  --info:#A9C0F5; --info-bg:#1C2A4A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.flag{width:18px;height:18px;border-radius:3px;background:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/9px 9px;border:1px solid var(--ink)}
.proto{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{font-size:13px;text-decoration:none;color:var(--muted);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a[aria-current="page"]{color:var(--on-deep);background:var(--deep);border-color:var(--deep)}
h1{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25;margin:0}
p{margin:0}
a{color:var(--deep)}
.lead{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{font-size:13px;color:var(--muted)}
.back{font-size:14px;text-decoration:none}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}
label.f{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;width:auto;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.solid{background:var(--good-bg);color:var(--good)}
.pill.prog{background:var(--info-bg);color:var(--info)}
.pill.gap{background:var(--warn-bg);color:var(--warn)}
.pill.todo{background:var(--idle-bg);color:var(--muted)}
/* finish card */
.finish{background:var(--deep);color:var(--on-deep);border:0}
.finish .big{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.finish .eyebrow,.finish .note{color:inherit;opacity:.82}
.finish input[type=date]{background:transparent;color:inherit;border-color:currentColor;width:auto;padding:5px 8px;font-size:14px}
.lane{display:flex;align-items:center;gap:5px}
.lane i{flex:1;height:12px;border-radius:3px;background:currentColor;opacity:.25;position:relative;overflow:hidden}
.lane i b{position:absolute;inset:0 auto 0 0;background:currentColor;opacity:1}
.lane i.full{opacity:1}
.lane .end{width:14px;height:22px;border-radius:2px;flex:none;background:conic-gradient(currentColor 25%,transparent 0 50%,currentColor 0 75%,transparent 0) 0 0/7px 7px;border:1px solid currentColor}
/* topic rows */
.topic{display:grid;grid-template-columns:40px 1fr;gap:12px;text-decoration:none;color:inherit;align-items:start}
.topic .num{width:40px;height:40px;border-radius:10px;background:var(--idle-bg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px}
.topic .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--idle-bg)}
.dots i.solid{background:var(--good)} .dots i.prog{background:var(--info)} .dots i.gap{background:var(--warn)}
/* ladder */
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ladder li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ladder li:first-child{border-top:0;padding-top:0}
.ladder .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--deep);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.ladder .n.here{background:var(--deep);color:var(--on-deep)}
.ladder .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.ladder select{font-size:14px;padding:6px 8px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.check{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px}
.check input{width:18px;height:18px;margin:2px 0 0}
.readrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.readrow:first-of-type{border-top:0}
.readrow .tools{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.readrow .tools input{width:84px;padding:5px 8px;font-size:14px}
.mat{display:flex;flex-wrap:wrap;gap:6px}
/* universe */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;background:#16211C}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:relative;padding:60px 16px 16px;width:100%;color:#fff;background:linear-gradient(to top,rgba(10,18,14,.88),rgba(10,18,14,0));display:flex;flex-direction:column;gap:6px}
.hero .ov p{color:#E6ECE7}
.hero .eyebrow{color:#CFE3D8}
.co{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.co .ph{position:relative;aspect-ratio:16/9;background:#16211C}
.co .ph img{width:100%;height:100%;object-fit:cover;display:block}
.co .ph .tag{position:absolute;left:12px;bottom:10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(10,18,14,.72);padding:3px 9px;border-radius:999px}
.co .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.co .tx p{font-size:14px;color:var(--muted)}
/* exercise */
.sheet{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px;font-variant-numeric:tabular-nums}
.sheet .ti{background:var(--idle-bg);padding:6px 10px;font-weight:600}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr}
.sheet .col{padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sheet .col + .col{border-left:1px solid var(--line)}
.sheet .col .h{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sheet .ln{display:flex;justify-content:space-between;gap:8px}
.sheet .ln.tot{border-top:1px solid var(--line);padding-top:4px;font-weight:600}
.fields{display:flex;flex-direction:column;gap:10px}
.fld{display:grid;grid-template-columns:1fr 116px;gap:10px;align-items:center;font-size:14px}
.fld input{text-align:right;font-variant-numeric:tabular-nums}
.fld input.right{border-color:var(--good);background:var(--good-bg)}
.fld input.wrong{border-color:var(--warn);background:var(--warn-bg)}
.fld .ans{grid-column:1/-1;font-size:13px;color:var(--warn)}
.tbs{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-variant-numeric:tabular-nums}
.tbs .ti{background:var(--idle-bg);padding:6px 10px;font-weight:600;font-size:14px}
.tbs .cols{display:grid;grid-template-columns:1fr 1fr}
.tbs .col{padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tbs .col + .col{border-left:1px solid var(--line)}
.tbs .h{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbs .tl{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.25}
.tbs .tl input{width:100%;text-align:right;padding:6px 8px;font-variant-numeric:tabular-nums}
.tbs .tl input.right{border-color:var(--good);background:var(--good-bg)}
.tbs .tl input.wrong{border-color:var(--warn);background:var(--warn-bg)}
.tbs .tl .ans{font-size:12px;color:var(--warn)}
.tbs .sum{border-top:1px solid var(--line);padding-top:6px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;margin-top:auto}
.tbs .bal{padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
.tbs .bal.ok{background:var(--good-bg)}
.fb{border-left:4px solid var(--good);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:8px}
.fb.miss{border-color:var(--warn)}
.fb b.v{font-family:var(--display)}
.exam{font-size:14px;background:var(--idle-bg);border-radius:10px;padding:10px 12px}
ol.steps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--deep);background:var(--good-bg)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--warn-bg);border-color:var(--warn)}
.opt[disabled]{cursor:default}
.timer{font-family:var(--display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.dn{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dn:first-of-type{border-top:0}
.dn .q{font-weight:600}
.dn .a{color:var(--muted)}
footer{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
/* 3D city: one visual world, same in both themes */
.city{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#24493B 0%,#0E1814 70%);color:#E6ECE7}
.city canvas{display:block;width:100%;height:300px;touch-action:pan-y;cursor:grab}
.city .cap{position:absolute;left:14px;right:14px;bottom:10px;font-size:12px;color:#CFE3D8;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.city .hd{position:absolute;left:14px;top:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#CFE3D8}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.medal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.25;color:var(--muted);perspective:300px}
.medal .disc{width:52px;height:52px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.medal.on{color:var(--ink)}
.medal.on .disc{border:0;color:#3A2A00;background:conic-gradient(from 210deg,#F6D77A,#E9A93B,#FBE9A8,#D9952A,#F6D77A);box-shadow:0 2px 0 #B67A1C,0 6px 12px rgba(0,0,0,.18)}
.attach{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.attach .fname{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
label.btn.small{display:inline-block;cursor:pointer}
label.btn.small input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn.small:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.readbar{position:sticky;top:0;z-index:5;background:var(--deep);color:var(--on-deep);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.readbar .timer{font-size:28px}
.readbar .pg{font-size:14px;font-weight:600}
.pdfwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:none}
.pdfwrap canvas{display:block}
.samplepg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;font-size:17px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: no-preference){
  .card,.co{animation:in .22s ease-out}
  .fb{animation:flip .4s ease-out;transform-origin:top}
  .medal.on .disc{animation:spin 5s ease-in-out infinite}
}
@keyframes flip{from{transform:perspective(600px) rotateX(-65deg)}to{transform:none}}
@keyframes spin{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(360deg)}}
@keyframes in{from{transform:translateY(5px)}to{transform:none}}

/* exam week planner */
.three{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.pl-steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pl-steps a{display:block;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.pl-steps li[aria-current] a{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.pl-count{display:flex;gap:14px;align-items:center;background:var(--deep);color:var(--on-deep);border-radius:14px;padding:14px 16px}
.pl-count .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.pl-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pl-day{flex:0 0 auto;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:64px;cursor:pointer}
.pl-day span{font-size:12px;color:var(--muted)} .pl-day b{font-size:14px}
.pl-day.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pl-day.exam{background:var(--warn-bg)}
.pl-map{height:240px;border-radius:12px;border:1px solid var(--line);overflow:hidden;z-index:0}
.pl-map.tall{height:320px}
.pl-tl{display:flex;flex-direction:column;gap:6px}
.pl-row{border-radius:10px;padding:8px 10px;font-size:14px;border-left:4px solid var(--line);background:var(--bg)}
.pl-row.ev{border-left-color:var(--muted);background:var(--idle-bg)}
.pl-row.tr{border-left-color:var(--accent)}
.pl-row.st{border-left-color:var(--good);background:var(--good-bg)}
.pl-row.st.done{opacity:.6}
.pl-row.wake{font-size:12px;color:var(--muted);border-left-color:transparent;background:transparent;padding:2px 10px}
.pl-ev{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pl-place .row input{flex:1}
.pl-rec{background:var(--info-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.pl-rec span{color:var(--muted)}
.pl-progress{height:10px;border-radius:99px;background:var(--idle-bg);overflow:hidden}
.pl-progress i{display:block;height:100%;background:var(--good);border-radius:99px}
.pl-line{list-style:none;margin:0;padding:0 0 0 6px;border-left:4px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.pl-line li{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-left:-14px}
.pl-line .dot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--accent);margin-top:2px}
.pl-line .fx .dot{border-color:var(--muted);width:14px;height:14px;margin:4px 3px 0}
.pl-line .go .dot{border-color:var(--accent);width:14px;height:14px;margin:4px 3px 0}
.pl-line .sl.missed .dot{border-color:var(--muted);opacity:.6}
.pl-mrow .st.missed{opacity:.35}
.pl-line .sl.on .dot{background:var(--good);border-color:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
.pl-line .ex .dot{background:var(--accent);width:24px;height:24px}
.pl-metro{display:flex;flex-direction:column;gap:10px}
.pl-mrow{display:flex;align-items:center;gap:10px}
.pl-mrow .d{width:64px;font-size:13px;color:var(--muted)}
.pl-mrow .ln{flex:1;display:flex;align-items:center;gap:8px;border-top:3px solid var(--accent);padding-top:0;min-height:3px;position:relative;top:0;flex-wrap:wrap}
.pl-mrow .st{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-8px}
.pl-mrow .st.learn{width:18px;height:18px;margin-top:-11px}
.pl-mrow .st.on{background:var(--good);border-color:var(--good)}
.pl-mrow .st.exam{background:var(--accent);width:22px;height:22px;margin-top:-13px}
.pl-pin span{display:inline-block;white-space:nowrap;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:999px;padding:2px 8px;font:600 12px var(--body);transform:translate(-50%,-50%)}
.pl-prog{display:flex;align-items:center;gap:8px;margin-top:4px}.pl-prog i{flex:1;max-width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}.pl-prog i b{display:block;height:100%;background:var(--accent)}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
.tg-img{margin:0 0 6px}.tg-img img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block}.tg-img figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.tg-lad{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tg-lad li>*{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none;font:inherit;color:inherit;text-align:left}
.tg-lad li.on>*{border-color:var(--accent);background:var(--idle-bg)}

<div class="cs">
<div class="cs-bar noprint"><h1>Cheat sheet · CM01 IFRS</h1><p class="note">4 A4 sides = your 2 sheets, back to back. Every problem type has an <b>easy</b> and a <b>hard</b> example with the same steps side by side, so you can see what changes. Print or save as PDF at 100% with "background graphics" on.</p><button type="button" class="btn" onclick="window.print()">Print / save as PDF</button></div>

<!-- ================= SIDE 1: CONSOLIDATION ================= -->
<section class="cs-page">
<header class="cs-h"><b>1 · CONSOLIDATION (Topic 2)</b><span>2023: 17 pts · 2025: 20 pts · points = minutes</span></header>
<div class="go">First line to write: <b>S's equity at acquisition = …</b> then <b>Difference = Price − % × S's equity</b>. Then the steps below, in order.</div>

<div class="duo"><div class="col"><div class="lab e">EASY · Case 1 (100%, no goodwill)</div><p class="prob"><b>Problem.</b> On 31 December N-1, PC acquired 100% of SA's shares for 160. Prepare the consolidated balance sheet at the date of acquisition.</p><table class="bs"><tr><th colspan="4">PC (parent)</th></tr><tr><td>Equipment</td><td>240</td><td>Capital</td><td>300</td></tr><tr><td>Investment in SA</td><td>160</td><td>Net income</td><td>20</td></tr><tr><td></td><td></td><td>Liabilities</td><td>80</td></tr><tr class="tot"><td>Total</td><td>400</td><td>Total</td><td>400</td></tr></table><table class="bs"><tr><th colspan="4">SA (subsidiary)</th></tr><tr><td>Equipment</td><td>200</td><td>Capital</td><td>100</td></tr><tr><td></td><td></td><td>Net income</td><td>60</td></tr><tr><td></td><td></td><td>Liabilities</td><td>40</td></tr><tr class="tot"><td>Total</td><td>200</td><td>Total</td><td>200</td></tr></table><p><b>a) PPA</b>: SA's equity at acquisition 100 + 60 = <b>160</b>. Difference 160 − 160 = <b>0</b>. No fair values are given, so VD = 0 and <b>goodwill 0</b>.<br><b>b) Add 100%</b> of SA's lines. <b>c) Eliminate</b>: the investment of 160 becomes 0, and SA's capital and NI disappear. <b>d) NCI</b>: none (100%).</p><table class="bs"><tr><th colspan="4">Consolidated (PC group)</th></tr><tr><td>Equipment (240 + 200)</td><td>440</td><td>Capital (PC only)</td><td>300</td></tr><tr><td>Investment in SA</td><td>0</td><td>Net income (PC only)</td><td>20</td></tr><tr><td></td><td></td><td>Liabilities (80 + 40)</td><td>120</td></tr><tr class="tot"><td>Total</td><td>440</td><td>Total</td><td>440</td></tr></table><p class="small" style="margin-top:3px"><b>What the hard one adds:</b> the parent owns less than 100%, so use the % in the difference and the VD, and add the NCI step. Fair values are given, so the VD lines go in at 100%. Goodwill is what is left.</p><div class="box tfbox"><h4>True or false (slides, 2023, 2025, midterm)</h4><ul class="tf"><li>A parent controls a company once it owns at least 20% of the votes. <b class="ff">False.</b> 20% is the usual threshold for significant influence. Control usually needs more than 50%, or rights such as naming most of the board.</li><li>Control is possible with 45%, or even 0%, of the shares. <b class="tt">True.</b> Through shareholders' agreements, a board majority, double voting rights, or contracts.</li><li>Goodwill is always price minus the book value of the shares bought. <b class="ff">False.</b> It is price minus the share of the <b>fair</b> value of the net assets, measured at the acquisition date.</li><li class="noprint">Positive goodwill is amortised over its useful life. <b class="ff">False.</b> It is never amortised. It is tested for impairment every year.</li><li class="noprint">Negative goodwill is recognised immediately as a profit. <b class="tt">True.</b> After re-checking the fair values, it is a gain in P&amp;L in the year of acquisition.</li><li class="noprint">NCI provide equity to a subsidiary, so they belong in consolidated equity. <b class="tt">True.</b> Shown as a separate line inside equity, not as a liability.</li><li class="noprint">A company under significant influence is part of the scope of consolidation. <b class="tt">True.</b> It is included, but with the equity method (one line), not line by line.</li><li class="noprint">A buys 100% of B for 800 (B's book value 500, B's own brand worth 100). The brand can't be recognised because it was internally generated. <b class="ff">False.</b> In the acquisition it is recognised at fair value. Goodwill = 800 − 600 = 200, and full consolidation applies.</li><li class="noprint">A 60% subsidiary wrongly put on the equity method understates group debt by 60% of its debt. <b class="ff">False.</b> By 100% (800,000 in 2025 MCQ a): full consolidation adds all its debt, the equity method adds none.</li><li class="noprint">Associates show up as "share of profit of associates" (P&amp;L) and "investments in associates" (BS). <b class="tt">True.</b> Not 100% owned shows up as: NI attributable to NCI, NCI in equity, dividends paid to NCI.</li></ul><p class="small noprint"><b>Midterm sums:</b> 70% of E1 for 1,000, equity 800, land +180: goodwill 1,000 − 70% × 980 = <b>314</b>. 70% for 210, equity 300: NCI 30% × 300 = <b>90</b>. PC NI 80, 100%-owned SA NI 130: consolidated NI <b>210</b>. Subsidiary bought mid-year: its income counts from the acquisition date. NCI rises when the parent sells shares (80% to 60%).</p></div><div class="box trap noprint"><h4>Traps</h4>
<p>Leaving the investment on the balance sheet (it must be 0). Leaving S's pre-acquisition equity in. Adding only 80% of S's assets (always 100%). Putting the patent or uplift in at 80% (it is 100%; only goodwill uses the 80%). Calculating NCI on book value only (add the VD). Booking synergies as an asset.</p></div></div><div class="col"><div class="lab h">HARD · 2025 exam, Part 1 (80%, VD, goodwill, NCI) · 14 pts</div><p class="prob"><b>Problem.</b> On 1 January N, AURORA acquired 80% of VEGA's shares for 3,200 K€ (cash). VEGA has internally developed a patented technology whose fair value is 400. VEGA's equipment is worth 200 more than its book value; all other assets and liabilities are at carrying value. 1. PPA: calculate goodwill. 2. Prepare the consolidated balance sheet at the acquisition date.</p><table class="bs"><tr><th colspan="4">AURORA (after the acquisition)</th></tr><tr><td>Land</td><td>600</td><td>Share capital</td><td>1,200</td></tr><tr><td>Equipment</td><td>2,400</td><td>Retained earnings</td><td>3,000</td></tr><tr><td>Investment in VEGA</td><td>3,200</td><td>Net income</td><td>400</td></tr><tr><td>Current assets</td><td>800</td><td>Liabilities</td><td>2,400</td></tr><tr class="tot"><td>Total</td><td>7,000</td><td>Total</td><td>7,000</td></tr></table><table class="bs"><tr><th colspan="4">VEGA (acquisition date)</th></tr><tr><td>Land</td><td>500</td><td>Share capital</td><td>800</td></tr><tr><td>Equipment</td><td>1,800</td><td>Retained earnings</td><td>1,400</td></tr><tr><td>Current assets</td><td>700</td><td>Net income</td><td>300</td></tr><tr><td></td><td></td><td>Liabilities</td><td>500</td></tr><tr class="tot"><td>Total</td><td>3,000</td><td>Total</td><td>3,000</td></tr></table><p class="small"><b>Words:</b> <i>VD</i> = how much more the identifiable items (brand, patent, equipment) are worth than their book value. <i>Goodwill</i> = what is paid on top for reputation, team, synergies. <i>Eliminate</i> = remove the investment and S's equity, because they are the same thing counted twice. <i>NCI</i> = the other shareholders' part.</p><p><b>a) PPA</b>: VEGA's equity 800 + 1,400 + 300 = <b>2,500</b>. Difference 3,200 − 80% × 2,500 = <b>1,200</b>. VD 80% × (400 + 200) = <b>480</b>. Goodwill = 1,200 − 480 = <b>720</b>.<br><b>b) Add 100%</b> of VEGA's lines + 100% of the VD (patent 400, equipment +200). <b>c) Eliminate</b>: the investment of 3,200 becomes 0, and VEGA's equity of 2,500 disappears. <b>d) NCI</b> = 20% × (2,500 + 600) = <b>620</b>.</p><table class="bs"><tr><th colspan="4">Consolidated (AURORA group)</th></tr><tr><td>Goodwill</td><td>720</td><td>Share capital (AURORA)</td><td>1,200</td></tr><tr><td>Patented technology</td><td>400</td><td>Retained earnings (AURORA)</td><td>3,000</td></tr><tr><td>Land (600 + 500)</td><td>1,100</td><td>Net income (AURORA)</td><td>400</td></tr><tr><td>Equipment (2,400 + 1,800 + 200)</td><td>4,400</td><td>NCI</td><td>620</td></tr><tr><td>Current assets (800 + 700)</td><td>1,500</td><td>Liabilities (2,400 + 500)</td><td>2,900</td></tr><tr><td>Investment in VEGA</td><td>0</td><td></td><td></td></tr><tr class="tot"><td>Total</td><td>8,120</td><td>Total</td><td>8,120</td></tr></table></div></div>

<table class="pair"><tr><th>Step</th><th class="e">EASY · one year later, 100% (Case 1b)</th><th class="h">HARD · two years later, 80% (Case 6b, paid 160)</th></tr><tr class="prob"><td>Problem</td><td>PC bought 100% of SA for 160 on 31 Dec N-1, when SA's equity was capital 100 + NI 60. On 31 Dec N, SA's equity is capital 100, retained earnings 60, NI 120 (PC: capital 300, NI 80). Prepare the consolidated balance sheet at 31 Dec N.</td><td>PC bought 80% of SA for 160 when SA's equity was 200. Two years later SA's equity is 480. Prepare the consolidated balance sheet: what goes to the group, what to the NCI?</td></tr>
<tr><td>1 Earned since acq. (S's equity now − at acquisition)</td><td>SA's equity now 280 − at acq. 160 = <b>120</b></td><td>480 − 200 = <b>280</b></td></tr>
<tr><td>2 Group's share</td><td>100% × 120, so group NI = 80 + 120 = <b>200</b></td><td>80% × 280 = <b>224</b> into group equity</td></tr>
<tr><td>3 NCI</td><td>none</td><td>20% × 480 = <b>96</b></td></tr>
<tr><td>4 Rest as before</td><td colspan="2">Goodwill and VD stay (unless impaired; stepped-up PPE gets extra depreciation). Investment still 0. SA's equity <b>from before</b> the acquisition still gone.</td></tr></table>

<table class="pair"><tr><th>Step</th><th class="e">EASY · associate: 40% bought for 60, NI 20</th><th class="h">HARD · Case 9c: 40% of A for 160, A's equity grows from 250 to 510</th></tr><tr class="prob"><td>Problem</td><td>PC buys 40% of A for 60 and has significant influence. A makes a net income of 20 in the year and pays no dividend. What is the investment worth at year end, and what shows in PC's P&amp;L?</td><td>PC paid 160 for 40% of A when A's equity was 250. A's equity is now 510. Investment in A on the consolidated balance sheet?</td></tr>
<tr><td>1 Method</td><td colspan="2">20–50% means significant influence, so use the <b>equity method</b>: no adding lines, no elimination, no NCI. 1 BS line + 1 P&amp;L line.</td></tr>
<tr><td>2 PPA</td><td>(not asked)</td><td>160 − 40% × 250 = 60 goodwill, <b>inside the investment</b></td></tr>
<tr><td>3 Share of growth</td><td>40% × 20 = <b>8</b> (P&amp;L: "share of profit of associates")</td><td>40% × (510 − 250) = <b>104</b></td></tr>
<tr><td>4 Investment</td><td>60 + 8 = <b>68</b></td><td>160 + 104 = <b>264</b> (minus dividends received)</td></tr></table>

<div class="cs-cols">
<div class="box noprint"><h4>Key words in the steps (on screen only; short versions are in the step names)</h4><dl class="kw"><dt>Control</dt><dd>The parent can decide the subsidiary's policies. Usually more than 50% of the votes, but also possible with less: a shareholders' agreement, the right to name most of the board, double voting rights. <i>Yes:</i> 45% plus the right to appoint most board members. <i>No:</i> 30% and one board seat (that is significant influence).</dd><dt>Significant influence</dt><dd>The investor takes part in decisions but can't impose them. Usually 20–50%. It is accounted for with the equity method.</dd><dt>S's equity (book value of net assets)</dt><dd>What the subsidiary's own balance sheet says it is worth: assets minus liabilities. Add up its capital, reserves and net income.</dd><dt>Fair value</dt><dd>What the item would sell for today between willing parties.</dd><dt>Valuation difference (VD)</dt><dd>How much more the identifiable items are worth than their book value. VEGA's own patent: book value 0, fair value 400, so VD 400.</dd><dt>Identifiable</dt><dd>Can be sold on its own, or comes from a contract or legal right: brand, patent, customer list, domain name. <i>Not identifiable:</i> staff know-how, synergies. Those are part of goodwill.</dd><dt>Goodwill</dt><dd>What the parent paid on top of the fair value of everything identifiable: for reputation, team, synergies.</dd><dt>Eliminate</dt><dd>Remove the investment and S's equity at acquisition. Seen from the group they are the same thing, so keeping both would count it twice.</dd><dt>NCI (non-controlling interest)</dt><dd>The part of S's equity owned by the other shareholders (20% of VEGA).</dd></dl></div>

</div></section>

<!-- ================= SIDE 2: IMPAIRMENT ================= -->
<section class="cs-page">
<header class="cs-h"><b>2 · IMPAIRMENT &amp; NON-CURRENT ASSETS (Topic 3)</b><span>2023: 18 pts machine + 5 · 2025: 10 pts CGU</span></header>
<div class="go"><b>Cost or depreciation question</b>, first write: <b>Cost = price + everything needed to get it working</b>. <b>Impairment question</b>, first write: <b>Is there an indication? (what happened)</b>, then <b>BV at the test date</b>, then <b>RA = higher of (FV − costs to sell) and value in use</b>.</div>

<table class="pair tight"><tr><th>Step</th><th class="e">EASY · Case 1 (A): Malaga's machine, cost and first depreciation</th><th class="h">HARD · Case 1 (B) + (C): upgrade in N+2; building with a roof</th></tr>
<tr class="prob"><td>Problem</td><td>Machine received 1 Oct N, ready to use 31 Oct N. Price USD 600,000 (1 USD = 0.9 EUR on the purchase date). Transport €26,000. Installation by own workers €5,000. User training €10,000. Depreciated on units produced: N 50,000, N+1 150,000, N+2 200,000, N+3 100,000. Residual value €200,000.</td><td>(B) Same machine. January N+2: €40,000 of modifications that increase capacity; now plans 250,000 units in N+2 and 110,000 in N+3. (C) Building bought for €6,000,000, life 30 years; a new roof is planned after 15 years, estimated €1,000,000.</td></tr>

<div class="box wide cols2" style="font-size:6.6pt;line-height:1.15;padding:.8mm 1.4mm"><h4>Cost model or revaluation model? (IAS 16, IAS 38)</h4>
<p>Chosen per <b>whole class</b> of assets. <b>Cost</b>: cost − depreciation − impairment (all cases above). <b>Revaluation</b>: fair value − later depreciation − impairment; only with reliable fair values (intangibles: active market only, never brands/patents); an increase goes to <b>OCI</b> (other comprehensive income: straight into equity, not net income), a decrease to P&amp;L. <b>Say</b>: "Cost model: objective prices, simpler and cheaper, no volatility, the only option without reliable fair values." "Revaluation model if fair values are reliable and far from cost (buildings in a rising market): current values, higher equity, lower gearing; but higher depreciation, lower net income and ROCE, valuation costs." If values rise, the cost model hurts net income <b>less</b> (midterm).</p></div>
<div class="cs-cols">
<div class="box noprint"><h4>Key words in the steps (on screen only; short versions are in the step names)</h4><dl class="kw"><dt>Book value (BV), carrying amount</dt><dd>Cost minus all depreciation and impairment so far. Bilbao after 5 of 25 years: 250 × 20/25 = 200.</dd><dt>Indication</dt><dd>Something that happened that suggests the asset may be worth less than its BV. <i>Yes:</i> market price fell (planes), a new law limits its use (BUILD N3), damage, obsolescence, results worse than planned, interest rates up, a crisis in the market (SEAT). <i>No:</i> a normal year, production as planned (BUILD N1–N2): then <b>no test</b>, except goodwill and indefinite-life intangibles, which are tested every year anyway.</dd><dt>Indication of reversal</dt><dd>The reason for the impairment has gone away or improved (BUILD N4: production allowed again).</dd><dt>FVLCS (fair value less costs to sell)</dt><dd>What you'd get by selling it, minus the selling costs. BUILD N3: 170,000 − 18,000 = 152,000.</dd><dt>VIU (value in use)</dt><dd>Today's value of the cash the asset will still earn if you keep using it (present value of future cash flows).</dd><dt>Recoverable amount (RA)</dt><dd>The <b>higher</b> of FVLCS and VIU: you would either sell or keep using, whichever is worth more.</dd><dt>Impairment loss</dt><dd>BV minus RA, if positive. An expense in P&amp;L; the asset's BV goes down to the RA.</dd><dt>Reversal cap</dt><dd>The highest the BV may go back up to: what the BV would be with normal depreciation and no impairment. Never above that, and never for goodwill.</dd><dt>CGU (cash-generating unit)</dt><dd>The smallest group of assets that earns cash on its own: a store, a plant, a division (Pritt). Goodwill is always tested inside a CGU.</dd><dt>Pro rata</dt><dd>In proportion to the BVs of the remaining assets.</dd></dl></div>
<div class="box tfbox noprint"><h4>True or false (slides, 2023, 2025, midterm)</h4><ul class="tf"><li>Research costs are always expensed; development is capitalised once the IAS 38 criteria are met. <b class="tt">True.</b> 2025 MCQ e.</li><li>Internally generated brands, publishing titles and customer lists can be recognised if legally protected. <b class="ff">False.</b> Never, even with a reliable fair value.</li><li>Acquired brand names have to be amortised. <b class="ff">False.</b> A brand with an indefinite life is not amortised; it is tested for impairment every year.</li><li class="noprint">Tangible assets have to be measured at fair value under IFRS. <b class="ff">False.</b> The cost model is the norm; revaluation is an option.</li><li class="noprint">If the RA rises after an impairment, the BV goes back up to the historical cost. <b class="ff">False.</b> Only up to the depreciated cost without impairment (the cap).</li><li class="noprint">An asset that doesn't generate cash on its own is tested as part of a group of assets (CGU). <b class="tt">True.</b> That is when an individual test is impossible.</li></ul><p class="small noprint"><b>Midterm answers:</b> training for new robots = expense. Wind prototype nobody would buy at that price = expense (no future benefits). Vaccine before approval = expense. Auction house bought for 30m with net assets of 10m: its brand wasn't in its own books. Machine cost: 540,000 + 26,000 + 5,000 = <b>571,000</b> (party and training excluded). Cost model preferred: if value rises, revaluation raises depreciation. A CGU impairment lowers operating income and non-current assets.</p></div>
<div class="box trap noprint"><h4>Traps</h4>
<p>Skipping the useful-life review · FV instead of FV <b>less costs to sell</b> · taking the lower of the two (it's the <b>higher</b>) · reversal above the cap · reversing goodwill · writing land up · forgetting depreciation in the test year before comparing.</p></div>
</div></section>

<div class="box noprint"><h4>Key words in the steps (on screen only; short versions are in the step names)</h4><dl class="kw"><dt>Identified asset</dt><dd>A specific asset named in the contract (or clearly implied), which the supplier can't swap.</dd><dt>Substantive substitution right</dt><dd>The supplier can swap the asset at any time <b>and</b> gains from doing so. Then there is no identified asset (SAUSAGE). A right to swap only for repairs, or only if unlikely events happen, doesn't count (BRAND).</dd><dt>Right to direct the use</dt><dd>The customer decides how and for what the asset is used: what, when, where, how much. Limits that only protect the asset (no piracy waters, max 20,000 km a year) don't take that away.</dd><dt>Lease liability</dt><dd>Today's value of the lease payments still to be made.</dd><dt>Right-of-use (ROU) asset</dt><dd>The right to use the asset, on the asset side. Starts at the liability plus payments made at the start and direct costs, minus incentives.</dd><dt>Incremental borrowing rate</dt><dd>The rate the lessee would pay to borrow a similar amount for the same period. Used when the lease's own rate isn't known.</dd><dt>Annuity factor</dt><dd>The number you multiply one yearly payment by to get today's value of all of them.</dd><dt>Short-term / low-value</dt><dd>Lease of 12 months or less, or an asset worth about USD 5,000 new. The lessee may simply expense the payments.</dd></dl></div><div class="box tfbox wide"><h4>True or false (slides, 2023, 2025, midterm)</h4><ul class="tf"><li>Under IFRS 16, a lessee recognises lease payments as a straight-line rent expense. <b class="ff">False.</b> It shows depreciation of the ROU asset plus interest on the liability (except short-term and low-value leases).</li><li>At the start of a lease, the ROU asset always equals the lease liability. <b class="ff">False.</b> Payments made at the start, direct costs and incentives change it (Adams: 41,565 vs 31,597).</li><li class="noprint">A 4-year lease o <div class="box wide"><h4>Topic 1 · converting the income statement: by nature ⇄ by function (Case 2, Company XX)</h4>
<p class="small"><b>By nature</b> lists costs by what they are (raw materials, employee costs, depreciation). <b>By function</b> groups them by what they are for (cost of sales, selling/general/admin). Converting only <b>regroups</b> the costs: operating profit, financial result, tax and net income never change. That is your check.</p>
<table class="pair"><tr><th>Step</th><th class="e">EASY · made-up numbers</th><th class="h">HARD · Case 2: XX, new owners want it by function (€m)</th></tr>
<tr class="prob"><td>Problem</td><td>By nature: revenue 1,000; raw materials 400; employee costs 350 (150 in production, 200 in admin); depreciation 70 (50 production, 20 admin); other expenses 30 (admin). Present it by function.</td><td>Sales 31,155; other revenues 197; gain on sale of assets 20; raw materials 11,400; other purchases 3,788; taxes other than income 420; employee costs 7,540; other expenses 387; depreciation 1,269; operating profit 6,568. Split given: purchases 1,050 production / 2,738 SG&amp;A; taxes all SG&amp;A; employees 5,210 / 2,330; other expenses all SG&amp;A; depreciation 1,200 / 69.</td></tr>
<tr><td>1 Revenue stays on top</td><td>1,000</td><td>31,155</td></tr>
<tr><td>2 Other operating income goes to "other income"</td><td>none</td><td>197 + 20 = <b>217</b></td></tr>
<tr><td>3 Each cost to its function, using the split given (production = cost of sales)</td><td>Cost of sales: 400 + 150 + 50 = <b>600</b>. Admin: 200 + 20 + 30 = <b>250</b></td><td>Cost of sales: 11,400 + 1,050 + 5,210 + 1,200 = <b>18,860</b>. SG&amp;A: 2,738 + 420 + 2,330 + 387 + 69 = <b>5,944</b></td></tr>
<tr><td>4 Build it</td><td>1,000 − 600 = gross margin 400; − 250 = operating profit <b>150</b></td><td>31,155 − 18,860 = gross margin <b>12,295</b>; − 5,944 + 217 = operating profit <b>6,568</b></td></tr>
<tr><td>5 Check</td><td colspan="2">Operating profit is the same as by nature (150; 6,568). Everything below it is copied unchanged: net financial expense (1,056), tax (2,502), NI 3,010.</td></tr>
<tr><td>Other way: by function to by nature</td><td colspan="2">You need each function's split by nature (by-function companies give depreciation and employee costs in the notes). Add each nature across the functions: employee costs 150 + 200 = 350. Without that note you <b>can't</b> (2025 Q5.2).</td></tr></table>
</div>
<div class="cs-cols">
<div class="box"><h4>Debt or equity (IAS 32): quick table</h4>
<table><tr><td>Must repay / holder can demand repayment (put)</td><td>liability</td></tr><tr><td>Coupon only if a condition outside your control (rates, CO₂ target)</td><td>liability</td></tr><tr><td>Perpetual, interest/dividend at issuer's discretion</td><td><b>equity</b> (2025 c)</td></tr><tr><td>Redeemable only at the entity's option</td><td>equity</td></tr><tr><td>Preferred with guaranteed cumulative dividend + put</td><td>liability (worsens D/E)</td></tr><tr><td>Paid in own shares: fixed number for fixed amount / variable number</td><td>equity / liability</td></tr></table>
<p>Name and label (bond, share, dividend) don't matter. <b>Convertible bond</b>: liability = PV of coupons + principal at the market rate without conversion; equity = proceeds − liability (e.g. 100 received: liability 95, equity 5).</p></div><div class="box tfbox noprint"><h4>Topic 4 · true or false</h4><dl class="kw noprint"><dt>Contractual obligation</dt><dd>The contract forces the issuer to pay cash, and it can't avoid it. That makes it a liability.</dd><dt>Puttable</dt><dd>The holder can force the issuer to buy the instrument back. That makes it a liability, even for shares.</dd><dt>Amortised cost / effective interest</dt><dd>The liability starts at the cash received; each year the effective rate × the liability is the expense, the coupon is the cash.</dd><dt>Treasury shares</dt><dd>The company's own shares it bought back. Deducted from equity at cost.</dd></dl><ul class="tf"><li>Preferred shares are equity because they are called shares. <b class="ff">False.</b> If they must be repaid or carry a guaranteed dividend, they are a liability.</li><li>A perpetual bond is debt because it is called a bond. <b class="ff">False.</b> No obligation to repay and interest at the issuer's discretion: equity.</li><li>Costs of issuing equity or debt are expensed. <b class="ff">False.</b> Equity: deducted from equity. Debt: inside the effective interest.</li><li class="noprint">Bond interest expense = nominal rate × issue amount. <b class="ff">False.</b> Effective rate × carrying amount.</li><li class="noprint">The debt or equity distinction matters only on the issuer's side. <b class="ff">False.</b> The holder classifies its financial asset with it too.</li><li class="noprint">Issued minus authorised shares is explained by treasury shares. <b class="ff">False.</b> Issued minus outstanding = treasury shares. Authorised minus issued = not yet issued.</li></ul><p class="small noprint"><b>Midterm sums:</b> 2,000 own shares bought at 15, sold at 20: cash +40,000, treasury +30,000 (less negative), premium +10,000. Bond 1,000 issued at 900, coupon 4%, effective 8%: year 1 interest 72, liability 932; year 2 interest 74.56, cash 40, liability <b>966.56</b>. Capital 777 to 885 at par 2: 54m new shares, issued for 108 + premium 614 = <b>722m</b>; treasury −50 to −82: bought back own shares for <b>32m</b>.</p></div>
<div class="box"><h4>Formulas</h4>
<table><tr><td>EBITDA</td><td>operating profit + depreciation, amortisation (impairment). Non-GAAP, not defined in IAS 1.</td></tr>
<tr><td>P&amp;L order</td><td>Sales − cost of sales = gross margin; EBITDA; − D&amp;A = recurring operating profit; ± non-recurring = EBIT; − interest = EBT; − tax = net income.</td></tr>
<tr><td>CE, asset approach</td><td>non-current operating assets + inventories + receivables − payables</td></tr>
<tr class="noprint"><td>ROCE pre-tax</td><td>EBIT / CE</td></tr>
<tr class="noprint"><td>EVA alt.</td><td>(ROCE − WACC) × CE</td></tr>
<tr><td>Free cash flow</td><td>operating CF + investing CF (2023: 5,168 − 2,286 = 2,882)</td></tr></table></div>
<div class="box tfbox"><h4>Topic 5 · exam MCQs <span class="noprint">and true or false</span></h4><ul class="tf noprint"><li>EBITDA is a GAAP KPI defined by IAS 1. <b class="ff">False.</b> Non-GAAP; companies define it themselves (IFRS 18 calls these management-defined measures).</li><li>EBITDA helps compare companies with different debt, depreciation policies and tax rates. <b class="tt">True.</b> It is before interest, tax and depreciation.</li><li>EBITDA differs from operating cash flow because it is before working-capital changes. <b class="tt">True.</b> </li><li class="noprint">ROCE measures the return on shareholders' capital. <b class="ff">False.</b> On all capital employed: debt and equity.</li><li class="noprint">Capital employed isn't affected by depreciation policies. <b class="ff">False.</b> Assets are net of depreciation, so CE moves with it.</li><li class="noprint">Delaying profitable investments can raise ROCE but reduce the firm's value. <b class="tt">True.</b> Less CE now, fewer profits later.</li><li class="noprint">Dividends paid reduce free cash flow to the firm. <b class="ff">False.</b> Dividends affect neither FCF to the firm nor FCF to equity.</li><li class="noprint">Debt repayments don't reduce FCF to the firm but do reduce FCF to equity. <b class="tt">True.</b> </li></ul><p class="small"><b>Exam MCQs:</b> turn a negative EBITDA around with lower purchase prices (2025 d); capitalising eligible costs also raises EBITDA, since they become amortisation (midterm). ROCE = EBIT × (1 − t) / CE (2025 f), not EBITDA / total assets, not mandatory (2023 b).</p><p class="small noprint"><b>Midterm sums:</b> EBITDA = 4,357 + 1,100 = 5,457. CE = 20 + 140 − 10 = 150. ROCE = (1,000 − 200) / 4,000 = 20%. NOPAT margin 900 / 9,000 = 10%, turnover 9,000 / 18,000 = 0.5. FCF to the firm = 1,000 × 0.75 + 100 − 80 − 800 = −30. Same EBITDA and CE but more amortisation: lower ROCE. EVA improves if WACC falls.</p></div>


<div class="box wide cols2"><h4>Topic 1 · income statement vs statement of comprehensive income (SCI)</h4>
<p><b>What it is</b>: comprehensive income = net income + OCI, shown in one statement or two (IAS 1). <b>OCI</b>: gains and losses kept out of net income: revaluation surplus, FX translation of foreign subsidiaries, cash-flow hedges, FVOCI investments, actuarial gains. Net loss 1,000 + OCI 300 = −700.</p>
<p><b>Why separate</b>: net income should show the performance of running the business. OCI items are mostly unrealised value changes (exchange rates, market prices, actuarial assumptions) that management doesn't control and that may reverse; mixed in, they would make net income and EPS jumpy and hard to compare. Some are later "recycled" into net income when realised (FX translation when the subsidiary is sold, hedges); others never are (revaluation surplus, actuarial gains).</p>
<p><b>Non-recurring items</b> (unusual, not every year): gain or loss on selling non-current assets (XX: +20), restructuring costs, impairment losses, litigation settlements, selling a business (discontinued operations), disaster losses. IAS 1 <b>forbids</b> the word "extraordinary": they appear as "other operating income/expenses" or "non-recurring", below recurring operating profit.</p></div>
<div class="box tfbox noprint"><h4>Topic 1 · true or false (slides, midterm)</h4><ul class="tf"><li>The Conceptual Framework is an IFRS and overrides the standards. <b class="ff">False.</b> It is not a standard. A standard wins in a conflict; the Framework helps where no standard applies.</li><li>EU listed companies may present consolidated statements under IFRS or local GAAP. <b class="ff">False.</b> IFRS is mandatory for them since 2005. Individual statements (e.g. a French company's) usually stay local GAAP.</li><li>The objective of financial reporting is useful information for all users. <b class="ff">False.</b> For investors, lenders and other creditors.</li><li class="noprint">Receivables due in more than one year must be non-current. <b class="ff">False.</b> Current if within the normal operating cycle. Trade payables due in 18 months are current too.</li><li class="noprint">Operating profit is precisely defined under IFRS. <b class="ff">False.</b> Not under IAS 1 (Carrefour's subtotals: none is mandatory). IFRS 18 defines it from 2027.</li><li class="noprint">Operating cash flow must use the direct method. <b class="ff">False.</b> Direct or indirect.</li><li class="noprint">Extraordinary items must be shown on a separate line. <b class="ff">False.</b> IAS 1 forbids presenting anything as extraordinary.</li><li class="noprint">The statement of changes in equity shows dividends and treasury share purchases and sales. <b class="tt">True.</b> </li><li class="noprint">Comprehensive income = net income + OCI. <b class="tt">True.</b> Net loss 1,000 + OCI 300 = −700.</li><li class="noprint">A company presenting costs by nature shows cost of goods sold. <b class="ff">False.</b> Cost of goods sold is a by-function line; by nature shows personnel costs, purchases, depreciation.</li></ul><p class="small noprint"><b>Midterm sum:</b> operating CF = NI 100 + depreciation 70 − receivables increase 5 = <b>165</b>. <b>Prove IFRS:</b> "statement of financial position", OCI, ROU assets, "IFRS as adopted by the EU". <b>Prove consolidated:</b> NCI, goodwill, associates.</p></div>

function bookPut(k, v){ return bookDb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction("b", "readwrite"); tx.objectStore("b").put(v, k); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; }); }); }

    var raw = Uint8Array.from(atob(r.data.k), function(c){ return c.charCodeAt(0); });

/* ================= case engine: consolidates line-item balance sheets exactly like the course cases ================= */
function cxSum(a){ return a.reduce(function(s,x){ return s + x[1]; }, 0); }
function cxR(x){ return Math.round(x*100)/100; }
function cxF(x){ return (Math.round(x*100)/100).toLocaleString("en-US"); }
function cxIsInv(n){ return /^Investment in /.test(n); }
function cxKey(n){ return n.toLowerCase().replace(/[^a-z]/g,""); }
/* c: {P:{a,e,l}, S:{a,e,l}, Sacq:[equity lines at acquisition] (optional), pct, price, fv:[[line, delta]], method:"full"|"equity", pname, sname, later:bool} */
function cxPoss(n){ return /s$/.test(n) ? n+"'" : n+"'s"; }
function cxSolve(c){
  var pct = c.pct, S = c.S, P = c.P, sacq = c.Sacq || S.e, bv = cxSum(sacq), vd = cxSum(c.fv||[]), fvNet = bv + vd;
  var gw = cxR(c.price - pct*fvNet), sol = [], A = [], EL = [], add = function(arr, n, v, how){ var k = cxKey(n), f = arr.filter(function(x){ return cxKey(x[0])===k; })[0]; if(f){ f[1] = cxR(f[1]+v); f[2].push(how); } else arr.push([n, cxR(v), [how]]); };
  /* purchase price allocation */
  sol.push("Purchase price allocation. Book value of "+cxPoss(c.sname)+" equity at acquisition: "+sacq.map(function(x){ return x[0]+" "+cxF(x[1]); }).join(" + ")+" = "+cxF(bv)+"."+(pct<1?" "+c.pname+" bought "+Math.round(pct*100)+"%, so its share is "+cxF(pct*bv)+".":""));
  if(vd) sol.push("Valuation differences (fair value − book value): "+c.fv.map(function(x){ return x[0]+" +"+cxF(x[1]); }).join(", ")+" = "+cxF(vd)+". Fair value of net assets = "+cxF(bv)+" + "+cxF(vd)+" = "+cxF(fvNet)+".");
  sol.push("Goodwill = price "+cxF(c.price)+" − "+(pct<1?Math.round(pct*100)+"% × ":"")+"fair value of net assets "+cxF(fvNet)+" = "+cxF(gw)+(gw>0?". It goes on the consolidated balance sheet as an intangible asset.":gw<0?". Negative goodwill is a gain in the income statement.":". No goodwill."));
  var sNow = cxSum(S.e), post = sNow - bv, sNI = (S.e.filter(function(x){ return /net income/i.test(x[0]); })[0]||[0,0])[1], sOCI = (S.e.filter(function(x){ return /comprehensive/i.test(x[0]); })[0]||[0,0])[1], aOCI = (sacq.filter(function(x){ return /comprehensive/i.test(x[0]); })[0]||[0,0])[1];
  var postNI = c.later ? Math.min(sNI, post) : 0, postOCI = c.later ? sOCI - aOCI : 0, postRE = c.later ? post - postNI - postOCI : 0;
  if(c.later) sol.push(cxPoss(c.sname)+" equity grew from "+cxF(bv)+" at acquisition to "+cxF(sNow)+" now: "+cxF(post)+" earned since "+c.pname+" bought it ("+(postNI?"this year's net income "+cxF(postNI):"")+(postRE?", retained earnings since then "+cxF(postRE):"")+(postOCI?", OCI "+cxF(postOCI):"")+"). The group keeps "+Math.round(pct*100)+"% of it"+(pct<1?", the rest belongs to non-controlling interest":"")+".");
  if(c.method === "equity"){
    var inv = cxR(c.price + pct*post);
    P.a.forEach(function(x){ if(cxIsInv(x[0])) add(A, "Equity method investment", inv, c.later ? "price "+cxF(c.price)+" + "+Math.round(pct*100)+"% × "+cxF(post)+" earned since acquisition" : "the price paid, "+cxF(c.price)); else add(A, x[0], x[1], c.pname+" "+cxF(x[1])); });
    P.e.forEach(function(x){ add(EL, x[0], x[1], c.pname+" "+cxF(x[1])); });
    if(postNI) add(EL, "Net Income", cxR(pct*postNI), "+ "+Math.round(pct*100)+"% × "+cxF(postNI)+" (share of the associate's profit)");
    if(postRE) add(EL, "Retained Earnings", cxR(pct*postRE), "+ "+Math.round(pct*100)+"% × "+cxF(postRE)+" (share of its retained profit since acquisition)");
    if(postOCI) add(EL, "Other Comprehensive Income", cxR(pct*postOCI), "+ "+Math.round(pct*100)+"% × "+cxF(postOCI));
    P.l.forEach(function(x){ add(EL, x[0], x[1], c.pname+" "+cxF(x[1])); });
    sol.push("Equity method: nothing of "+c.sname+" is added line by line and nothing is cancelled. Only the investment line changes, to "+cxF(inv)+".");
  } else {
    P.a.forEach(function(x){ if(!cxIsInv(x[0])) add(A, x[0], x[1], c.pname+" "+cxF(x[1])); });
    S.a.forEach(function(x){ add(A, x[0], x[1], c.sname+" "+cxF(x[1])); });

    if(gw > 0) add(A, "Goodwill", gw, "from the purchase price allocation");
    P.e.forEach(function(x){ add(EL, x[0], x[1], c.pname+" "+cxF(x[1])); });
    if(postNI) add(EL, "Net Income", cxR(pct*postNI), "+ "+(pct<1?Math.round(pct*100)+"% × ":"")+cxF(postNI)+" ("+cxPoss(c.sname)+" profit this year)");
    if(postRE) add(EL, "Retained Earnings", cxR(pct*postRE), "+ "+(pct<1?Math.round(pct*100)+"% × ":"")+cxF(postRE)+" ("+cxPoss(c.sname)+" retained profit since acquisition)");
    if(postOCI) add(EL, "Other Comprehensive Income", cxR(pct*postOCI), "+ "+cxF(postOCI));
    if(pct < 1) add(EL, "Non-controlling interest", cxR((1-pct)*(sNow+vd)), Math.round((1-pct)*100)+"% × "+cxPoss(c.sname)+" equity "+cxF(sNow+vd));

    S.l.forEach(function(x){ add(EL, x[0], x[1], c.sname+" "+cxF(x[1])); });
    sol.push("Investment in "+c.sname+" ("+cxF(c.price)+") is cancelled against "+(pct<1?Math.round(pct*100)+"% of ":"")+cxPoss(c.sname)+" equity at acquisition"+(vd?" at fair value":"")+". So "+cxPoss(c.sname)+" own equity lines ("+S.e.map(function(x){ return x[0]; }).join(", ")+") disappear: only "+cxPoss(c.pname)+" equity stays"+(c.later?", plus the group's share of what "+c.sname+" earned since":"")+".");
  }
  var tA = cxR(cxSum(A)), tE = cxR(cxSum(EL));
  A.forEach(function(x){ sol.push(x[0]+": "+x[2].map(function(p,i){ return i===0 ? p : (p.charAt(0)==="+" ? p : "+ "+p); }).join(" ")+" = "+cxF(x[1])+"."); });
  EL.forEach(function(x){ sol.push(x[0]+": "+x[2].map(function(p,i){ return i===0 || p.charAt(0)==="+" ? p : "+ "+p; }).join(" ")+" = "+cxF(x[1])+"."); });

}
