<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finish Line prototype</title>
<link rel="stylesheet" href="leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column, phone first. The course map is home; every topic is a ladder; a running-track lane marks the finish line. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5C6B63; --line:#D9DFD8;
  --accent:#D9482B; --accent-ink:#FFFFFF; --deep:#1F5A45; --on-deep:#FFFFFF;
  --good:#1E7A4F; --good-bg:#DDF0E5; --warn:#9A5B00; --warn-bg:#FBEBCF; --idle-bg:#E9EDE8;
  --info:#2B4C8C; --info-bg:#E1E8F7;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111815; --surface:#1A2420; --ink:#ECF1EC; --muted:#9BAAA1; --line:#2C3A34;
    --accent:#F0633F; --accent-ink:#1A0D08; --deep:#7FCBA9; --on-deep:#0E1512;
    --good:#7FD3A6; --good-bg:#173A2A; --warn:#F2C374; --warn-bg:#3D2E10; --idle-bg:#232E29;
    --info:#A9C0F5; --info-bg:#1C2A4A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#1A2420; --ink:#ECF1EC; --muted:#9BAAA1; --line:#2C3A34;
  --accent:#F0633F; --accent-ink:#1A0D08; --deep:#7FCBA9; --on-deep:#0E1512;
  --good:#7FD3A6; --good-bg:#173A2A; --warn:#F2C374; --warn-bg:#3D2E10; --idle-bg:#232E29;
  --info:#A9C0F5; --info-bg:#1C2A4A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.flag{width:18px;height:18px;border-radius:3px;background:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/9px 9px;border:1px solid var(--ink)}
.proto{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{font-size:13px;text-decoration:none;color:var(--muted);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a[aria-current="page"]{color:var(--on-deep);background:var(--deep);border-color:var(--deep)}
h1{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25;margin:0}
p{margin:0}
a{color:var(--deep)}
.lead{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{font-size:13px;color:var(--muted)}
.back{font-size:14px;text-decoration:none}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}
label.f{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;width:auto;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.solid{background:var(--good-bg);color:var(--good)}
.pill.prog{background:var(--info-bg);color:var(--info)}
.pill.gap{background:var(--warn-bg);color:var(--warn)}
.pill.todo{background:var(--idle-bg);color:var(--muted)}
/* finish card */
.finish{background:var(--deep);color:var(--on-deep);border:0}
.finish .big{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.finish .eyebrow,.finish .note{color:inherit;opacity:.82}
.finish input[type=date]{background:transparent;color:inherit;border-color:currentColor;width:auto;padding:5px 8px;font-size:14px}
.lane{display:flex;align-items:center;gap:5px}
.lane i{flex:1;height:12px;border-radius:3px;background:currentColor;opacity:.25;position:relative;overflow:hidden}
.lane i b{position:absolute;inset:0 auto 0 0;background:currentColor;opacity:1}
.lane i.full{opacity:1}
.lane .end{width:14px;height:22px;border-radius:2px;flex:none;background:conic-gradient(currentColor 25%,transparent 0 50%,currentColor 0 75%,transparent 0) 0 0/7px 7px;border:1px solid currentColor}
/* topic rows */
.topic{display:grid;grid-template-columns:40px 1fr;gap:12px;text-decoration:none;color:inherit;align-items:start}
.topic .num{width:40px;height:40px;border-radius:10px;background:var(--idle-bg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px}
.topic .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--idle-bg)}
.dots i.solid{background:var(--good)} .dots i.prog{background:var(--info)} .dots i.gap{background:var(--warn)}
/* ladder */
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ladder li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ladder li:first-child{border-top:0;padding-top:0}
.ladder .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--deep);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.ladder .n.here{background:var(--deep);color:var(--on-deep)}
.ladder .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.ladder select{font-size:14px;padding:6px 8px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.check{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px}
.check input{width:18px;height:18px;margin:2px 0 0}
.readrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.readrow:first-of-type{border-top:0}
.readrow .tools{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.readrow .tools input{width:84px;padding:5px 8px;font-size:14px}
.mat{display:flex;flex-wrap:wrap;gap:6px}
/* universe */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;background:#16211C}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:relative;padding:60px 16px 16px;width:100%;color:#fff;background:linear-gradient(to top,rgba(10,18,14,.88),rgba(10,18,14,0));display:flex;flex-direction:column;gap:6px}
.hero .ov p{color:#E6ECE7}
.hero .eyebrow{color:#CFE3D8}
.co{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.co .ph{position:relative;aspect-ratio:16/9;background:#16211C}
.co .ph img{width:100%;height:100%;object-fit:cover;display:block}
.co .ph .tag{position:absolute;left:12px;bottom:10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(10,18,14,.72);padding:3px 9px;border-radius:999px}
.co .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.co .tx p{font-size:14px;color:var(--muted)}
/* exercise */
.sheet{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px;font-variant-numeric:tabular-nums}
.sheet .ti{background:var(--idle-bg);padding:6px 10px;font-weight:600}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr}
.sheet .col{padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sheet .col + .col{border-left:1px solid var(--line)}
.sheet .col .h{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sheet .ln{display:flex;justify-content:space-between;gap:8px}
.sheet .ln.tot{border-top:1px solid var(--line);padding-top:4px;font-weight:600}
.fields{display:flex;flex-direction:column;gap:10px}
.fld{display:grid;grid-template-columns:1fr 116px;gap:10px;align-items:center;font-size:14px}
.fld input{text-align:right;font-variant-numeric:tabular-nums}
.fld input.right{border-color:var(--good);background:var(--good-bg)}
.fld input.wrong{border-color:var(--warn);background:var(--warn-bg)}
.fld .ans{grid-column:1/-1;font-size:13px;color:var(--warn)}
.fb{border-left:4px solid var(--good);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:8px}
.fb.miss{border-color:var(--warn)}
.fb b.v{font-family:var(--display)}
.exam{font-size:14px;background:var(--idle-bg);border-radius:10px;padding:10px 12px}
ol.steps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--deep);background:var(--good-bg)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--warn-bg);border-color:var(--warn)}
.opt[disabled]{cursor:default}
.timer{font-family:var(--display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.dn{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dn:first-of-type{border-top:0}
.dn .q{font-weight:600}
.dn .a{color:var(--muted)}
footer{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
/* 3D city: one visual world, same in both themes */
.city{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#24493B 0%,#0E1814 70%);color:#E6ECE7}
.city canvas{display:block;width:100%;height:300px;touch-action:pan-y;cursor:grab}
.city .cap{position:absolute;left:14px;right:14px;bottom:10px;font-size:12px;color:#CFE3D8;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.city .hd{position:absolute;left:14px;top:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#CFE3D8}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.medal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.25;color:var(--muted);perspective:300px}
.medal .disc{width:52px;height:52px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.medal.on{color:var(--ink)}
.medal.on .disc{border:0;color:#3A2A00;background:conic-gradient(from 210deg,#F6D77A,#E9A93B,#FBE9A8,#D9952A,#F6D77A);box-shadow:0 2px 0 #B67A1C,0 6px 12px rgba(0,0,0,.18)}
.attach{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.attach .fname{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
label.btn.small{display:inline-block;cursor:pointer}
label.btn.small input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn.small:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.readbar{position:sticky;top:0;z-index:5;background:var(--deep);color:var(--on-deep);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.readbar .timer{font-size:28px}
.readbar .pg{font-size:14px;font-weight:600}
.pdfwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:none}
.pdfwrap canvas{display:block}
.samplepg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;font-size:17px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: no-preference){
  .card,.co{animation:in .22s ease-out}
  .fb{animation:flip .4s ease-out;transform-origin:top}
  .medal.on .disc{animation:spin 5s ease-in-out infinite}
}
@keyframes flip{from{transform:perspective(600px) rotateX(-65deg)}to{transform:none}}
@keyframes spin{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(360deg)}}
@keyframes in{from{transform:translateY(5px)}to{transform:none}}

/* exam week planner */
.three{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.pl-steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pl-steps a{display:block;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.pl-steps li[aria-current] a{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.pl-count{display:flex;gap:14px;align-items:center;background:var(--deep);color:var(--on-deep);border-radius:14px;padding:14px 16px}
.pl-count .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.pl-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pl-day{flex:0 0 auto;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:64px;cursor:pointer}
.pl-day span{font-size:12px;color:var(--muted)} .pl-day b{font-size:14px}
.pl-day.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pl-day.exam{background:var(--warn-bg)}
.pl-map{height:240px;border-radius:12px;border:1px solid var(--line);overflow:hidden;z-index:0}
.pl-map.tall{height:320px}
.pl-tl{display:flex;flex-direction:column;gap:6px}
.pl-row{border-radius:10px;padding:8px 10px;font-size:14px;border-left:4px solid var(--line);background:var(--bg)}
.pl-row.ev{border-left-color:var(--muted);background:var(--idle-bg)}
.pl-row.tr{border-left-color:var(--accent)}
.pl-row.st{border-left-color:var(--good);background:var(--good-bg)}
.pl-row.st.done{opacity:.6}
.pl-row.wake{font-size:12px;color:var(--muted);border-left-color:transparent;background:transparent;padding:2px 10px}
.pl-ev{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pl-place .row input{flex:1}
.pl-rec{background:var(--info-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.pl-rec span{color:var(--muted)}
.pl-progress{height:10px;border-radius:99px;background:var(--idle-bg);overflow:hidden}
.pl-progress i{display:block;height:100%;background:var(--good);border-radius:99px}
.pl-line{list-style:none;margin:0;padding:0 0 0 6px;border-left:4px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.pl-line li{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-left:-14px}
.pl-line .dot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--accent);margin-top:2px}
.pl-line .fx .dot{border-color:var(--muted);width:14px;height:14px;margin:4px 3px 0}
.pl-line .go .dot{border-color:var(--accent);width:14px;height:14px;margin:4px 3px 0}
.pl-line .sl.on .dot{background:var(--good);border-color:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
.pl-line .ex .dot{background:var(--accent);width:24px;height:24px}
.pl-metro{display:flex;flex-direction:column;gap:10px}
.pl-mrow{display:flex;align-items:center;gap:10px}
.pl-mrow .d{width:64px;font-size:13px;color:var(--muted)}
.pl-mrow .ln{flex:1;display:flex;align-items:center;gap:8px;border-top:3px solid var(--accent);padding-top:0;min-height:3px;position:relative;top:0;flex-wrap:wrap}
.pl-mrow .st{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-8px}
.pl-mrow .st.learn{width:18px;height:18px;margin-top:-11px}
.pl-mrow .st.on{background:var(--good);border-color:var(--good)}
.pl-mrow .st.exam{background:var(--accent);width:22px;height:22px;margin-top:-13px}
.pl-pin span{display:inline-block;white-space:nowrap;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:999px;padding:2px 8px;font:600 12px var(--body);transform:translate(-50%,-50%)}
.pl-prog{display:flex;align-items:center;gap:8px;margin-top:4px}.pl-prog i{flex:1;max-width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}.pl-prog i b{display:block;height:100%;background:var(--accent)}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
.tg-img{margin:0 0 6px}.tg-img img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;display:block}.tg-img figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.tg-lad{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.tg-lad li>*{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none;font:inherit;color:inherit;text-align:left}
.tg-lad li.on>*{border-color:var(--accent);background:var(--idle-bg)}
.tg-lad .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--deep);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.tg-lad .nm{flex:1;font-size:15px}
.tg-list{display:flex;flex-direction:column;gap:10px}
.tg-item{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.tg-item.on span{color:var(--muted)}
.tg-more summary{cursor:pointer;color:var(--deep);font-weight:600;padding:6px 0}
.tg-more .attach{flex-wrap:wrap}
.opt.right{border-color:var(--deep);background:var(--idle-bg);font-weight:600}.opt.wrong{border-color:var(--warn);opacity:.8}
table.sol{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0}table.sol td{padding:5px 4px;border-top:1px solid var(--line)}table.sol td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-one{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25}
.pl-more summary{cursor:pointer;color:var(--deep);font-weight:600;padding:6px 0}
.pl-more[open]{display:flex;flex-direction:column;gap:12px}
.pl-big{gap:14px}
.pl-big h1{font-size:24px}
.pl-calm{font-family:var(--display);font-size:18px;color:var(--good)}
.pl-cost{margin-top:-6px}
.btn.picked{outline:3px solid var(--good);outline-offset:2px}
.pl-sleep{flex-direction:row;align-items:flex-start;gap:10px;background:var(--info-bg)}

function bookGet(k){ return bookDb().then(function(db){ return new Promise(function(res){ var q = db.transaction("b").objectStore("b").get(k); q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); }; }); }).catch(function(){ return null; }); }
function bookPut(k, v){ return bookDb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction("b", "readwrite"); tx.objectStore("b").put(v, k); tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; }); }); }
function bookCheck(){ return bookDb().then(function(db){ return new Promise(function(res){ var q = db.transaction("b").objectStore("b").getAllKeys(); q.onsuccess = function(){ haveBooks = {}; (q.result||[]).forEach(function(k){ haveBooks[k] = true; }); res(); }; q.onerror = function(){ res(); }; }); }).catch(function(){}); }

var bookKey = null;
function bookFromServer(k){
  if(!sb) return Promise.reject("nolocal");
  if(!sbUser) return Promise.reject("booksignin");
  var key = bookKey ? Promise.resolve(bookKey) : sb.from("book_keys").select("k").eq("book","textbooks").maybeSingle().then(function(r){
    if(r.error || !r.data) throw "booknoaccess";
    var raw = Uint8Array.from(atob(r.data.k), function(c){ return c.charCodeAt(0); });
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]).then(function(x){ bookKey = x; return x; });
  });
  return key.then(function(x){ return fetch("books/"+k+".bin").then(function(r){ if(!r.ok) throw "missing"; return r.arrayBuffer(); }).then(function(buf){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:new Uint8Array(buf, 0, 12)}, x, new Uint8Array(buf, 12)); }); })
    .then(function(pdf){ bookPut(k, pdf.slice(0)).then(function(){ haveBooks[k] = true; }).catch(function(){}); return pdf; });
}
function bookPage(k, pg){ return pg + BOOKS[k].off; }

/* ---------- saving to the viewer's account (Claude artifact host), with the browser as fallback ---------- */
var cloud = {ref:null, assets:null, state:"local", saving:false, dirty:false, timer:null, tried:0};
var uploading = {}, pendingRemove = "", attachMsg = {};
function setSync(){
  var el = document.getElementById("sync"); if(!el) return;
  el.textContent = ({local:"Saved on this device only", loading:"Connecting…", on:"Saved to your account", saving:"Saving…", error:"Not saved to account", signedout:"Sign in to save"})[cloud.state];
}
function scheduleCloud(){ if(!cloud.ref) return; cloud.dirty = true; clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 900); }
function pushCloud(){
  if(!cloud.ref || cloud.saving) return;
  cloud.saving = true; cloud.dirty = false; cloud.state = "saving"; setSync();
  var body = JSON.parse(JSON.stringify(S)); body.timer = null;
  cloud.ref.set({v:2, state:body}).then(function(){ cloud.state = "on"; }, function(e){
    cloud.state = "error"; if(e && e.code === "invalid_argument"){ cloud.ref = null; }
  }).then(function(){ cloud.saving = false; setSync(); if(cloud.dirty && cloud.ref) pushCloud(); });
}
function hasProgress(){ return !!(S.examDate || Object.keys(S.rating).length || Object.keys(S.tries).length || S.check || S.ctxDone || S.speed || Object.keys(S.read).length); }
function loadRemote(ref){
  var to = new Promise(function(_, rej){ setTimeout(function(){ rej({code:"timeout"}); }, 10000); });
  return Promise.race([ref.get(), to]).then(function(snap){
    cloud.ref = ref;
    var d = snap && snap.exists ? snap.data() : null;
    if(d && d.state && Object.keys(d.state).length){
      var t = S.timer, f = fresh(), remote = JSON.parse(JSON.stringify(d.state)), k;
      for(k in remote){ f[k] = remote[k]; }
      S = f; S.timer = t; saveLocal(); cloud.state = "on";
    } else { cloud.state = "on"; if(hasProgress()) pushCloud(); }
    setSync(); render();
  });
}
/* Supabase: used when config.js holds a project URL and publishable key */
var sb = null, sbUser = null, acctMsg = "";
function attachSupabase(user){
  sbUser = user; var uid = user.id;
  cloud.maxBytes = 50*1024*1024;
  cloud.assets = {
    upload: function(file){ var path = uid+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".pdf";
      return sb.storage.from("readings").upload(path, file, {contentType:"application/pdf"}).then(function(r){ if(r.error) throw {code: /exceed|too large|413/i.test(r.error.message||"") ? "too_large" : "upstream_error"}; return {id:path, sizeBytes:file.size}; }); },
    delete: function(id){ return sb.storage.from("readings").remove([id]).then(function(r){ if(r.error) throw r.error; }); }
  };
  cloud.fetchFile = function(id){ return sb.storage.from("readings").download(id).then(function(r){ if(r.error) throw r.error; return r.data.arrayBuffer(); }); };
  var ref = {
    get: function(){ return sb.from("user_state").select("state").eq("user_id", uid).maybeSingle().then(function(r){ if(r.error) throw r.error; return {exists:!!r.data, data:function(){ return r.data; }}; }); },
    set: function(body){ return sb.from("user_state").upsert({user_id:uid, state:body.state, updated_at:new Date().toISOString()}).then(function(r){ if(r.error) throw r.error; }); }
  };
  cloud.state = "loading"; setSync();
  return loadRemote(ref).catch(function(){ cloud.state = "error"; acctMsg = "Signed in, but the saved progress could not be loaded. Check that supabase_setup.sql was run in your project."; setSync(); render(); });
}
function initCloud(){
  var cfg = window.FL_CONFIG || {};
  if(cfg.supabaseUrl && cfg.supabaseKey && window.supabase && window.supabase.createClient){
    try{
      sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
      sb.auth.onAuthStateChange(function(ev, sess){
        if(ev === "PASSWORD_RECOVERY"){ recovery = true; if(sess && sess.user && !sbUser){ attachSupabase(sess.user).then(function(){ go("account"); }); } else { go("account"); } }
      });
      cloud.state = "loading"; setSync();
      sb.auth.getSession().then(function(r){
        var sess = r && r.data && r.data.session;
        if(sess && sess.user){ return attachSupabase(sess.user).then(function(){ if(recovery) go("account"); }); }
        cloud.state = "signedout"; setSync(); render();
      }).catch(function(){ cloud.state = "local"; setSync(); render(); });
      return;
    }catch(e){ sb = null; }
  }
  var c = window.claude;
  if(!c || typeof c.use !== "function"){ if(cloud.tried++ < 3) setTimeout(initCloud, 900); return; }
  cloud.state = "loading"; setSync();
  Promise.all([c.use("db"), c.use("user"), c.use("assets")]).then(function(r){
    var db = r[0], user = r[1]; cloud.assets = r[2] || null; cloud.maxBytes = 20*1024*1024;
    cloud.fetchFile = function(id){ return fetch("/_blob/"+id).then(function(res){ if(!res.ok) throw 0; return res.arrayBuffer(); }); };
    if(!db || !user){ cloud.state = "local"; setSync(); render(); return; }
    return user.id().then(function(id){
      if(!id){ cloud.state = "local"; setSync(); render(); return; }
      return loadRemote(db.doc("data/users/"+id+"/state"));
    });
  }).catch(function(){ cloud.state = "local"; setSync(); render(); });
}

var acctEmail = "", acctPw = "", acctMode = "in";
function acct(kind){
  var em = (document.getElementById("ac-email").value||"").trim(), pw = document.getElementById("ac-pass").value||"";
  acctEmail = em; acctPw = pw;
  if(!/^\S+@\S+\.\S+$/.test(em)){ acctMsg = "Enter a valid email address."; render(); return; }
  if(pw.length < 8){ acctMsg = "The password needs 8 characters or more."; render(); return; }
  if(kind==="up"){ var p2 = (document.getElementById("ac-pass2")||{}).value||""; if(p2 !== pw){ acctMsg = "The two passwords are different. Type them again."; render(); return; } }
  acctBusy = true; acctMsg = kind==="in" ? "Signing in…" : "Creating your account…"; render();
  var call = kind==="in" ? sb.auth.signInWithPassword({email:em, password:pw}) : sb.auth.signUp({email:em, password:pw, options:{emailRedirectTo: location.origin}});
  call.then(function(r){
    acctBusy = false;
    if(r.error){
      var c = r.error.code || "", m = r.error.message || "";
      if(kind==="in" && (c==="invalid_credentials" || /invalid login/i.test(m))) acctMsg = "This email and password don't match. Check the password, or tap \"Forgot password?\" to set a new one.";
      else if(c==="email_not_confirmed") acctMsg = "This account still needs its email confirmed. Tap \"Forgot password?\" to get a link that signs you in.";
      else if(c==="user_already_exists" || /already registered/i.test(m)) acctMsg = "There is already an account with this email. Tap \"Sign in\" instead, or \"Forgot password?\" if you don't remember the password.";
      else if(c==="over_email_send_rate_limit" || r.error.status===429) acctMsg = "Too many attempts in a short time. Wait a minute and try again.";
      else if(c==="weak_password") acctMsg = "That password is too easy to guess. Try a longer one.";
      else acctMsg = m || "That did not work. Try again.";
      render(); return;
    }
    var sess = r.data && r.data.session;
    if(!sess){ acctMsg = "Account created. Open the confirmation email, then sign in here."; render(); return; }
    acctMsg = ""; acctPw = ""; attachSupabase(sess.user).then(function(){ go("map"); });
  }).catch(function(){ acctBusy = false; acctMsg = "The server could not be reached. Check your connection and try again."; render(); });
}
function forgot(){
  var el = document.getElementById("ac-email"), em = ((el && el.value) || acctEmail || "").trim(); acctEmail = em;
  if(!/^\S+@\S+\.\S+$/.test(em)){ acctMsg = "Enter your email address above first, then tap \"Forgot password?\" again."; render(); return; }
  acctBusy = true; acctMsg = "Sending the email…"; render();
  sb.auth.resetPasswordForEmail(em, {redirectTo: location.origin}).then(function(r){
    acctBusy = false;
    acctMsg = (r && r.error) ? ((r.error.status===429) ? "An email was sent very recently. Wait a minute and try again." : (r.error.message || "The email could not be sent.")) : "If an account exists for "+em+", an email with a link is on its way. Open it on this device to choose a new password.";
    render();
  }).catch(function(){ acctBusy = false; acctMsg = "The server could not be reached. Try again."; render(); });
}
function savePw(){
  var pw = document.getElementById("pw-new").value||"";
  if(pw.length < 8){ acctMsg = "The password needs 8 characters or more."; render(); return; }
  acctBusy = true; acctMsg = "Saving…"; render();
  sb.auth.updateUser({password:pw}).then(function(r){
    acctBusy = false;
    if(r.error){ acctMsg = r.error.message || "The password could not be saved."; render(); return; }
    recovery = false; acctMsg = "New password saved. You are signed in."; render();

 1:{"IFRS":"International Financial Reporting Standards: the accounting rules listed EU groups must use for their consolidated statements.","Conceptual Framework":"The IASB's basic principles behind every standard: who the statements are for, and what an asset, a liability, income and an expense are.","non-current":"Current means used up, sold or due within 12 months (or one operating cycle). Everything else is non-current.","by nature":"Expenses grouped by what they are: staff costs, materials, depreciation.","by function":"Expenses grouped by what they are for: cost of sales, selling, administration.","other comprehensive income":"Gains and losses that skip profit and go straight to equity, for example some revaluations and currency differences."},
 2:{"consolidated":"One set of statements for the parent and its subsidiaries, shown as if they were one company.","full consolidation":"Adding 100% of a subsidiary's assets and liabilities, even if you own less, then showing the outside owners' share separately.","goodwill":"The price paid minus the fair value of the net assets bought: what you pay extra for customers, team and synergies.","non-controlling interest":"The part of a subsidiary's equity that belongs to the other owners."},
 3:{"intangible asset":"A non-physical asset you control that will bring future benefits, such as a patent or software. Research is always an expense; development can be an asset.","cost model":"Keeping an asset at cost minus depreciation and impairment, instead of revaluing it.","impairment test":"Comparing the carrying amount with the recoverable amount (the higher of fair value less costs to sell and value in use). If it is lower, you write the asset down.","lease":"A contract that gives you control of an identified asset for a period in exchange for payments. Under IFRS 16 the lessee shows a right-of-use asset and a lease liability."},
 4:{"equity instruments":"Instruments with no obligation to pay cash: the holders get what is left after all debts.","debt":"An obligation to pay cash, such as interest and repayment. Shown as a liability.","financial instruments":"Any contract that is a financial asset for one side and a liability or equity for the other: shares, bonds, loans.","hybrid instruments":"Instruments with features of both debt and equity, for example perpetual subordinated bonds.","buy-backs":"The company buys its own shares. They are held as treasury shares and deducted from equity; any gain or loss on resale stays in equity, never in profit."},
 5:{"KPIs":"Key performance indicators: the few numbers used to show how a company is doing, such as EBITDA, ROCE and free cash flow.","accounting-choice":"Choices IFRS allows, such as a depreciation method, that change the numbers without changing the business."}

var SLIDEHELP = {"1": {"16": "Air France-KLM's balance sheet, assets side. Non-current assets come first (goodwill, aircraft as 'flight equipment', right-of-use assets), then current assets (inventories, receivables, cash). The blue totals split the two: that split is what this step is about.", "17": "Same company, equity and liabilities side. Equity owed to the parent's shareholders is negative (−3,051 in 2023): past losses are bigger than the capital put in. 'Deferred revenue on ticket sales' is a current liability: tickets already paid, flights not yet flown.", "18": "easyJet's balance sheet in the UK layout: current liabilities are subtracted from current assets ('net current liabilities'). Same IFRS items, different layout. IAS 1 does not impose one format.", "19": "The second part: non-current liabilities are subtracted too, so the statement ends at net assets, which equal total equity. Here equity is negative (−181): accumulated losses exceed the capital.", "24": "Orange, by nature: each line is a type of cost (purchases, labour, depreciation). Compare with Vodafone on the next slide.", "25": "Vodafone, by function: costs grouped as cost of sales, selling and distribution, administration. That is why it can show a gross profit line.", "26": "Orange uses two statements: the income statement ends at net income (2,892). This second one starts there, adds other comprehensive income (−314) and ends at comprehensive income (2,578). OCI is split into items never recycled to profit (a) and items that may be (b).", "27": "Turkish Airlines uses one statement: profit or loss and OCI on the same page. The circles mark net profit and total comprehensive income.", "29": "Schneider's cash flow statement, indirect method: it starts from profit (4,169), adds back non-cash items such as depreciation, adjusts for working capital, and ends at operating cash flow (5,907).", "30": "Continued: investing (−1,048) and financing (−3,823) cash flows, then the change in cash (+792). Financing includes bonds issued and repaid, treasury shares bought and dividends paid.", "32": "Schneider's statement of changes in equity: each column is a part of equity, each row a movement (profit, OCI, new shares, dividends, treasury shares). You need it for the questions on the next slide.", "33": "Try the three questions yourself first. The teacher's notes below have the answers."}, "3": {"13": "Volkswagen's policy for intangibles: bought ones at cost, amortised over their life; development costs capitalised once IAS 38's conditions are met; brands from acquisitions usually have an indefinite life, so they are tested for impairment instead of amortised.", "14": "Volkswagen's intangible asset movements in 2023: new capitalised development costs (9,275 + 1,868, circled in red) and their amortisation (5,120, circled in green). The policy from the previous slide, in numbers.", "15": "Volkswagen's R&D summary: of 21,779 spent, 11,142 was capitalised (51.2%). Amortisation of earlier capitalised costs was 5,187. Expense in profit or loss = 21,779 − 11,142 + 5,187 = 15,824.", "20": "Bayer's useful lives for intangibles with a finite life (patents 8–30 years, trademarks 10–35 and so on). They are amortised straight-line and checked for impairment indicators every year.", "32": "Ubisoft's goodwill impairment by cash-generating unit (its studios): 90.1m in 2022, after closing a label and weaker cash-flow forecasts for mobile games.", "57": "Orange's balance sheet shows right-of-use assets of 8,175 under IFRS 16. The table below: future lease payments of 9,658, with 3,257 due in 2029 or later, so many leases are long.", "58": "How right-of-use assets move: new leases add (+1,317), depreciation takes away (−1,522). The teacher's note explains why the leases are so long.", "59": "How the lease liability moves: new leases increase it, rent paid reduces it (−1,645). It ends at 8,568, split into non-current and current. The policy text: the liability is the present value of the lease payments not yet paid."}, "4": {"8": "Airbus's 2023 balance sheet, equity and liabilities side. The red boxes are financial instruments: the equity lines (shares are equity instruments) and the financial liabilities (financing, trade and other financial liabilities). Together they are 54.8% of total equity and liabilities (teacher's notes). The point: more than half of the right-hand side falls under IAS 32 and IFRS 9, so classifying debt versus equity correctly changes a big part of the balance sheet. No calculation here.", "9": "The same picture for Airbus two years later (2025 report). The teacher's notes list the share of financial instruments year by year.", "19": "Orange's hybrid 'subordinated notes' (4,950) sit inside equity. Why: no maturity, and Orange may defer the coupons, so it has no obligation to pay. Their coupons go straight to equity, not to interest expense.", "20": "The details behind it: deeply subordinated, coupons can be deferred, Orange can call (repay) them, and step-up clauses raise the coupon later. The step-ups push Orange to repay, but legally there is no obligation, so they stay equity.", "21": "Statement of changes in equity: the subordinated notes column stays at 4,950, although 1bn was repaid and 1bn newly issued in 2023. Their 'remuneration' (−185) is a movement in equity, like a dividend.", "22": "Cash flow statement: issuing or buying back the subordinated notes and paying their coupons are financing cash flows, like equity transactions.", "25": "Orange's TDIRA: perpetual bonds redeemable in shares. Split accounting: the debt part is the present value of the cash flows (643), the equity part is what is left (152). This is exactly the compound-instruments step.", "30": "Lufthansa's authorised capital: shareholders allow the board to issue new shares up to a limit (A: €1bn; B: €100m for employees). Authorised is not issued: only €2.47m of B was used in 2025.", "32": "Air France-KLM cut the par value of each share from €10 to €1: share capital falls from 2,571 to 263 and the difference moves to share premium (additional paid-in capital). Total equity does not change.", "34": "Lufthansa's treasury shares: shareholders allowed buy-backs up to 10% of capital. At the end of 2025 it held 17,987 own shares, kept for employees."}, "5": {"8": "Orange's key figures: revenue, EBITDAaL (EBITDA after leases, Orange's own measure), eCapex, organic cash flow, ROCE. Several are not defined by IFRS, which is the point of this part.", "9": "Orange's results presentation: the measures management chooses to show investors, each ticked against its guidance.", "10": "'Waterfall' bridges: how revenue and EBITDAaL moved from 2022 to 2023, segment by segment.", "11": "The same for net income, eCapex and organic cash flow: from the profit figure to the cash figure.", "19": "Air France-KLM's income statement, labelled: which subtotals are defined by IFRS ('GAAP') and which are management's own ('non-GAAP'), such as EBITDA and income from current operations.", "20": "Deutsche Telekom's segment report: it judges its segments on revenue and EBITDA (AL), circled. A company choosing its own performance measures.", "26": "Veolia's ROCE with the asset approach: current EBIT after tax (2,747) divided by average capital employed (33,085) = 8.3% for 2023.", "34": "Bayer's EVA for 2022 = (ROCE 7.7% − WACC 6.1%) × capital employed 69,270 = +1,108m: value created.", "35": "One year later: ROCE 0.7% against WACC 5.7%, so EVA = −3,435m: value destroyed. Same formula as 2023 exam question 5c."}};
var SLIDENOTES = {"1": {"9": "US, Sudan, North Korea", "16": "2022 has been restated due to a change in the accounting for Emission Trading Scheme", "25": "In 2023 other income includes the gain made on the diposal of assets (Vantage towers)", "33": "Increase in capital: YES new shares were issued against cash as shown in the CFS (+284) Treasury shares: Schneider bought new treasury shares in 2023"}, "2": {"7": "Conso (and parent) financial assets include a 9.36 % stake in Sanofi", "10": "Company P is founded on 1 January: shareholder’s equity = 1,000 and financial debt = 1,000 Instead of investing in tangible assets, P finances a new subsidiary S1: equity contribution = 2,000. S1 takes on financial debt of 2,000 S1 creates a subsidiary S2: equity contribution 4,000. S2 takes a new loan of 4,000 and invests in tangible assets for 8,000. Adapted from B. Bachy & M. Sion: Analyse financière des comptes consolidés Normes IFRS, p 157", "12": "The percentage of control (among others) determines the type of relationship between two companies and, as a consequence, the consolidation method. ! A majority of voting shares (over 50%) is always a controlling interest. When a party holds less than the majority of the voting shares, other present circumstances can be considered to determine whether that party is still considered to hold a controlling ownership interest The percentage of interest indicates the percentage with which a group entity has to be consolidated (when applying the method determined with the percentage of control)", "13": "See companies in Africa that are controlled (fully consolidated) with less than 50%", "18": "Management problem of slide 5: debt-equity parent: 1.3 debt-equity conso: 1.5 In a first conso the debt-equity ratio always increases (unless sub has 0 debt) because you add the sub debt (but not its equity) to the parent debt. In a subsequent conso the evolution of the debt-equity ratio depends on the sub/group profitability (slide 26: group d/e is lower than parent d/e because of sub profits)", "19": "Management problem of slide 5: debt-equity parent: 1.3 debt-equity conso: 1.5 In a first conso the debt-equity ratio always increases (unless sub has 0 debt) because you add the sub debt (but not its equity) to the parent debt. In a subsequent conso the evolution of the debt-equity ratio depends on the sub/group profitability (slide 26: group d/e is lower than parent d/e because of sub profits)", "24": "Identifiable (IFRS 3.App A) means separable (from the company; eg. can be sold individually) or arising from legal rights", "33": "PPA: PP of 60 = book value of 60 (=150x40%): NO valuation difference or goodwill"}, "3": {"25": "Future cash flows: the 5 year period is not always respected by companies; in practice they use shorter (3 years) or longer periods Discount rate: companies do not always use a pre-tax rate; the WACC, for ex, is post-tax (if not adjusted).", "33": "Note: On this slide, the impairment test is done “net”, meaning that the net assets of the CGU are considered. Conversely, in our SEAT case, the impairment test is done “gross”. Both “gross” or “net” are allowed under IAS 36 (see IAS 36.78 and, e.g., Deloitte, iGAAP 2018, p. 626 ff.). Independent from the choice, any liability that is directly related to the CGU’s assets needs to be considered (i.e., “gross”). Examples would include asset-back-liabilities, a site restoration provision associated with a CGU or the pension obligation associated with the CGU's workforce.", "58": "Amount of long-term lease arrangements is relatively high (previous slide – “2029 and beyond”). This might be explained by large property leases (“Land and buildings”) or lease arrangements that include “Networks and devices” (often long-term leases)."}, "4": {"8": "In 2023: 54.8% In 2022: 49.8% In 2021: 41% In 2020: 36.5% In 2019: 36% In 2018: 39.8% of equity & liabilities are financial In 2017: 56.4 % In 2016: 55.8 %", "9": "In 2023: 54.8% In 2022: 49.8% In 2021: 41% In 2020: 36.5% In 2019: 36% In 2018: 39.8% of equity & liabilities are financial In 2017: 56.4 % In 2016: 55.8 %", "12": "The preferred shares include an obligation to pay ongoing compensation (cumulative dividends) and an obligation to reimburse (buy-back) if the shareholders asked for it. Therefore, they will be classified as debt, and not equity, in the IFRS balance sheet, and will deteriorate the debt/equity ratio.", "15": "Liability: obligation to redeem and obligation for ongoing compensation that is variable. Liability: interest rate condition not relevant because outside of the control of issuing entity. Equity: dividend payment condition is relevant because these payments are under control of the entity. Dividends are discretionary; the entity can therefore avoid a payment", "16": "4. Liability: obligation to reimburse if holder demands 5. Equity: no obligation to reimburse; entity/issuer decides to reimburse or not (same situation as treasury shares) 6. Liability: obligation to redeem and to pay interest, only timing and amount are variable.", "18": "The term « hybrid » in IFRS means a financial instrument with an embedded derivative. In this slide « hybrid » is used as a general term meaning a financial instrument that has debt AND equity features", "22": "CFS presentation: part of financing cash flows are not shown (lack of space) that’s why the addition of the numbers do NOT equal the total financing CF The point of this slide is to show that the « interest » payments on the sub. notes are treated like dividends, since the notes are equity.", "32": "After the share capital reduction AF increased its capital in 2023 by 35 million (+6 in share capital and +29 in APIC)"}, "5": {}};

function termify(text, n){
  var keys = Object.keys(TERMS[n]||{}).sort(function(a,b){ return b.length-a.length; }); if(!keys.length) return esc(text);

  while(rest){ var m = rest.match(re); if(!m){ out += esc(rest); break; }
    var key = keys.filter(function(k){ return k.toLowerCase()===m[1].toLowerCase(); })[0];
    out += esc(rest.slice(0, m.index)) + (used[key] ? esc(m[1]) : '<button type="button" class="term" data-term="'+n+'|'+esc(key)+'">'+esc(m[1])+'</button>');
    used[key] = 1; rest = rest.slice(m.index + m[1].length); }
  return out;
}

      h += tick("sol", (++num)+'. Check yourself with the solution', dn.case ? '<a class="btn small ghost" href="#doc/t'+n+'-solutions/'+(S.docPos["t"+n+"-solutions"]||1)+'">Open the solutions</a>' : '<span class="note">Opens once you tick that you tried it.</span>');
    }
    (STEPEXTRA[cur[0]]||[]).forEach(function(x){ h += tick(x[0], (++num)+'. '+x[1], x[2]); });
    if(t.playable && cur[0]!=="e0") h += tick("prac", (++num)+'. Practise this type with new numbers', '<a class="btn small ghost" href="#practice" data-start="'+cur[0]+'">Practise this type</a>');
    h += '</div>';
    var books = (BOOKSTEP[cur[0]]||[]).map(function(b, bi){ return '<a class="btn small ghost" href="#doc/bk-'+b[0]+'/'+bookPage(b[0], b[1])+'/'+cur[0]+'-'+bi+'">'+esc(b[3])+' · pp. '+b[1]+(b[2]!==b[1]?'–'+b[2]:'')+'</a>'; });
    if(BOOK[cur[0]]) books.push('<a class="btn small ghost" href="#doc/harrison/'+BOOK[cur[0]][0]+'">Harrison '+BOOK[cur[0]][2].replace("Book ","")+'</a>');
    if(books.length) h += '<details class="tg-more"><summary>Stuck? Read this</summary><p class="note">Only the pages for this step. Not required.</p><div class="attach">'+books.join("")+'</div></details>';
    var ex = (FURTHER[n]||[]).filter(function(r){ var fs = FSTEP[n+":"+r[0]] || FSTEP[r[0]]; return fs===cur[0] || (fs instanceof Array && fs.indexOf(cur[0])>=0); });
    if(ex.length) h += '<details class="tg-more"><summary>See it in a real report</summary>'+ex.map(function(r){ return '<p class="note">'+esc(DOCS[r[0]].t)+': '+esc(r[1])+'</p><a class="btn small ghost" href="#doc/'+r[0]+'/'+(S.docPos[r[0]]||1)+'">Open</a>'; }).join("")+'</details>';
    var G2 = GUESS[n];
    if(G2.step===cur[0] && g.guess>=0 && (dn.slides || dn.case)) h += '<p class="pl-calm"><b>Your guess was: '+esc(G2.opts[g.guess])+'.</b> '+(g.guess===G2.ans?'Right. ':'')+esc(G2.why)+'</p>';
    h += '<p class="lead" style="margin-top:8px">How well do you know it now?</p><div class="opts">'+RATINGS.slice(1).map(function(r){ return '<button type="button" class="opt" data-rate1="'+n+'|'+cur[0]+'|'+r[0]+'|step" aria-pressed="'+((S.rating[cur[0]]||"")===r[0])+'">'+r[1]+'</button>'; }).join("")+'</div></section>';
    var nx = t.steps[ci+1];
    h += nx ? '<div class="two">'+(ci>0?'<button class="btn ghost" data-tstep="'+n+'|'+t.steps[ci-1][0]+'">Previous step</button>':'<span></span>')+'<button class="btn" data-tstep="'+n+'|'+nx[0]+'">Next step</button></div>'
      : '<div class="two">'+(ci>0?'<button class="btn ghost" data-tstep="'+n+'|'+t.steps[ci-1][0]+'">Previous step</button>':'<span></span>')+'<button class="btn" data-tf="'+n+'|exam">Next: check yourself</button></div>';
  }
  if(g.stage==="exam"){
    S.selfMark = S.selfMark || {};
    h += '<section class="card"><h2>1. Quick check</h2><p class="note">'+(DECKQ[n]||[]).length+' true-or-false statements from the end of the slides. About 4 minutes, answers right away.</p><a class="btn" href="#cards/deck-'+n+'">Start the quick check</a></section>';
    h += '<section class="card"><h2>2. The 2023 exam questions</h2><p class="note">Try each one timed: points = minutes. Then compare with the worked solution, and ask Claude if something is unclear.</p>'+
      (EXAMQ[n]||[]).map(function(q){ var sq = SOL[q], mk = S.selfMark[q]; return '<div class="readrow"><span><b>Question '+q+'</b> · '+sq.pts+' min'+(mk?' · <span class="pill '+({got:"solid",part:"prog",miss:"gap"})[mk]+'">'+({got:"got it",part:"partly",miss:"missed"})[mk]+'</span>':'')+'<br>'+esc(sq.title)+'</span><div class="attach"><a class="btn small ghost" href="#solution/'+q+'">Try it</a></div></div>'; }).join("")+'</section>';
    if(TQUIZ[n]) h += '<section class="card"><h2>3. Your Topic '+n+' quiz</h2><p class="note">'+TQUIZ[n].length+' questions, 24 minutes, like the real one. Your plan also brings these back in short slots over the next days.</p><a class="btn ghost" href="#cards/quiz-'+n+'">Start the timed quiz</a></section>';
    if(READONLY[n]) h += '<details class="tg-more card"><summary>Only in the required reading, not on the slides</summary><p class="note">Lower priority. Read these after the slides and checks, if you have time.</p><div class="attach">'+READONLY[n].map(function(b, bi){ return '<a class="btn small ghost" href="#doc/bk-'+b[0]+'/'+bookPage(b[0], b[1])+'">'+esc(b[3])+' · pp. '+b[1]+'–'+b[2]+'</a>'; }).join("")+'</div></details>';
    h += '<button class="btn ghost" data-tstep="'+n+'|'+t.steps[t.steps.length-1][0]+'">Back to the last step</button>';
  }

var SOL = {
 "1a":{t:1, pts:2, page:1, title:"Is this income statement IFRS?", ask:"The exam shows a 2022 income statement (in € millions) with lines such as net operating expense (68), investment income 558, foreign exchange result 3, other financial income and expenses (277), pre-tax income on ordinary activities 216, a line 'Extraordinary items', income tax +148 and net income 364. Question: is this income statement based on IFRS? Give one element as proof.",
  a:"<p><b>No, it is not IFRS.</b> One element is enough:</p><ul class='plain'><li>It has a line <b>“Extraordinary items”</b>. IAS 1.87 forbids presenting any item as extraordinary, in the statement or in the notes.</li></ul><p class='note'>Other clues: the layout (operating, financial, exceptional, then tax) is the French individual-accounts format, and there is no other comprehensive income.</p>"},
 "1b":{t:1, pts:2, page:2, title:"Is it a consolidated income statement?", ask:"Same 2022 income statement: net operating expense (68), investment income 558 (dividends), financial result, net income 364, no split of profit between owners and non-controlling interests. Question: is it consolidated? Give one element as proof.",
  a:"<p><b>No, it is an individual (parent company) statement.</b> One element is enough:</p><ul class='plain'><li>The biggest income is <b>“Investment income” of 558</b>, which which is most likely dividends received from subsidiaries. In consolidated statements dividends inside the group are eliminated.</li><li>Or: there is <b>no split of net income between owners of the parent and non-controlling interests</b>, which a consolidated statement must show (IAS 1.81B).</li></ul><p class='note'>Revenue is almost nil and costs are small, which fits a holding company, not a group.</p>"},
 "1c":{t:3, pts:3, page:2, title:"Rent charges despite IFRS 16", ask:"An IFRS company shows 'Rent and associated charges' of €48.3m (2022) inside external expenses, and also 'depreciation and impairment on right of use on leased assets' in the income statement. How can it still have rent charges if it applies IFRS 16?",
  a:"<p>IFRS 16 puts most leases on the balance sheet (right-of-use asset, lease liability), but some payments still go straight to expenses:</p><ul class='plain'><li><b>Short-term leases</b> (12 months or less) and <b>leases of low-value assets</b>: the lessee may choose to expense them (IFRS 16.5–6).</li><li><b>Variable payments</b> that do not depend on an index or rate, for example rent based on sales.</li><li><b>“Associated charges”</b>: service and non-lease parts such as maintenance, cleaning or building charges, which are not part of the lease liability.</li></ul><p class='note'>For 3 points: name the IFRS 16 idea in one line, then two of these exceptions.</p>"},
 "1d":{t:5, pts:6, page:3, title:"Which KPI is this?", ask:"The exam shows a cash flow excerpt (in €m): operating cash flow 5,168 in 2022 and 399 in 2021; net cash used in investing activities −2,286 in 2022 and −1,119 in 2021; KPI = 2,882 in 2022 and −720 in 2021. Profit before tax was 1,050 in 2022 and −2,606 in 2021; change in trade working capital +1,694 in 2022. Which KPI is it, how is it calculated, what does it mean, and comment on 2021 and 2022.",
  a:"<p><b>Free cash flow.</b></p><ul class='plain'><li><b>Calculation:</b> operating cash flow plus net cash from investing activities. 2022: 5,168 − 2,286 = 2,882. 2021: 399 − 1,119 = −720.</li><li><b>Meaning:</b> the cash the business generates after paying for its investments, so the cash available to repay debt or pay shareholders.</li><li><b>2021:</b> negative. The company made a large loss (−2,606 before tax) and barely generated operating cash, so investments were financed with debt or equity.</li><li><b>2022:</b> strongly positive, thanks to the return to profit, but also to a large working-capital inflow (+1,694). That part may not repeat, so the quality of this free cash flow is lower than the number suggests.</li></ul>"},
 "2a":{t:2, pts:1, page:4, title:"Why no goodwill amortisation?", ask:"easyJet's 2022 goodwill note shows cost £365m and no amortisation charge. Explain why there is no goodwill amortisation.",
  a:"<p>Under IFRS 3 and IAS 36, goodwill is <b>not amortised</b>. Its useful life is treated as indefinite, so instead it must be <b>tested for impairment at least once a year</b>.</p>"},
 "2b":{t:3, pts:5, page:4, title:"How the recoverable amount of goodwill is calculated", ask:"easyJet's note: the recoverable amount of goodwill and other indefinite-life assets is based on value in use for the airline route network cash-generating unit. Pre-tax cash flows come from the strategic plan up to 2027; pre-tax discount rate 12.2% (2022) vs 11.3% (2021); fuel price US$1,010 vs 696 per tonne. Explain how the recoverable amount of goodwill is calculated in general and for easyJet.",
  a:"<ul class='plain'><li><b>In general:</b> goodwill has no cash flows of its own, so it is tested with the <b>cash-generating unit (CGU)</b> it belongs to. The recoverable amount is the <b>higher of fair value less costs of disposal and value in use</b> (IAS 36). If it is lower than the carrying amount of the CGU (including goodwill), the difference is an impairment loss, charged first to goodwill.</li><li><b>Value in use</b> is the present value of the future cash flows the CGU is expected to generate.</li><li><b>easyJet:</b> one CGU, the airline route network. Recoverable amount = value in use: cash flow projections from the strategic plan up to 2027, discounted at a pre-tax rate derived from WACC (12.2% in 2022).</li></ul>"},
 "2c":{t:3, pts:4, page:5, title:"Discount rate and fuel price: stricter than last year?", ask:"easyJet raised its pre-tax discount rate from 11.3% (2021) to 12.2% (2022) and its fuel price assumption from US$696 to US$1,010 per tonne. How do these changes affect the recoverable amount of goodwill? Are the 2022 assumptions stricter (more prudent) than 2021?",
  a:"<ul class='plain'><li><b>Higher discount rate</b> (11.3% → 12.2%): future cash flows are worth less today, so value in use falls.</li><li><b>Higher fuel price</b> ($696 → $1,010 per tonne): higher costs, lower cash flows, so value in use falls again.</li><li><b>So yes, stricter:</b> both changes lower the recoverable amount, which makes an impairment more likely. You can add that they also reflect the 2022 market (higher interest rates, expensive fuel), so they are realistic rather than only cautious.</li></ul>"},
 "2d":{t:2, pts:16, page:5, title:"Consolidated balance sheet at acquisition", ask:"PC buys 100% of SA for 3,000 cash. PC values SA's brand at 600 and a building at 400 above book value, and expects synergies of 800. PC: cash 500, receivables 740, inventory 820, PP&E 4,600, investment in SA 3,000; share capital 900, share premium 700, retained earnings 1,210, current liabilities 2,850, long-term debt 4,000 (total 9,660). SA: cash 380, receivables 420, inventory 530, PP&E 870; share capital 200, share premium 825, retained earnings 175, current liabilities 350, long-term debt 650 (total 2,200). Prepare the purchase price allocation and the consolidated balance sheet at the date of acquisition.",
  a:"<p><b>Purchase price allocation</b></p><table class='sol'><tr><td>Price paid</td><td>3,000</td></tr><tr><td>SA equity at book value (200 + 825 + 175)</td><td>1,200</td></tr><tr><td>+ Brand (not on SA's books)</td><td>600</td></tr><tr><td>+ Building, fair value above book</td><td>400</td></tr><tr><td>= Fair value of net assets bought</td><td>2,200</td></tr><tr><td><b>Goodwill</b> (3,000 − 2,200)</td><td><b>800</b></td></tr></table><p class='note'>The expected synergies are not recognised separately: they are part of what goodwill pays for. Deferred taxes on the revaluations are ignored, as in the slides.</p>"+
   "<p><b>Consolidated balance sheet</b> (PC + SA, investment eliminated)</p><table class='sol'><tr><td>Goodwill</td><td>800</td></tr><tr><td>Brand</td><td>600</td></tr><tr><td>PP&amp;E (4,600 + 870 + 400)</td><td>5,870</td></tr><tr><td>Inventory (820 + 530)</td><td>1,350</td></tr><tr><td>Receivables (740 + 420)</td><td>1,160</td></tr><tr><td>Cash (500 + 380)</td><td>880</td></tr><tr><td><b>Total assets</b></td><td><b>10,660</b></td></tr><tr><td>Share capital (PC only)</td><td>900</td></tr><tr><td>Share premium (PC only)</td><td>700</td></tr><tr><td>Retained earnings (PC only)</td><td>1,210</td></tr><tr><td>Current liabilities (2,850 + 350)</td><td>3,200</td></tr><tr><td>Long-term debt (4,000 + 650)</td><td>4,650</td></tr><tr><td><b>Total equity and liabilities</b></td><td><b>10,660</b></td></tr></table><p class='note'>SA's equity disappears: it is replaced by the assets and liabilities behind it. At the date of acquisition only the parent's equity remains.</p>"},
 "3":{t:3, pts:18, page:7, title:"Machine: impairment and reversal, N1 to N4", ask:"BUILD buys a machine on 1.1.N1 for €300,000, cost model, straight-line over 10 years. Fair value / cost to sell / value in use: N1 265,000 / 20,000 / 260,000; N2 245,000 / 20,000 / 230,000; N3 170,000 / 18,000 / 175,000; N4 200,000 / 15,000 / 190,000. N1 and N2 normal. In N3 a law prohibits concrete manufacturing from N8. In N4 a transition rule allows existing plants to continue until N11. Outline the reasoning and the accounting impacts for N1 to N4.",
  a:"<p><b>N1 and N2: depreciation only.</b> 300,000 / 10 = 30,000 a year. Carrying amount 270,000 (N1), 240,000 (N2). Production runs as planned, so there is <b>no indication of impairment</b> and no test is required (IAS 36.9).</p>"+
   "<p><b>N3: the new law is an indication.</b> First review the useful life (IAS 16.51): use ends before N8, so 5 years remain from N3 (N3 to N7). Depreciation N3 = 240,000 / 5 = <b>48,000</b> → 192,000.<br>Recoverable amount = higher of fair value less cost to sell (170,000 − 18,000 = 152,000) and value in use (175,000) = <b>175,000</b>.<br>Impairment loss = 192,000 − 175,000 = <b>17,000</b>, an expense in profit or loss. Carrying amount 175,000.</p>"+
   "<p><b>N4: the transition rule is an indication of reversal.</b> Use is possible again until the original end of N10, so 7 years remain from N4. Depreciation N4 = 175,000 / 7 = <b>25,000</b> → 150,000.<br>Recoverable amount = higher of 185,000 (200,000 − 15,000) and 190,000 = 190,000.<br>But a reversal is capped at the carrying amount there would have been without the impairment: 192,000 − 192,000 / 7 = <b>164,571</b>.<br>Reversal = 164,571 − 150,000 = <b>14,571</b>, a gain in profit or loss. Carrying amount 164,571.</p>"+
   "<p class='note'>A simpler reading keeps the 10-year life throughout: N3 carrying 210,000, impairment 35,000; N4 carrying 150,000 after 25,000 depreciation, cap 180,000 (300,000 − 4 × 30,000), reversal 30,000. In the exam, state which reading you use; the reasoning carries most of the points.</p>"},
 "4":{t:4, pts:9, page:8, title:"Bond at amortised cost", ask:"Company B issues 5,000 bonds with nominal €100 on 1 January N1 at €90 each. Coupon 6% paid at year end, effective interest rate 7%, redeemed at nominal at the end of N10. What are the financial statement impacts in N1 and N2 at amortised cost?",
  a:"<p><b>Issue (1.1.N1):</b> cash +450,000 (5,000 × 90); financial liability +450,000.</p><table class='sol'><tr><td></td><td>N1</td><td>N2</td></tr><tr><td>Liability at start</td><td>450,000</td><td>451,500</td></tr><tr><td>Interest expense (7% × start)</td><td>31,500</td><td>31,605</td></tr><tr><td>Coupon paid, cash out (6% × 500,000)</td><td>30,000</td><td>30,000</td></tr><tr><td>Liability at end</td><td>451,500</td><td>453,105</td></tr></table><p>The expense follows the <b>effective</b> rate on the carrying amount; the cash follows the <b>coupon</b>. The difference (1,500, then 1,605) is added to the liability, which climbs towards 500,000 by N10.</p>"},
 "5a":{t:4, pts:4, page:9, title:"Treasury shares sold below cost", ask:"In N-1 a corporation bought back 40,000 own shares (€30 par) at €45. In N it sells 1,000 of them at €40. What is the effect on equity in N? (Multiple choice.)",
  a:"<p><b>Answer: treasury shares become €45,000 less negative, share premium decreases by €5,000, cash increases by €40,000.</b></p><ul class='plain'><li>Cash in: 1,000 × 40 = 40,000.</li><li>The shares leave treasury at their cost: 1,000 × 45 = 45,000.</li><li>The 5,000 difference is not a loss in profit or loss: dealing in own shares never goes through the income statement. It reduces share premium (equity).</li></ul>"},
 "5b":{t:5, pts:2, page:9, title:"ROCE", ask:"Which statement about Return on Capital Employed is correct? Options include: operating profit / capital employed; operating profit / total assets; EBITDA / capital employed; mandatory under IFRS; returns for shareholders.",
  a:"<p><b>Answer: it is calculated as operating profit divided by capital employed.</b> It measures the return on all capital invested in operations (equity and debt), not only shareholders' return, and it is not required by IFRS.</p>"},
 "5c":{t:5, pts:3, page:9, title:"Economic value added", ask:"Sales 49,155; EBITDA 5,565; EBIT 1,848; profit before tax 1,575; tax rate 25%; profit after tax 1,181; WACC 6.5%; capital employed 32,780 (€m). What is EVA? Options: 2,043; −282.7; −744.7; −949.7.",
  a:"<p><b>Answer: −744.7 m€.</b></p><ul class='plain'><li>EVA = NOPAT − WACC × capital employed.</li><li>NOPAT = EBIT × (1 − tax) = 1,848 × 0.75 = 1,386.</li><li>Capital charge = 6.5% × 32,780 = 2,130.7.</li><li>EVA = 1,386 − 2,130.7 = <b>−744.7</b>.</li></ul><p class='note'>The traps: −949.7 uses profit after tax (after interest, so financing is counted twice); 2,043 starts from EBITDA.</p>"}
};

 1:[["In 2026, the EU is the only jurisdiction in the world that requires IFRS for the consolidated statements of listed companies.",false,"Over 140 jurisdictions require IFRS for listed companies, for example the UK, Australia and Brazil."],

 2:[["Individual financial statements are generally prepared under IFRS in Europe.",false,"Individual statements usually follow local rules (German, French GAAP). IFRS is required for the consolidated statements of listed groups."],

 "<h3>Why goodwill exists</h3><p>When one company buys another, it rarely pays exactly what the target's balance sheet says the target is worth. The balance sheet lists what can be counted: buildings, machines, inventory, cash, and what is owed. It does not list a loyal customer base, a strong team or the savings the buyer expects from combining the two businesses.</p><p>Buyers pay for those things anyway. The amount paid on top of everything that can be identified and valued has a name in accounting: goodwill.</p>",
 "<h3>Finding the number</h3><p>The buyer first restates what it bought at today's values. A brand the target built itself may not be on the target's books at all, but if it can be identified and valued, the buyer records it. The same goes for a building that is worth more than its book value.</p><p>Only then is goodwill calculated. Take the price paid. Subtract the fair value of everything identifiable, net of the debts taken over. What is left is goodwill. It appears as an asset in the group's balance sheet, not in the buyer's own.</p>",
 "<h3>What happens afterwards</h3><p>A machine wears out, so its cost is spread over the years it is used. Goodwill has no such lifespan. Under IFRS it is not written down by a fixed slice each year.</p><p>The group must check at least once a year whether the business it bought is still worth what the books say. If it is worth less, goodwill is reduced and the loss hits profit. That loss is never taken back later, even if the business recovers.</p>"

    DEVNOTES.map(function(g){ return '<section class="card"><h2>'+g[0]+'</h2>'+g[1].map(function(x){ return '<div class="dn"><span class="q">'+x[0]+'</span><span>'+x[1]+'</span><span class="a">'+x[2]+'</span></div>'; }).join("")+'</section>'; }).join("")+
    '<section class="card"><h2>Demo controls</h2><p class="note">Exam-ready needs answers on two different days. For a demo you can move the clock. Current prototype date: '+today()+'.</p><button class="btn ghost" id="tomorrow">Pretend it is tomorrow</button><button class="btn ghost" id="reset">Reset all progress</button></section>';
}

function render(){
  if(tick){ clearInterval(tick); tick = null; }
  killCity();
  var r = route(), m = r.match(/^topic-(\d)$/), msol = r.match(/^solution\/([0-9a-z]+)$/), mcard = r.match(/^cards\/([a-z0-9,-]+)$/);
  nav.innerHTML = TABS.map(function(x){ var cur = x[0]===r || (x[0]==="plan" && /^plan\//.test(r)) || (x[0]==="map" && (m || /^doc\//.test(r) || /^solution\//.test(r) || r==="practice" || r==="level-check" || r==="context-check")); return '<a href="#'+x[0]+'"'+(cur?' aria-current="page"':'')+'>'+x[1]+'</a>'; }).join("");
  var dr = docRoute(r);
  if(!dr && DV.err){ DV.err = ""; DV.id = ""; }
  if(dr){ openDoc(dr); if(DV.doc && DV.id===dr.id){ S.docPos[dr.id] = dr.page; saveLocal(); } }
  var isPlan = /^plan(\/|$)/.test(r) || r==="journal";
  var v = isPlan ? (window.FLPlan ? window.FLPlan.view(r) : '<p class="lead">Loading the planner…</p>') : dr ? vDoc(dr) : m ? vTopic(+m[1]) : msol ? vSolution(msol[1]) : mcard ? vCards(mcard[1]) : ({map:vMap, universe:vUniverse, practice:vPractice, "level-check":vCheck, "context-check":vContext, reading:vReading, "dev-notes":vDev, account:vAccount}[r] || vMap)();
  app.innerHTML = v;
  if(document.getElementById("city")) mountCity();
  if(isPlan && window.FLPlan) window.FLPlan.after(r);
  if(dr && DV.doc) drawDoc(Math.min(Math.max(1, dr.page), DV.doc.numPages));
  if(msol || mcard) tick = setInterval(function(){
    var c = document.getElementById("sol-clock"); if(c && solTimer){ var l = Math.max(0, solTimer.secs - Math.floor((Date.now()-solTimer.start)/1000)); c.textContent = Math.floor(l/60)+":"+("0"+l%60).slice(-2)+(l===0?" · time's up":""); }
    var q = document.getElementById("qz-clock"); if(q && QZ && QZ.timed){ var l2 = Math.max(0, QZ.mins*60 - Math.floor((Date.now()-QZ.start)/1000)); q.textContent = Math.floor(l2/60)+":"+("0"+l2%60).slice(-2); }
  }, 1000);
  if(r==="reading" && S.timer && S.timer.start && R){
    if(R.kind==="pdf") drawPage();
    tick = setInterval(function(){ var c = document.getElementById("clock"); if(!c || !S.timer) return; c.textContent = clock(Math.floor((Date.now()-S.timer.start)/1000)); }, 1000);
  }
}

/* ================= events ================= */
function curEx(){ var r = route(); return r==="practice" ? S.ex : (r==="level-check" && S.check ? S.check.ex : null); }
function checkAdvance(){
  var c = S.check, x = c.ex;
  c.log.push({type:x.type, ok:x.ok && !x.hint, rating:c.rating});
  S.notes.push({topic:2, type:x.type, rating:c.rating, text:(c.text||"").slice(0,600)});
  var first = c.log[0], second = c.log[1];
  if(!second){
    c.ex = gen(first.ok ? "e3" : "e1"); c.rating = null; c.text = "";
  } else {
    c.startStep = first.ok ? (second.ok ? 4 : 3) : (second.ok ? 2 : 1);
    c.done = true; c.ex = null;
  }
}

  if(dsg.tf){ var tf = dsg.tf.split("|"); TG(+tf[0]).stage = tf[1]; if(tf[1]==="rate") TG(+tf[0]).ri = 0; save(); render(); window.scrollTo(0,0); return; }
  if(dsg.guess){ var gu = dsg.guess.split("|"); TG(+gu[0]).guess = +gu[1]; save(); render(); return; }
  if(dsg.term){ openTerm = openTerm===dsg.term ? "" : dsg.term; render(); return; }
  if(dsg.tri){ var tr = dsg.tri.split("|"), gt = TG(+tr[0]); gt.ri = Math.max(0, gt.ri + (+tr[1])); save(); render(); return; }

  var x = curEx();
  if(t.id==="hint" && x){ x.hint = true; save(); render(); return; }

  if(t.id==="next-ex"){ S.ex = gen(nextType()); save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="check-start"){ S.check = {ex:gen("e2"), log:[], rating:null, text:"", done:false}; save(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.selfrate){ S.check.rating = t.dataset.selfrate; var f = document.getElementById("feel"); if(f) S.check.text = f.value; save(); render(); var b = document.getElementById("check-next"); if(b) b.scrollIntoView({block:"nearest"}); return; }
  if(t.id==="check-next"){ var f2 = document.getElementById("feel"); if(f2) S.check.text = f2.value; checkAdvance(); save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="check-redo"){ S.check = null; save(); render(); return; }
  if(t.dataset.tf !== undefined){ var c = S.ctx, v = t.dataset.tf === "true"; c.picked = v; if(v === CONTEXT2[c.i][1]) c.right++; save(); render(); return; }
  if(t.id==="ctx-next"){ S.ctx.i++; S.ctx.picked = null; if(S.ctx.i >= CONTEXT2.length) S.ctxDone = {right:S.ctx.right}; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="ctx-redo"){ S.ctx = null; save(); render(); return; }
  if(t.id==="ac-forgot"){ forgot(); return; }
  if(t.id==="ac-mode"){ acctMode = acctMode==="up" ? "in" : "up"; acctMsg = ""; render(); return; }
  if(t.id==="dv-zoom"){ DV.zoom = DV.zoom>1 ? 1 : 2; render(); return; }
  if(t.id==="dv-zin"){ DV.zoom = ({1:1.5,1.5:2,2:3,3:4})[DV.zoom] || 4; render(); return; }
  if(t.id==="dv-zout"){ DV.zoom = ({4:3,3:2,2:1.5,1.5:1})[DV.zoom] || 1; render(); return; }
  if(t.id==="ac-out" && sb){ sb.auth.signOut().then(function(){ sbUser = null; cloud.ref = null; cloud.assets = null; cloud.fetchFile = null; cloud.state = "signedout"; S = fresh(); saveLocal(); DV.key = null; DV.cache = {}; DV.doc = null; DV.id = ""; acctMsg = ""; setSync(); go("map"); }); return; }
  if(t.dataset.readnow){ rdFor = t.dataset.readnow; go("reading"); return; }
  if(t.dataset.readdoc){ openReadable(t.dataset.readdoc); return; }
  if(t.dataset.openfile){ var oid = t.dataset.openfile, of = S.files[oid]; if(!of) return;

app.addEventListener("input", function(e){

});
app.addEventListener("change", function(e){
  var t = e.target;
  if(t.id==="exam"){ S.examDate = t.value; save(); render(); }
  if(t.id==="rd-for"){ rdFor = t.value; }
  if(t.id==="rd-here" && t.value){ openReadable(t.value); }
  if(t.dataset.attach && t.files && t.files[0] && cloud.assets){
    var aid = t.dataset.attach, af = t.files[0]; attachMsg[aid] = "";
    if(af.size > (cloud.maxBytes||20*1024*1024)){ attachMsg[aid] = "This file is over "+Math.round((cloud.maxBytes||20*1024*1024)/1048576)+" MB. Split the chapter or export a smaller PDF."; render(); return; }
    uploading[aid] = true; render();
    var pagesP = new Promise(function(res){
      if(!window.pdfjsLib){ res(0); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
      var fr2 = new FileReader(); fr2.onerror = function(){ res(0); };
      fr2.onload = function(){ window.pdfjsLib.getDocument({data:new Uint8Array(fr2.result)}).promise.then(function(d){ res(d.numPages); }, function(){ res(0); }); };
      fr2.readAsArrayBuffer(af);
    });
    Promise.all([cloud.assets.upload(af, {type:"application/pdf"}), pagesP]).then(function(r){
      S.files[aid] = {id:r[0].id, name:String(af.name).slice(0,80), size:r[0].sizeBytes, pages:r[1]||0};
      if(r[1]) S.pages[aid] = String(r[1]);
      delete uploading[aid]; save(); render();
    }, function(e){
      delete uploading[aid];
      attachMsg[aid] = ({too_large:"This file is too large to store.", unsupported_type:"Only PDF files can be attached.", quota_or_state:"Storage for this prototype is full. Remove a file first.", rate_limited:"Too many uploads at once. Wait a moment and try again."})[e && e.code] || "The upload did not go through. Try again.";

    });
  }
  if(t.id==="rd-file" && t.files && t.files[0]){
    var f = t.files[0];
    if(!window.pdfjsLib){ rdMsg = "The PDF viewer could not load. Use paper reading for now."; render(); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
    var fr = new FileReader();
    fr.onload = function(){
      window.pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(doc){

      }, function(){ R = null; rdMsg = "This file could not be opened as a PDF. Try another file, or export the chapter as a PDF first."; render(); });
    };
    fr.onerror = function(){ rdMsg = "The file could not be read. Try again."; render(); };
    fr.readAsArrayBuffer(f);
  }
  if(t.dataset.rate){ S.rating[t.dataset.rate] = t.value; save(); render(); }

document.addEventListener("change", function(e){
  var bp = e.target && e.target.dataset && e.target.dataset.bookpick;
  if(bp && e.target.files && e.target.files[0]){

      return window.pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise.then(function(doc){

        if(n!==BOOKS[k].pages) bookMsg = "This PDF has "+n+" pages, not "+BOOKS[k].pages+", so it may be another edition and the page links can be off. ";

          bookMsg += BOOKS[k].s+" saved on this device."; render(); });
      });
    }).catch(function(){ bookMsg = "That file could not be saved. Is it a PDF? If your phone is low on storage, free some space and try again."; render(); });
