<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finish Line prototype</title>
<link rel="stylesheet" href="leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column, phone first. The course map is home; every topic is a ladder; a running-track lane marks the finish line. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#16211C; --muted:#5C6B63; --line:#D9DFD8;
  --accent:#D9482B; --accent-ink:#FFFFFF; --deep:#1F5A45; --on-deep:#FFFFFF;
  --good:#1E7A4F; --good-bg:#DDF0E5; --warn:#9A5B00; --warn-bg:#FBEBCF; --idle-bg:#E9EDE8;
  --info:#2B4C8C; --info-bg:#E1E8F7;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111815; --surface:#1A2420; --ink:#ECF1EC; --muted:#9BAAA1; --line:#2C3A34;
    --accent:#F0633F; --accent-ink:#1A0D08; --deep:#7FCBA9; --on-deep:#0E1512;
    --good:#7FD3A6; --good-bg:#173A2A; --warn:#F2C374; --warn-bg:#3D2E10; --idle-bg:#232E29;
    --info:#A9C0F5; --info-bg:#1C2A4A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111815; --surface:#1A2420; --ink:#ECF1EC; --muted:#9BAAA1; --line:#2C3A34;
  --accent:#F0633F; --accent-ink:#1A0D08; --deep:#7FCBA9; --on-deep:#0E1512;
  --good:#7FD3A6; --good-bg:#173A2A; --warn:#F2C374; --warn-bg:#3D2E10; --idle-bg:#232E29;
  --info:#A9C0F5; --info-bg:#1C2A4A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.flag{width:18px;height:18px;border-radius:3px;background:conic-gradient(var(--ink) 25%,transparent 0 50%,var(--ink) 0 75%,transparent 0) 0 0/9px 9px;border:1px solid var(--ink)}
.proto{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{font-size:13px;text-decoration:none;color:var(--muted);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
nav.tabs a[aria-current="page"]{color:var(--on-deep);background:var(--deep);border-color:var(--deep)}
h1{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.25;margin:0}
p{margin:0}
a{color:var(--deep)}
.lead{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.note{font-size:13px;color:var(--muted)}
.back{font-size:14px;text-decoration:none}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}
label.f{font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:6px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-align:center;text-decoration:none;display:block;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:14px;width:auto;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.solid{background:var(--good-bg);color:var(--good)}
.pill.prog{background:var(--info-bg);color:var(--info)}
.pill.gap{background:var(--warn-bg);color:var(--warn)}
.pill.todo{background:var(--idle-bg);color:var(--muted)}
/* finish card */
.finish{background:var(--deep);color:var(--on-deep);border:0}
.finish .big{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;font-variant-numeric:tabular-nums}
.finish .eyebrow,.finish .note{color:inherit;opacity:.82}
.finish input[type=date]{background:transparent;color:inherit;border-color:currentColor;width:auto;padding:5px 8px;font-size:14px}
.lane{display:flex;align-items:center;gap:5px}
.lane i{flex:1;height:12px;border-radius:3px;background:currentColor;opacity:.25;position:relative;overflow:hidden}
.lane i b{position:absolute;inset:0 auto 0 0;background:currentColor;opacity:1}
.lane i.full{opacity:1}
.lane .end{width:14px;height:22px;border-radius:2px;flex:none;background:conic-gradient(currentColor 25%,transparent 0 50%,currentColor 0 75%,transparent 0) 0 0/7px 7px;border:1px solid currentColor}
/* topic rows */
.topic{display:grid;grid-template-columns:40px 1fr;gap:12px;text-decoration:none;color:inherit;align-items:start}
.topic .num{width:40px;height:40px;border-radius:10px;background:var(--idle-bg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px}
.topic .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--idle-bg)}
.dots i.solid{background:var(--good)} .dots i.prog{background:var(--info)} .dots i.gap{background:var(--warn)}
/* ladder */
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ladder li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ladder li:first-child{border-top:0;padding-top:0}
.ladder .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--deep);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.ladder .n.here{background:var(--deep);color:var(--on-deep)}
.ladder .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.ladder select{font-size:14px;padding:6px 8px}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.check{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px}
.check input{width:18px;height:18px;margin:2px 0 0}
.readrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.readrow:first-of-type{border-top:0}
.readrow .tools{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.readrow .tools input{width:84px;padding:5px 8px;font-size:14px}
.mat{display:flex;flex-wrap:wrap;gap:6px}
/* universe */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:220px;display:flex;align-items:flex-end;background:#16211C}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:relative;padding:60px 16px 16px;width:100%;color:#fff;background:linear-gradient(to top,rgba(10,18,14,.88),rgba(10,18,14,0));display:flex;flex-direction:column;gap:6px}
.hero .ov p{color:#E6ECE7}
.hero .eyebrow{color:#CFE3D8}
.co{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.co .ph{position:relative;aspect-ratio:16/9;background:#16211C}
.co .ph img{width:100%;height:100%;object-fit:cover;display:block}
.co .ph .tag{position:absolute;left:12px;bottom:10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgba(10,18,14,.72);padding:3px 9px;border-radius:999px}
.co .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.co .tx p{font-size:14px;color:var(--muted)}
/* exercise */
.sheet{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px;font-variant-numeric:tabular-nums}
.sheet .ti{background:var(--idle-bg);padding:6px 10px;font-weight:600}
.sheet .cols{display:grid;grid-template-columns:1fr 1fr}
.sheet .col{padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.sheet .col + .col{border-left:1px solid var(--line)}
.sheet .col .h{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sheet .ln{display:flex;justify-content:space-between;gap:8px}
.sheet .ln.tot{border-top:1px solid var(--line);padding-top:4px;font-weight:600}
.fields{display:flex;flex-direction:column;gap:10px}
.fld{display:grid;grid-template-columns:1fr 116px;gap:10px;align-items:center;font-size:14px}
.fld input{text-align:right;font-variant-numeric:tabular-nums}
.fld input.right{border-color:var(--good);background:var(--good-bg)}
.fld input.wrong{border-color:var(--warn);background:var(--warn-bg)}
.fld .ans{grid-column:1/-1;font-size:13px;color:var(--warn)}
.fb{border-left:4px solid var(--good);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:8px}
.fb.miss{border-color:var(--warn)}
.fb b.v{font-family:var(--display)}
.exam{font-size:14px;background:var(--idle-bg);border-radius:10px;padding:10px 12px}
ol.steps{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--deep);background:var(--good-bg)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--warn-bg);border-color:var(--warn)}
.opt[disabled]{cursor:default}
.timer{font-family:var(--display);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;line-height:1}
.dn{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dn:first-of-type{border-top:0}
.dn .q{font-weight:600}
.dn .a{color:var(--muted)}
footer{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
/* 3D city: one visual world, same in both themes */
.city{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#24493B 0%,#0E1814 70%);color:#E6ECE7}
.city canvas{display:block;width:100%;height:300px;touch-action:pan-y;cursor:grab}
.city .cap{position:absolute;left:14px;right:14px;bottom:10px;font-size:12px;color:#CFE3D8;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.city .hd{position:absolute;left:14px;top:12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#CFE3D8}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.medal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;line-height:1.25;color:var(--muted);perspective:300px}
.medal .disc{width:52px;height:52px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.medal.on{color:var(--ink)}
.medal.on .disc{border:0;color:#3A2A00;background:conic-gradient(from 210deg,#F6D77A,#E9A93B,#FBE9A8,#D9952A,#F6D77A);box-shadow:0 2px 0 #B67A1C,0 6px 12px rgba(0,0,0,.18)}
.attach{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.attach .fname{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
label.btn.small{display:inline-block;cursor:pointer}
label.btn.small input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label.btn.small:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.readbar{position:sticky;top:0;z-index:5;background:var(--deep);color:var(--on-deep);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.readbar .timer{font-size:28px}
.readbar .pg{font-size:14px;font-weight:600}
.pdfwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:none}
.pdfwrap canvas{display:block}
.samplepg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;font-size:17px;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: no-preference){
  .card,.co{animation:in .22s ease-out}
  .fb{animation:flip .4s ease-out;transform-origin:top}
  .medal.on .disc{animation:spin 5s ease-in-out infinite}
}
@keyframes flip{from{transform:perspective(600px) rotateX(-65deg)}to{transform:none}}
@keyframes spin{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(360deg)}}
@keyframes in{from{transform:translateY(5px)}to{transform:none}}

/* exam week planner */
.three{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.pl-steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pl-steps a{display:block;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.pl-steps li[aria-current] a{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.pl-count{display:flex;gap:14px;align-items:center;background:var(--deep);color:var(--on-deep);border-radius:14px;padding:14px 16px}
.pl-count .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.pl-days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.pl-day{flex:0 0 auto;font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;min-width:64px;cursor:pointer}
.pl-day span{font-size:12px;color:var(--muted)} .pl-day b{font-size:14px}
.pl-day.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.pl-day.exam{background:var(--warn-bg)}
.pl-map{height:240px;border-radius:12px;border:1px solid var(--line);overflow:hidden;z-index:0}
.pl-map.tall{height:320px}
.pl-tl{display:flex;flex-direction:column;gap:6px}
.pl-row{border-radius:10px;padding:8px 10px;font-size:14px;border-left:4px solid var(--line);background:var(--bg)}
.pl-row.ev{border-left-color:var(--muted);background:var(--idle-bg)}
.pl-row.tr{border-left-color:var(--accent)}
.pl-row.st{border-left-color:var(--good);background:var(--good-bg)}
.pl-row.st.done{opacity:.6}
.pl-row.wake{font-size:12px;color:var(--muted);border-left-color:transparent;background:transparent;padding:2px 10px}
.pl-ev{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pl-place .row input{flex:1}
.pl-rec{background:var(--info-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.pl-rec span{color:var(--muted)}
.pl-progress{height:10px;border-radius:99px;background:var(--idle-bg);overflow:hidden}
.pl-progress i{display:block;height:100%;background:var(--good);border-radius:99px}
.pl-line{list-style:none;margin:0;padding:0 0 0 6px;border-left:4px solid var(--accent);display:flex;flex-direction:column;gap:12px}
.pl-line li{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-left:-14px}
.pl-line .dot{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--accent);margin-top:2px}
.pl-line .fx .dot{border-color:var(--muted);width:14px;height:14px;margin:4px 3px 0}
.pl-line .go .dot{border-color:var(--accent);width:14px;height:14px;margin:4px 3px 0}
.pl-line .sl.on .dot{background:var(--good);border-color:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
.pl-line .ex .dot{background:var(--accent);width:24px;height:24px}
.pl-metro{display:flex;flex-direction:column;gap:10px}
.pl-mrow{display:flex;align-items:center;gap:10px}
.pl-mrow .d{width:64px;font-size:13px;color:var(--muted)}
.pl-mrow .ln{flex:1;display:flex;align-items:center;gap:8px;border-top:3px solid var(--accent);padding-top:0;min-height:3px;position:relative;top:0;flex-wrap:wrap}
.pl-mrow .st{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:-8px}
.pl-mrow .st.learn{width:18px;height:18px;margin-top:-11px}
.pl-mrow .st.on{background:var(--good);border-color:var(--good)}
.pl-mrow .st.exam{background:var(--accent);width:22px;height:22px;margin-top:-13px}
.pl-pin span{display:inline-block;white-space:nowrap;background:var(--surface);color:var(--ink);border:2px solid var(--accent);border-radius:999px;padding:2px 8px;font:600 12px var(--body);transform:translate(-50%,-50%)}
.pl-prog{display:flex;align-items:center;gap:8px;margin-top:4px}.pl-prog i{flex:1;max-width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:block}.pl-prog i b{display:block;height:100%;background:var(--accent)}
.pl-one{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25}
.pl-more summary{cursor:pointer;color:var(--deep);font-weight:600;padding:6px 0}
.pl-more[open]{display:flex;flex-direction:column;gap:12px}
.pl-big{gap:14px}
.pl-big h1{font-size:24px}
.pl-calm{font-family:var(--display);font-size:18px;color:var(--good)}
.pl-cost{margin-top:-6px}
.btn.picked{outline:3px solid var(--good);outline-offset:2px}
.pl-sleep{flex-direction:row;align-items:flex-start;gap:10px;background:var(--info-bg)}
.pl-dayrow summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.pl-dayrow summary::-webkit-details-marker{display:none}
.pl-progress.small{height:6px}
.pl-steps,.pl-ev{}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--deep);text-decoration:underline;cursor:pointer}
.pl-chips{display:flex;flex-wrap:wrap;gap:8px}
.pl-chips .opt{width:auto}
.pl-if{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pl-if.on{border-color:var(--good);background:var(--good-bg)}
.pl-pin.home span{border-color:var(--deep)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#map"><span class="flag" aria-hidden="true"></span>Finish Line</a>
    <a class="proto" id="sync" href="#account" style="text-decoration:none">Prototype</a>
  </header>
  <nav class="tabs" id="nav" aria-label="Sections"></nav>
  <main id="app" class="stack"></main>
  <footer><a href="#dev-notes">Developer notes</a><span>IFRS (CM01) · built from your uploaded slides and cases</span></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="pdf.min.js"></script>
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="leaflet.js"></script>
<script>
(function(){
"use strict";

/* ================= course content (from the uploaded slides, cases and the Nov 2023 exam) ================= */

var cloud = {ref:null, assets:null, state:"local", saving:false, dirty:false, timer:null, tried:0};
var uploading = {}, pendingRemove = "", attachMsg = {};
function setSync(){
  var el = document.getElementById("sync"); if(!el) return;
  el.textContent = ({local:"Saved on this device only", loading:"Connecting…", on:"Saved to your account", saving:"Saving…", error:"Not saved to account", signedout:"Sign in to save"})[cloud.state];
}
function scheduleCloud(){ if(!cloud.ref) return; cloud.dirty = true; clearTimeout(cloud.timer); cloud.timer = setTimeout(pushCloud, 900); }
function pushCloud(){
  if(!cloud.ref || cloud.saving) return;
  cloud.saving = true; cloud.dirty = false; cloud.state = "saving"; setSync();
  var body = JSON.parse(JSON.stringify(S)); body.timer = null;
  cloud.ref.set({v:2, state:body}).then(function(){ cloud.state = "on"; }, function(e){
    cloud.state = "error"; if(e && e.code === "invalid_argument"){ cloud.ref = null; }
  }).then(function(){ cloud.saving = false; setSync(); if(cloud.dirty && cloud.ref) pushCloud(); });
}
function hasProgress(){ return !!(S.examDate || Object.keys(S.rating).length || Object.keys(S.tries).length || S.check || S.ctxDone || S.speed || Object.keys(S.read).length); }
function loadRemote(ref){
  var to = new Promise(function(_, rej){ setTimeout(function(){ rej({code:"timeout"}); }, 10000); });
  return Promise.race([ref.get(), to]).then(function(snap){
    cloud.ref = ref;
    var d = snap && snap.exists ? snap.data() : null;
    if(d && d.state && Object.keys(d.state).length){
      var t = S.timer, f = fresh(), remote = JSON.parse(JSON.stringify(d.state)), k;
      for(k in remote){ f[k] = remote[k]; }
      S = f; S.timer = t; saveLocal(); cloud.state = "on";
    } else { cloud.state = "on"; if(hasProgress()) pushCloud(); }
    setSync(); render();
  });
}

var sb = null, sbUser = null, acctMsg = "";
function attachSupabase(user){
  sbUser = user; var uid = user.id;
  cloud.maxBytes = 50*1024*1024;
  cloud.assets = {
    upload: function(file){ var path = uid+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+".pdf";
      return sb.storage.from("readings").upload(path, file, {contentType:"application/pdf"}).then(function(r){ if(r.error) throw {code: /exceed|too large|413/i.test(r.error.message||"") ? "too_large" : "upstream_error"}; return {id:path, sizeBytes:file.size}; }); },
    delete: function(id){ return sb.storage.from("readings").remove([id]).then(function(r){ if(r.error) throw r.error; }); }
  };
  cloud.fetchFile = function(id){ return sb.storage.from("readings").download(id).then(function(r){ if(r.error) throw r.error; return r.data.arrayBuffer(); }); };
  var ref = {
    get: function(){ return sb.from("user_state").select("state").eq("user_id", uid).maybeSingle().then(function(r){ if(r.error) throw r.error; return {exists:!!r.data, data:function(){ return r.data; }}; }); },
    set: function(body){ return sb.from("user_state").upsert({user_id:uid, state:body.state, updated_at:new Date().toISOString()}).then(function(r){ if(r.error) throw r.error; }); }
  };
  cloud.state = "loading"; setSync();
  return loadRemote(ref).catch(function(){ cloud.state = "error"; acctMsg = "Signed in, but the saved progress could not be loaded. Check that supabase_setup.sql was run in your project."; setSync(); render(); });
}
function initCloud(){
  var cfg = window.FL_CONFIG || {};
  if(cfg.supabaseUrl && cfg.supabaseKey && window.supabase && window.supabase.createClient){
    try{
      sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
      sb.auth.onAuthStateChange(function(ev, sess){
        if(ev === "PASSWORD_RECOVERY"){ recovery = true; if(sess && sess.user && !sbUser){ attachSupabase(sess.user).then(function(){ go("account"); }); } else { go("account"); } }
      });
      cloud.state = "loading"; setSync();
      sb.auth.getSession().then(function(r){
        var sess = r && r.data && r.data.session;
        if(sess && sess.user){ return attachSupabase(sess.user).then(function(){ if(recovery) go("account"); }); }
        cloud.state = "signedout"; setSync(); render();
      }).catch(function(){ cloud.state = "local"; setSync(); render(); });
      return;
    }catch(e){ sb = null; }
  }
  var c = window.claude;
  if(!c || typeof c.use !== "function"){ if(cloud.tried++ < 3) setTimeout(initCloud, 900); return; }
  cloud.state = "loading"; setSync();
  Promise.all([c.use("db"), c.use("user"), c.use("assets")]).then(function(r){
    var db = r[0], user = r[1]; cloud.assets = r[2] || null; cloud.maxBytes = 20*1024*1024;
    cloud.fetchFile = function(id){ return fetch("/_blob/"+id).then(function(res){ if(!res.ok) throw 0; return res.arrayBuffer(); }); };
    if(!db || !user){ cloud.state = "local"; setSync(); render(); return; }
    return user.id().then(function(id){
      if(!id){ cloud.state = "local"; setSync(); render(); return; }
      return loadRemote(db.doc("data/users/"+id+"/state"));
    });
  }).catch(function(){ cloud.state = "local"; setSync(); render(); });
}

function gen(type){
  var pk = pick(PARENTS), P = CO[pk].name, T = CO[pk].target;

  var Ep = pick([400,500,600]), Lp = pick([150,200,300]);
  var x = {type:type, P:P, T:T, hint:false, checked:false, values:{}, ok:null};
  if(type==="e1"){
    var I = Es, Ap = Ep + Lp - I;
    x.intro = P+" buys 100% of "+T+" for €"+I+"k. These are the two balance sheets on the acquisition date (in €k).";
    x.sheets = [sheet(P, [["Investment in "+T, I],["Other assets", Ap]], [["Equity", Ep],["Liabilities", Lp]]), sheet(T, [["Assets", As]], [["Equity", Es],["Liabilities", Ls]])];
    x.fields = [["gw","Goodwill",0],["ta","Total consolidated assets",Ap+As],["eq","Consolidated equity",Ep],["li","Consolidated liabilities",Lp+Ls]];
    x.hintText = "Compare the price with "+T+"'s equity. If they are equal and nothing is said about fair values, nothing is left over.";
    x.sol = ["Purchase price allocation: price "+I+" − book value of "+T+"'s equity "+Es+" = 0. No fair value differences are given, so there is no goodwill.",
      "Add 100% of both companies' assets and liabilities: assets "+Ap+" + "+As+" = "+(Ap+As)+", liabilities "+Lp+" + "+Ls+" = "+(Lp+Ls)+".",
      "Eliminate the investment ("+I+") against "+T+"'s equity ("+Es+").",
      "What remains in equity is "+P+"'s own equity: "+Ep+". Check: "+(Ap+As)+" = "+Ep+" + "+(Lp+Ls)+"."];
  }
  if(type==="e2"){
    var V = pick([30,40,60,80]), G = pick([10,20,30,50]); I = Es + V + G; Ap = Ep + Lp - I;
    x.intro = P+" buys 100% of "+T+" for €"+I+"k. "+T+" has built a brand that is not on its balance sheet. Its fair value is €"+V+"k. Balance sheets on the acquisition date (in €k):";
    x.sheets = [sheet(P, [["Investment in "+T, I],["Other assets", Ap]], [["Equity", Ep],["Liabilities", Lp]]), sheet(T, [["Assets", As]], [["Equity", Es],["Liabilities", Ls]])];
    x.fields = [["vd","Valuation difference (brand)",V],["gw","Goodwill",G],["ta","Total consolidated assets",Ap+As+V+G],["eq","Consolidated equity",Ep]];
    x.hintText = "Split the gap between the price and "+T+"'s book equity in two: first what you can name and value (the brand), then the rest.";

    var sun = new T.DirectionalLight(0xffffff, 0.95); sun.position.set(5, 9, 6); scene.add(sun);
    var g = new T.Group(); scene.add(g);

      }
      var lc = document.createElement("canvas"); lc.width = lc.height = 128; var lg = lc.getContext("2d");
      lg.fillStyle = "rgba(14,24,20,.78)"; lg.beginPath(); lg.arc(64,64,54,0,Math.PI*2); lg.fill();

    var end = function(e){

var SAMPLE = [
 "<h3>Why goodwill exists</h3><p>When one company buys another, it rarely pays exactly what the target's balance sheet says the target is worth. The balance sheet lists what can be counted: buildings, machines, inventory, cash, and what is owed. It does not list a loyal customer base, a strong team or the savings the buyer expects from combining the two businesses.</p><p>Buyers pay for those things anyway. The amount paid on top of everything that can be identified and valued has a name in accounting: goodwill.</p>",
 "<h3>Finding the number</h3><p>The buyer first restates what it bought at today's values. A brand the target built itself may not be on the target's books at all, but if it can be identified and valued, the buyer records it. The same goes for a building that is worth more than its book value.</p><p>Only then is goodwill calculated. Take the price paid. Subtract the fair value of everything identifiable, net of the debts taken over. What is left is goodwill. It appears as an asset in the group's balance sheet, not in the buyer's own.</p>",
 "<h3>What happens afterwards</h3><p>A machine wears out, so its cost is spread over the years it is used. Goodwill has no such lifespan. Under IFRS it is not written down by a fixed slice each year.</p><p>The group must check at least once a year whether the business it bought is still worth what the books say. If it is worth less, goodwill is reduced and the loss hits profit. That loss is never taken back later, even if the business recovers.</p>"
];

    if(DV.err==="booksignin") return h+'<section class="card"><p>The textbooks are stored for your account. <a href="#account">Sign in</a> and this page opens. The first time takes a moment (Elliott is 20 MB); after that it opens straight from this device.</p></section>';
    if(DV.err==="booknoaccess") return h+'<section class="card"><p>This account cannot open the textbooks. They open only for the course owner\'s account.</p></section>';
    if(DV.err==="nolocal") return h+'<section class="card"><p>Your copy of this book is not on this device yet. Choose the PDF once; it stays on this phone or computer only and is never uploaded.</p>'+bookPicker(d.local)+'</section>';
    var msg = {signin:'Course files open for signed-in accounts with course access. <a href="#account">Sign in</a> first.', noaccess:'Your account does not have access to the course files yet. Ask the course owner to add your email.', viewer:'The PDF viewer could not load. Reload the page.', missing:'This file is not on the site yet.'}[DV.err] || 'The file could not be opened. Check your connection and try again.';
    return h+'<section class="card"><p>'+msg+'</p></section>';
  }
  if(!DV.doc || DV.id !== dr.id) return h+'<section class="card"><p class="lead">Opening '+esc(d.t)+' …</p><p class="note">'+d.p+' pages'+(d.p>200?'. Large report: this can take a little while on mobile data.':'.')+'</p></section>';
  var total = DV.doc.numPages, pg = Math.min(Math.max(1, dr.page), total);
  if(/-solutions$/.test(dr.id)) h += '<p class="exam"><b>Solutions.</b> Try the case on paper first. Reading a solution before trying does not train the step.</p>';
  if(/-slides$/.test(dr.id)){
    var t = TOPICS[tn-1], cur = t.steps.filter(function(s){ return s[3] && pg>=s[3] && pg<=s[4]; })[0];
    h += '<div class="mat" role="navigation" aria-label="Ladder steps">'+t.steps.filter(function(s){return s[3];}).map(function(s,i){ return '<a class="pill '+(cur&&cur[0]===s[0]?"prog":"todo")+'" href="#doc/'+dr.id+'/'+s[3]+'">'+(t.steps.indexOf(s)+1)+'. '+esc(s[1])+'</a>'; }).join("")+'</div>';
    if(cur) h += '<p class="note">You are in step '+(t.steps.indexOf(cur)+1)+': '+esc(cur[1])+' (slides '+cur[3]+' to '+cur[4]+').</p>';
  }
  h += '<div class="readbar"><span class="pg">'+(d.local ? 'Book page '+(pg-BOOKS[d.local].off) : 'Page '+pg+' of '+total)+'</span><label class="pg">Go to <input type="number" min="1" max="'+total+'" inputmode="numeric" id="dv-go" value="'+pg+'" style="width:70px"></label></div>';
  h += '<div class="pdfwrap"><canvas id="dvc" aria-label="Page '+pg+'"></canvas></div>';
  h += '<div class="two"><a class="btn ghost" href="#doc/'+dr.id+'/'+Math.max(1,pg-1)+'"'+(pg<=1?' aria-disabled="true"':'')+'>Previous</a><a class="btn" href="#doc/'+dr.id+'/'+Math.min(total,pg+1)+'"'+(pg>=total?' aria-disabled="true"':'')+'>Next</a></div>';
  h += '<button class="btn ghost" id="dv-zoom">'+(DV.zoom>1?"Fit to screen":"Zoom in")+'</button>';
  return h;
}
function drawDoc(pg){
  var cv = document.getElementById("dvc"); if(!cv || !DV.doc) return;
  DV.doc.getPage(pg).then(function(p){
    var wrap = cv.parentNode.clientWidth, base = p.getViewport({scale:1}), css = wrap*DV.zoom, dpr = Math.min(window.devicePixelRatio||1, 2);
    var vp = p.getViewport({scale: css/base.width*dpr});
    cv.width = vp.width; cv.height = vp.height; cv.style.width = css+"px"; cv.style.height = (css*base.height/base.width)+"px";
    return p.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise;
  }).catch(function(){});
}
function openDoc(dr){
  if((DV.err==="signin" || DV.err==="booksignin") && (sbUser || cloud.state==="loading")) DV.err = "", DV.id = "";
  if(DV.id === dr.id && (DV.doc || DV.loading === dr.id || DV.err)) return;
  if(DOCS[dr.id] && (DOCS[dr.id].c || DOCS[dr.id].local) && sb && !sbUser && cloud.state==="loading"){ DV.id = dr.id; DV.loading = dr.id; setTimeout(function(){ DV.loading = ""; DV.id = ""; if(docRoute(route())) render(); }, 1200); return; }
  DV.id = dr.id; DV.doc = null; DV.err = ""; DV.loading = dr.id;
  loadDoc(dr.id).then(function(doc){ if(DV.id !== dr.id) return; DV.doc = doc; DV.loading = ""; render(); },
    function(e){ if(DV.id !== dr.id) return; DV.err = typeof e === "string" ? e : "net"; DV.loading = ""; render(); });
}
function vDev(){
  return '<div class="stack"><h1>Developer notes</h1><p class="lead">Not part of the product. A running record of what you raised, what it means for the build, and where it stands.</p></div>'+
    DEVNOTES.map(function(g){ return '<section class="card"><h2>'+g[0]+'</h2>'+g[1].map(function(x){ return '<div class="dn"><span class="q">'+x[0]+'</span><span>'+x[1]+'</span><span class="a">'+x[2]+'</span></div>'; }).join("")+'</section>'; }).join("")+
    '<section class="card"><h2>Demo controls</h2><p class="note">Exam-ready needs answers on two different days. For a demo you can move the clock. Current prototype date: '+today()+'.</p><button class="btn ghost" id="tomorrow">Pretend it is tomorrow</button><button class="btn ghost" id="reset">Reset all progress</button></section>';
}

function render(){
  if(tick){ clearInterval(tick); tick = null; }
  killCity();
  var r = route(), m = r.match(/^topic-(\d)$/);
  nav.innerHTML = TABS.map(function(x){ var cur = x[0]===r || (x[0]==="plan" && /^plan\//.test(r)) || (x[0]==="map" && (m || /^doc\//.test(r) || r==="practice" || r==="level-check" || r==="context-check")); return '<a href="#'+x[0]+'"'+(cur?' aria-current="page"':'')+'>'+x[1]+'</a>'; }).join("");
  var dr = docRoute(r);
  if(!dr && DV.err){ DV.err = ""; DV.id = ""; }
  if(dr){ openDoc(dr); if(DV.doc && DV.id===dr.id){ S.docPos[dr.id] = dr.page; saveLocal(); } }
  var isPlan = /^plan(\/|$)/.test(r) || r==="journal";
  var v = isPlan ? (window.FLPlan ? window.FLPlan.view(r) : '<p class="lead">Loading the planner…</p>') : dr ? vDoc(dr) : m ? vTopic(+m[1]) : ({map:vMap, universe:vUniverse, practice:vPractice, "level-check":vCheck, "context-check":vContext, reading:vReading, "dev-notes":vDev, account:vAccount}[r] || vMap)();
  app.innerHTML = v;
  if(document.getElementById("city")) mountCity();
  if(isPlan && window.FLPlan) window.FLPlan.after(r);
  if(dr && DV.doc) drawDoc(Math.min(Math.max(1, dr.page), DV.doc.numPages));
  if(r==="reading" && S.timer && S.timer.start && R){
    if(R.kind==="pdf") drawPage();
    tick = setInterval(function(){ var c = document.getElementById("clock"); if(!c || !S.timer) return; c.textContent = clock(Math.floor((Date.now()-S.timer.start)/1000)); }, 1000);
  }
}

/* ================= events ================= */
function curEx(){ var r = route(); return r==="practice" ? S.ex : (r==="level-check" && S.check ? S.check.ex : null); }
function checkAdvance(){
  var c = S.check, x = c.ex;
  c.log.push({type:x.type, ok:x.ok && !x.hint, rating:c.rating});
  S.notes.push({topic:2, type:x.type, rating:c.rating, text:(c.text||"").slice(0,600)});
  var first = c.log[0], second = c.log[1];
  if(!second){
    c.ex = gen(first.ok ? "e3" : "e1"); c.rating = null; c.text = "";
  } else {
    c.startStep = first.ok ? (second.ok ? 4 : 3) : (second.ok ? 2 : 1);
    c.done = true; c.ex = null;
  }
}
app.addEventListener("click", function(e){
  var a = e.target.closest("a[data-start]");
  if(a){ S.ex = gen(a.dataset.start); save(); return; }
  var t = e.target.closest("button"); if(!t) return;
  var x = curEx();
  if(t.id==="hint" && x){ x.hint = true; save(); render(); return; }
  if(t.id==="check" && x){ gradeEx(x); save(); render(); if(x.ok && !x.hint) confetti(); var fb = app.querySelector(".fb"); if(fb) fb.scrollIntoView({block:"center"}); return; }
  if(t.id==="next-ex"){ S.ex = gen(nextType()); save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="check-start"){ S.check = {ex:gen("e2"), log:[], rating:null, text:"", done:false}; save(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.selfrate){ S.check.rating = t.dataset.selfrate; var f = document.getElementById("feel"); if(f) S.check.text = f.value; save(); render(); var b = document.getElementById("check-next"); if(b) b.scrollIntoView({block:"nearest"}); return; }
  if(t.id==="check-next"){ var f2 = document.getElementById("feel"); if(f2) S.check.text = f2.value; checkAdvance(); save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="check-redo"){ S.check = null; save(); render(); return; }
  if(t.dataset.tf !== undefined){ var c = S.ctx, v = t.dataset.tf === "true"; c.picked = v; if(v === CONTEXT2[c.i][1]) c.right++; save(); render(); return; }
  if(t.id==="ctx-next"){ S.ctx.i++; S.ctx.picked = null; if(S.ctx.i >= CONTEXT2.length) S.ctxDone = {right:S.ctx.right}; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="ctx-redo"){ S.ctx = null; save(); render(); return; }
  if(t.id==="ac-forgot"){ forgot(); return; }
  if(t.id==="ac-mode"){ acctMode = acctMode==="up" ? "in" : "up"; acctMsg = ""; render(); return; }
  if(t.id==="dv-zoom"){ DV.zoom = DV.zoom>1 ? 1 : 2; render(); return; }
  if(t.id==="ac-out" && sb){ sb.auth.signOut().then(function(){ sbUser = null; cloud.ref = null; cloud.assets = null; cloud.fetchFile = null; cloud.state = "signedout"; S = fresh(); saveLocal(); DV.key = null; DV.cache = {}; DV.doc = null; DV.id = ""; acctMsg = ""; setSync(); go("map"); }); return; }
  if(t.dataset.readnow){ rdFor = t.dataset.readnow; go("reading"); return; }
  if(t.dataset.readdoc){ openReadable(t.dataset.readdoc); return; }
  if(t.dataset.openfile){ var oid = t.dataset.openfile, of = S.files[oid]; if(!of) return;
    if(!window.pdfjsLib){ attachMsg[oid] = "The PDF viewer could not load."; render(); return; }
    rdFor = oid; R = null; rdMsg = "Opening "+of.name+" …"; go("reading");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
    (cloud.fetchFile ? cloud.fetchFile(of.id) : Promise.reject(0)).then(function(buf){ return window.pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise; }).then(function(doc){
      R = {kind:"pdf", doc:doc, total:doc.numPages, page:1, zoom:1, name:of.name, rid:oid}; rdMsg = ""; if(route()==="reading") render();
    }).catch(function(){ rdMsg = "The stored file could not be opened. Attach it again on the topic page."; if(route()==="reading") render(); });
    return; }
  if(t.dataset.rmfile){ var rid = t.dataset.rmfile, rf = S.files[rid];
    if(pendingRemove !== rid){ pendingRemove = rid; render(); return; }
    pendingRemove = ""; if(!rf || !cloud.assets) return;
    cloud.assets.delete(rf.id).then(function(){ delete S.files[rid]; save(); render(); }, function(){ attachMsg[rid] = "Could not remove the file. Try again."; render(); });
    return; }
  if(t.id==="rd-start" && R){ R.page = 1; R.rid = R.rid || rdFor; S.timer = {start:Date.now()}; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="rd-sample"){ R = {kind:"sample", total:SAMPLE.length, page:1, zoom:1, name:"Sample chapter", rid:""}; S.timer = {start:Date.now()}; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="rd-paper"){ var pp = +document.getElementById("rd-paper-pages").value; if(!(pp > 0)){ rdMsg = "Enter how many pages you will read on paper, then start the timer."; render(); return; }
    R = {kind:"paper", total:pp, page:pp, zoom:1, name:"paper reading", rid:rdFor}; S.timer = {start:Date.now()}; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="rd-next" && R){ R.page = Math.min(R.total, R.page+1); render(); window.scrollTo(0,0); return; }
  if(t.id==="rd-prev" && R){ R.page = Math.max(1, R.page-1); render(); window.scrollTo(0,0); return; }
  if(t.id==="rd-zoom" && R){ R.zoom = R.zoom > 1 ? 1 : 1.8; render(); return; }
  if(t.id==="rd-finish" && R){ finishReading(R.total, true); return; }
  if(t.id==="rd-early" && R){ finishReading(R.page, false); return; }
  if(t.id==="rd-cancel"){ S.timer = null; R = null; rdMsg = ""; save(); render(); window.scrollTo(0,0); return; }
  if(t.id==="tomorrow"){ S.dayOffset = (S.dayOffset||0)+1; save(); render(); return; }
  if(t.id==="reset"){ S = fresh(); save(); go("map"); return; }
});
app.addEventListener("input", function(e){
  var t = e.target, x = curEx();
  if(t.dataset.field && x){ x.values[t.dataset.field] = t.value; save(); }
  if(t.id==="feel" && S.check){ S.check.text = t.value; save(); }
});
app.addEventListener("change", function(e){
  var t = e.target;
  if(t.id==="exam"){ S.examDate = t.value; save(); render(); }
  if(t.id==="rd-for"){ rdFor = t.value; }
  if(t.id==="rd-here" && t.value){ openReadable(t.value); }
  if(t.dataset.attach && t.files && t.files[0] && cloud.assets){
    var aid = t.dataset.attach, af = t.files[0]; attachMsg[aid] = "";
    if(af.size > (cloud.maxBytes||20*1024*1024)){ attachMsg[aid] = "This file is over "+Math.round((cloud.maxBytes||20*1024*1024)/1048576)+" MB. Split the chapter or export a smaller PDF."; render(); return; }
    uploading[aid] = true; render();
    var pagesP = new Promise(function(res){
      if(!window.pdfjsLib){ res(0); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
      var fr2 = new FileReader(); fr2.onerror = function(){ res(0); };
      fr2.onload = function(){ window.pdfjsLib.getDocument({data:new Uint8Array(fr2.result)}).promise.then(function(d){ res(d.numPages); }, function(){ res(0); }); };
      fr2.readAsArrayBuffer(af);
    });
    Promise.all([cloud.assets.upload(af, {type:"application/pdf"}), pagesP]).then(function(r){
      S.files[aid] = {id:r[0].id, name:String(af.name).slice(0,80), size:r[0].sizeBytes, pages:r[1]||0};
      if(r[1]) S.pages[aid] = String(r[1]);
      delete uploading[aid]; save(); render();
    }, function(e){
      delete uploading[aid];
      attachMsg[aid] = ({too_large:"This file is too large to store.", unsupported_type:"Only PDF files can be attached.", quota_or_state:"Storage for this prototype is full. Remove a file first.", rate_limited:"Too many uploads at once. Wait a moment and try again."})[e && e.code] || "The upload did not go through. Try again.";
      render();
    });
  }
  if(t.id==="rd-file" && t.files && t.files[0]){
    var f = t.files[0];
    if(!window.pdfjsLib){ rdMsg = "The PDF viewer could not load. Use paper reading for now."; render(); return; }
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
    var fr = new FileReader();
    fr.onload = function(){
      window.pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(doc){
        R = {kind:"pdf", doc:doc, total:doc.numPages, page:1, zoom:1, name:f.name, rid:rdFor}; rdMsg = ""; render();
      }, function(){ R = null; rdMsg = "This file could not be opened as a PDF. Try another file, or export the chapter as a PDF first."; render(); });
    };
    fr.onerror = function(){ rdMsg = "The file could not be read. Try again."; render(); };
    fr.readAsArrayBuffer(f);
  }
  if(t.dataset.rate){ S.rating[t.dataset.rate] = t.value; save(); render(); }
  if(t.dataset.read){ S.read[t.dataset.read] = t.checked; save(); }
  if(t.dataset.have){ S.have[t.dataset.have] = t.checked; save(); }
  if(t.id==="dv-go"){ var dr0 = docRoute(route()); if(dr0){ var n0 = parseInt(t.value,10); if(n0>0) go("doc/"+dr0.id+"/"+n0); } }
  if(t.dataset.pages){ S.pages[t.dataset.pages] = t.value; save(); render(); }
});
app.addEventListener("submit", function(e){
  var f = e.target; e.preventDefault();
  if(f.id==="ac-form"){ var sub = e.submitter, kind = (sub && sub.value) || "in"; acct(kind==="up" ? "up" : "in"); }

document.addEventListener("change", function(e){
  var bp = e.target && e.target.dataset && e.target.dataset.bookpick;
  if(bp && e.target.files && e.target.files[0]){
    var f = e.target.files[0]; bookMsg = "Saving "+f.name+" on this device …"; render();

      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
      return window.pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise.then(function(doc){

        if(n!==BOOKS[k].pages) bookMsg = "This PDF has "+n+" pages, not "+BOOKS[k].pages+", so it may be another edition and the page links can be off. ";
        else bookMsg = "";
        return bookPut(k, buf).then(function(){ haveBooks[k] = true; delete DV.cache["bk-"+k]; if(DV.id==="bk-"+k){ DV.id = ""; DV.err = ""; }
          bookMsg += BOOKS[k].s+" saved on this device."; render(); });
      });
    }).catch(function(){ bookMsg = "That file could not be saved. Is it a PDF? If your phone is low on storage, free some space and try again."; render(); });

  }
  if(e.target && (e.target.id==="ac-show" || e.target.id==="pw-show")){
    showPw = e.target.checked; var a = document.getElementById("ac-pass") || document.getElementById("pw-new"); if(a) a.type = showPw ? "text" : "password";
  }
});
window.addEventListener("hashchange", function(){ render(); window.scrollTo(0,0); });
